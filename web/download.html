<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chabad Shetachim Map – Downloads</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #f1f3f0; color: #1e2b32; font: 17px/1.4 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 24px; }
  .back { color: #1d4f8f; font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  h2 { margin: 34px 0 12px; font-size: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { flex: 1 1 160px; padding: 12px 14px; border-radius: 10px; background: #1d4f8f; color: #fff; text-decoration: none; text-align: center; font-weight: 600; }
  a.btn.view { background: #fff; color: #1d4f8f; border: 1.5px solid #1d4f8f; }
  img { display: block; width: 100%; margin-top: 14px; border: 1px solid #d2d9dc; background: #fff; }
</style>
</head>
<body>
<main id="page"></main>
<script>
// Every map, with buttons to open it (view) and to save it (download), as SVG and as PNG. ?lang=he: in Hebrew.
const HE = new URLSearchParams(location.search).get('lang') === 'he';
if (HE) { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; document.title = 'מפת שטחי חב״ד – הורדות'; }
const T = HE
  ? { title: 'הורדת מפות', back: '→ חזרה למפה', viewSvg: 'צפייה ב־<bdi>SVG</bdi>', viewPng: 'צפייה ב־<bdi>PNG</bdi>', getSvg: 'הורדת SVG', getPng: 'הורדת PNG' }
  : { title: 'Download maps', back: '← Back to the map', viewSvg: 'View SVG', viewPng: 'View PNG', getSvg: 'Download SVG', getPng: 'Download PNG' };
const MAPS = [
  ['shetachim-map-names', 'World, with head shluchim', 'עולם, עם השלוחים הראשיים'],
  ['shetachim-map-names-he', 'World, with head shluchim (Hebrew)', 'עולם, עם השלוחים הראשיים (עברית)'],
  ['shetachim-us-canada-names', 'US & Canada, with head shluchim', 'ארה״ב וקנדה, עם השלוחים הראשיים'],
  ['shetachim-us-canada-names-he', 'US & Canada, with head shluchim (Hebrew)', 'ארה״ב וקנדה, עם השלוחים הראשיים (עברית)'],
  ['shetachim-map', 'World', 'עולם'],
  ['shetachim-us-canada', 'US & Canada', 'ארה״ב וקנדה'],
];
// in Hebrew, the Hebrew maps first
if (HE) MAPS.sort((a, b) => b[0].endsWith('-he') - a[0].endsWith('-he'));
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
document.getElementById('page').innerHTML = `<a class="back" href="./${HE ? '?lang=he' : ''}">${T.back}</a><h1>${T.title}</h1>`
  + MAPS.map(([f, en, he]) => `<h2>${esc(HE ? he : en)}</h2><div class="row">
    <a class="btn view" href="${f}.svg" target="_blank" rel="noopener">${T.viewSvg}</a>
    <a class="btn view" href="${f}.png" target="_blank" rel="noopener">${T.viewPng}</a>
    <a class="btn" href="${f}.svg" download="${f}.svg">${T.getSvg}</a>
    <a class="btn" href="${f}.png" download="${f}.png">${T.getPng}</a></div>
    <a href="${f}.png" target="_blank" rel="noopener"><img src="${f}.png" alt="${esc(HE ? he : en)}" loading="lazy"></a>`).join('');
</script>
</body>
</html>
