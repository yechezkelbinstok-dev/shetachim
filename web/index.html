<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page head -->
<title>Shetachim Map</title>
<link rel="icon" href="data:,">
<script>try { const t = localStorage.getItem('shetachim-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: full-bleed map of the shetachim alone on a plain ground (or on a physical map); options card top-left (bottom sheet on phones); zoom buttons bottom-right. */
:root {
  --bg: #f1f3f0;
  --ink: #1e2b32;
  --halo: #ffffff;
  --dot: #163e74;
  --panel: #fbfcfb;
  --panel-line: #d2d9dc;
  --muted: #5a6870;
  --missing: #86939a;
  --accent: #1d4f8f;
  --accent-soft: #e3ebf5;
  --c1: #f0e1a2; --c2: #cce1b5; --c3: #efc7c1; --c4: #c5d9ee;
  --c5: #f3cfa9; --c6: #d8c8e5; --c7: #bcded6; --c8: #e1d8be;
  --plain: #fcfcfa;
  /* what the map draws with: the theme's colors, except on the physical map, which is always light */
  --map-ink: var(--ink); --map-halo: var(--halo); --map-dot: var(--dot); --map-accent: var(--accent); --map-missing: var(--missing);
  --font-ui: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --font-map: "Alegreya Sans SC", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 1px 2px rgb(20 35 45 / .08), 0 6px 20px rgb(20 35 45 / .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
    --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
    --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
    --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
    --plain: #223036;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
  --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
  --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
  --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
  --plain: #223036;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
.physical #map { --map-ink: #1e2b32; --map-halo: #ffffff; --map-dot: #163e74; --map-accent: #1d4f8f; --map-missing: #6b7780; }

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-ui); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#basemap, #map { position: absolute; inset: 0; width: 100%; height: 100%; }
#map { display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map:active { cursor: grabbing; }
.physical #map { pointer-events: none; }
#app:not(.physical) #basemap { visibility: hidden; }
.physical .l-root, .physical .l-insets { display: none; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- map ---- */
.fill { fill: var(--fill); stroke: var(--fill); stroke-width: .5; vector-effect: non-scaling-stroke; transition: fill-opacity .25s; }
.fill.blank { fill: none; stroke: none; }
.ln { fill: none; stroke: var(--map-ink); vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; transition: opacity .25s; pointer-events: none; }
.b-coast { stroke-width: 1.1; }
.b-shetach { stroke-width: 1.3; }
.b-regular { stroke-width: 1; }
.b-country { stroke-width: 1.8; }
.hit { fill: transparent; }
.hover-ring { fill: none; stroke: var(--map-accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.dot { fill: var(--map-dot); fill-opacity: .42; pointer-events: none; }
.dot-hover { fill: none; stroke: var(--map-accent); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }

/* which fills and lines each border mode shows */
.borders-regular .l-fill-s, .borders-shetach .l-fill-u, .borders-both .l-fill-u { display: none; }
.borders-shetach .b-regular, .borders-shetach .b-country, .borders-regular .b-shetach { opacity: 0; }
.borders-both .b-regular { stroke-dasharray: 2 3; }
.borders-both.lighter-regular .b-regular, .borders-both.lighter-regular .b-country { opacity: .35; }
.borders-both.lighter-shetach .b-shetach { opacity: .3; }
.borders-both.lighter-shetach .l-fill-s .fill { fill-opacity: .55; }
.no-dots .dot, .no-dots .dot-hover { display: none; }

.lab { paint-order: stroke; stroke: var(--map-halo); stroke-opacity: .7; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none;
  font-family: var(--font-map); font-weight: 700; letter-spacing: .05em; fill: var(--map-ink); }
.lab-missing { fill: var(--map-missing); font-weight: 500; }
.physical .lab { stroke-opacity: .9; }

/* cities with shluchim and shetach capitals: drawn in screen space, over everything else */
.mk { pointer-events: none; }
.mk-city { fill: var(--map-halo); stroke: var(--map-ink); stroke-width: 1.4; }
.mk-cap { fill: var(--map-ink); stroke: var(--map-halo); stroke-width: 1.3; stroke-linejoin: round; paint-order: stroke; }
.mk-lab { font: 500 12.5px var(--font-ui); fill: var(--map-ink); dominant-baseline: central;
  paint-order: stroke; stroke: var(--map-halo); stroke-width: 3px; stroke-opacity: .8; stroke-linejoin: round; }
.physical .mk-lab { stroke-opacity: .95; }

.l-insets { transition: opacity .25s; }
.l-insets.away { opacity: 0; pointer-events: none; }
.inset-frame { fill: none; stroke: var(--panel-line); }
.inset-land { fill: var(--fill); stroke: var(--map-ink); stroke-width: 1; }
.borders-regular .inset-land { fill: var(--fill-u); }
.plain .fill, .plain .inset-land { fill: var(--plain); }
.plain .fill { stroke: var(--plain); }
.plain .fill.blank { fill: none; stroke: none; }
.inset-caption { font: 700 11px var(--font-map); letter-spacing: .06em; fill: var(--map-ink); }
.inset-caption.lab-missing { fill: var(--map-missing); font-weight: 500; }

/* ---- physical map (MapLibre): only the rules this page uses ---- */
.maplibregl-map { position: absolute; overflow: hidden; -webkit-tap-highlight-color: transparent; font: 12px/18px var(--font-ui); }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas { touch-action: pan-x pan-y; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-ctrl-top-right { position: absolute; top: 0; right: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl { clear: both; float: right; pointer-events: auto; }
.maplibregl-ctrl-attrib { position: relative; margin: 10px; padding: 2px 8px; min-height: 20px; box-sizing: content-box;
  background: var(--panel); color: var(--muted); border: 1px solid var(--panel-line); border-radius: 12px; }
.maplibregl-ctrl-attrib a { color: inherit; }
.maplibregl-attrib-empty { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact { padding: 2px 24px 2px 0; }
.maplibregl-ctrl-attrib.maplibregl-compact-show { padding: 2px 28px 2px 8px; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-inner { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner { display: block; }
.maplibregl-ctrl-attrib-button { display: none; position: absolute; top: 0; right: 0; width: 24px; height: 24px; border-radius: 12px; cursor: pointer;
  list-style: none; appearance: none; -webkit-appearance: none;
  background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%236b7780' fill-rule='evenodd' viewBox='0 0 20 20'%3E%3Cpath d='M4 10a6 6 0 1 0 12 0 6 6 0 1 0-12 0m5-3a1 1 0 1 0 2 0 1 1 0 1 0-2 0m0 3a1 1 0 1 1 2 0v3a1 1 0 1 1-2 0'/%3E%3C/svg%3E") center / 20px no-repeat; }
.maplibregl-ctrl-attrib-button::-webkit-details-marker { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-button { display: block; }

/* ---- options panel ---- */
#panel {
  position: absolute; z-index: 3; top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
.p-head h1 { margin: 0; font: 700 22px/1.1 var(--font-map); letter-spacing: .05em; text-wrap: balance; }
.p-head .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
#panel-toggle { display: none; }
.p-actions { display: flex; align-items: center; gap: 8px; flex: none; }
#theme-toggle { width: 34px; height: 34px; padding: 0; border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
#theme-toggle:hover { border-color: var(--accent); }
#theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#panel-body { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 10px 0; border-block: 1px solid var(--panel-line); }
.stats div { min-width: 0; }
.stats dt { font: 500 10.5px var(--font-map); letter-spacing: .08em; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
fieldset.ctl { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
fieldset.ctl legend { padding: 0; margin-bottom: 7px; font: 500 12px var(--font-map); letter-spacing: .1em; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 4px 11px; cursor: pointer;
  font-size: 13.5px; line-height: 1.3; transition: background .15s, border-color .15s;
}
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.seg-label { align-self: center; font-size: 13px; color: var(--muted); margin-right: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); opacity: .55; }
.legend-ring { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--halo); }
.legend-star { width: 12px; height: 12px; fill: var(--ink); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.error { margin: 0; color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; }

/* ---- zoom buttons ---- */
#zoomctl { position: absolute; z-index: 3; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
#zoomctl button { width: 38px; height: 38px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
#zoomctl button + button { border-top: 1px solid var(--panel-line); }
#zoomctl button:hover { background: var(--accent-soft); }
#zoomctl svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* ---- info card ---- */
#card {
  position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 32px); max-height: 60%; overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 14px; pointer-events: none;
}
#card.pinned { pointer-events: auto; }
#card.pinned > ul:first-child > li:first-child { padding-right: 24px; }
#card h2 { margin: 0 22px 4px 0; font: 700 16px/1.25 var(--font-ui); text-wrap: balance; }
#card .kicker { display: block; font: 500 11px var(--font-map); letter-spacing: .1em; color: var(--muted); margin-bottom: 2px; }
#card .kicker-world { color: var(--accent); font-weight: 700; }
#card.world { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
#card ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#card li { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#card li strong { font-weight: 500; }
#card .meta, #card p { color: var(--muted); font-size: 13px; margin: 0; }
#card .flag { font-size: 12.5px; font-style: italic; color: var(--muted); }
#card .flag-world { color: var(--accent); font-weight: 600; font-style: normal; }
#card .person { font-size: 13px; margin: 2px 0 0; }
#card .personnel { margin: 2px 0 0; pointer-events: auto; }
#card .personnel summary { cursor: pointer; font-size: 12px; color: var(--accent); list-style: none; }
#card .personnel summary::-webkit-details-marker { display: none; }
#card .personnel .pother { font-size: 13px; margin-top: 3px; padding-left: 10px; }
#card a { color: var(--accent); font-size: 13px; }
#card .foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
#card .close { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; display: none; }
#card.pinned .close { display: grid; place-items: center; }
#card .close:hover { background: var(--accent-soft); }
#card .zoomto { border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
#card .zoomto:hover { border-color: var(--accent); }

/* ---- phones: the options become a bottom sheet ---- */
@media (max-width: 760px) {
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 70%; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .p-head { align-items: center; padding: 10px 16px; }
  .p-head h1 { font-size: 19px; }
  #panel-toggle { display: block; border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 14px; }
  #panel.collapsed #panel-body { display: none; }
  #zoomctl { bottom: calc(var(--sheet, 64px) + 12px); }
  #card, #card.pinned { left: 16px !important; right: 16px; top: auto !important; bottom: calc(var(--sheet, 64px) + 12px); width: auto; max-height: 45%; }
}
@media (prefers-reduced-motion: reduce) {
  .fill, .ln, .l-insets, .seg button { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="basemap"></div>
  <svg id="map" role="img" aria-label="Map of Chabad shetachim and centers"></svg>

  <aside id="panel" class="collapsed" aria-label="Map options">
    <header class="p-head">
      <div>
        <h1>Shetachim</h1>
        <p class="sub" id="view-name">United States &amp; Canada</p>
      </div>
      <div class="p-actions">
        <button id="theme-toggle" type="button"></button>
        <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body">Options</button>
      </div>
    </header>
    <div id="panel-body">
      <p id="load-error" class="error" hidden></p>
      <dl class="stats">
        <div><dt>Shetachim</dt><dd id="st-shetachim">–</dd></div>
        <div><dt>Centers</dt><dd id="st-centers">–</dd></div>
        <div><dt>Dots</dt><dd id="st-dots">–</dd></div>
      </dl>
      <fieldset class="ctl">
        <legend>Show</legend>
        <div class="seg" data-name="view">
          <button type="button" data-value="na" aria-pressed="true">US &amp; Canada</button>
          <button type="button" data-value="us" aria-pressed="false">USA</button>
          <button type="button" data-value="ca" aria-pressed="false">Canada</button>
        </div>
      </fieldset>
      <fieldset class="ctl">
        <legend>Map</legend>
        <div class="seg" data-name="base">
          <button type="button" data-value="political" aria-pressed="true">Political</button>
          <button type="button" data-value="physical" aria-pressed="false">Physical</button>
        </div>
        <p id="base-msg" class="note" role="status" hidden></p>
      </fieldset>
      <fieldset class="ctl">
        <legend>Borders</legend>
        <div class="seg" data-name="borders">
          <button type="button" data-value="shetach" aria-pressed="true">Shetachim</button>
          <button type="button" data-value="regular" aria-pressed="false">States</button>
          <button type="button" data-value="both" aria-pressed="false">Both</button>
        </div>
        <div class="seg" data-name="lighter" id="lighter-row" hidden>
          <span class="seg-label">Lighter:</span>
          <button type="button" data-value="regular" aria-pressed="true">States</button>
          <button type="button" data-value="shetach" aria-pressed="false">Shetachim</button>
        </div>
      </fieldset>
      <fieldset class="ctl" id="colors-ctl">
        <legend>Colors</legend>
        <div class="seg" data-name="color">
          <button type="button" data-value="colorful" aria-pressed="true">Colorful</button>
          <button type="button" data-value="plain" aria-pressed="false">Plain</button>
        </div>
      </fieldset>
      <fieldset class="ctl">
        <legend>Labels</legend>
        <div class="seg" data-name="labels">
          <button type="button" data-value="name" aria-pressed="true">Shetach name</button>
          <button type="button" data-value="full" aria-pressed="false">Head shliach</button>
          <button type="button" data-value="last" aria-pressed="false">Last name</button>
          <button type="button" data-value="off" aria-pressed="false">Off</button>
        </div>
        <label class="check" for="show-dots"><input type="checkbox" id="show-dots" checked> <span class="legend-dot" aria-hidden="true"></span> Chabad centers</label>
        <label class="check" for="show-cities"><input type="checkbox" id="show-cities" checked> <span class="legend-ring" aria-hidden="true"></span> Cities with shluchim</label>
        <label class="check" for="show-capitals"><input type="checkbox" id="show-capitals" checked> <svg class="legend-star" viewBox="-7.5 -7.5 15 15" aria-hidden="true"><path id="star-shape"/></svg> Shetach capitals</label>
      </fieldset>
    </div>
  </aside>

  <div id="zoomctl" role="group" aria-label="Zoom">
    <button id="zin" type="button" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <button id="zout" type="button" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    <button id="zreset" type="button" aria-label="Show all"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
  </div>

  <div id="card" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d3.format(',');
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const phone = () => window.matchMedia('(max-width: 760px)').matches;
  const coarse = () => window.matchMedia('(pointer: coarse)').matches;
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { view: 'na', base: 'political', borders: 'shetach', lighter: 'regular', color: 'colorful', labels: 'name', dots: true, cities: true, capitals: true };
  if (!phone()) $('#panel').classList.remove('collapsed');

  // ---------- data ----------
  const get = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(`${url} (${r.status})`); return r.json(); });
  let topo, centersGeo, shetachFile;
  try {
    [topo, centersGeo, shetachFile] = await Promise.all([get('data/geo.json'), get('data/centers.geojson'), get('data/shetachim.json')]);
  } catch (err) {
    $('#panel').classList.remove('collapsed');
    $('#load-error').hidden = false;
    $('#load-error').textContent = `The map data didn't load (${err.message}). Reload the page to try again.`;
    return;
  }
  const cityFile = await get('data/cities.json').catch(() => []);

  // Pieces: whole states and provinces, and the parts of states split between shetachim. Each knows its
  // state and its shetach (none where no shetach is entered yet).
  const notShown = new Set(shetachFile.notShown || []);
  const pieces = topo.objects.areas.geometries.filter((g) => !notShown.has(g.properties.state));
  const pieceById = new Map(pieces.map((g) => [g.properties.id, g]));
  const collection = (geometries) => ({ type: 'GeometryCollection', geometries });
  const shetachById = new Map(shetachFile.shetachim.map((s) => [s.id, {
    ...s, lastName: s.lastName || (s.headShliach ? s.headShliach.trim().split(/\s+/).pop() : ''), states: new Set(), pieces: [],
  }]));
  const shetachOf = (g) => shetachById.get(g.properties.shetach) || null;
  for (const g of pieces) {
    const s = shetachOf(g);
    if (s) { s.states.add(g.properties.state); s.pieces.push(g); }
  }
  const stateName = new Map(pieces.map((g) => [g.properties.state, g.properties.name]));

  const dots = centersGeo.features
    .map((f) => ({ lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], ...f.properties, piece: f.properties.piece || f.properties.region }))
    .filter((d) => pieceById.has(d.piece));
  const centersIn = new Map();
  for (const d of dots) centersIn.set(d.piece, (centersIn.get(d.piece) || 0) + d.centers.length);
  const centersInShetach = (s) => d3.sum(s.pieces, (g) => centersIn.get(g.properties.id) || 0);
  const centersInState = (st) => d3.sum(pieces, (g) => (g.properties.state === st ? centersIn.get(g.properties.id) || 0 : 0));
  const dotOfCenter = new Map(dots.flatMap((d) => d.centers.map((c) => [c.id, d])));

  // A capital is a star at the shetach's headquarters (the build worked out where it is); 770 gets a bigger one.
  const capitals = [...shetachById.values()].filter((s) => s.capital && Number.isFinite(s.capital.lat)).map((s) => {
    const dot = dotOfCenter.get(s.capital.centerId);
    return { s, ...s.capital, piece: dot ? dot.piece : s.pieces[0] && s.pieces[0].properties.id, center: dot && dot.centers.find((c) => c.id === s.capital.centerId) };
  });
  const capitalOfCenter = new Map(capitals.filter((c) => c.centerId).map((c) => [c.centerId, c]));
  // Bigger cities are labelled first and from further out. A city with many centers counts as big even when
  // GeoNames doesn't know it (Thornhill), so weigh each center as 5,000 people.
  const cities = cityFile.map((c) => ({ ...c, piece: c.piece || c.region })).filter((c) => pieceById.has(c.piece))
    .map((c) => ({ ...c, texts: [c.name], weight: Math.max(c.pop, c.centers * 5000) }))
    .sort((a, b) => b.weight - a.weight);
  const CITY_DENSITY = 2500; // a city is a candidate once weight >= CITY_DENSITY / (screen pixels per km)²

  // Neighbours never share a colour; colours are spread evenly. Worked out once, so they stay put across views.
  function colorize(keyOf) {
    const adj = new Map();
    const touch = (k) => adj.get(k) || adj.set(k, new Set()).get(k);
    topojson.neighbors(pieces).forEach((list, i) => {
      const a = keyOf(pieces[i]);
      if (a == null) return;
      touch(a);
      for (const j of list) { const b = keyOf(pieces[j]); if (b != null && a !== b) { touch(a).add(b); touch(b).add(a); } }
    });
    const color = new Map(), used = new Array(8).fill(0);
    [...adj.keys()].sort((a, b) => adj.get(b).size - adj.get(a).size || (a < b ? -1 : 1)).forEach((k) => {
      const taken = new Set([...adj.get(k)].map((n) => color.get(n)));
      let best = -1;
      for (let c = 0; c < 8; c++) if (!taken.has(c) && (best < 0 || used[c] < used[best])) best = c;
      if (best < 0) best = 0;
      color.set(k, best);
      used[best]++;
    });
    return (k) => `var(--c${color.get(k) + 1})`;
  }
  const shetachColor = colorize((g) => g.properties.shetach || null);
  const stateColor = colorize((g) => g.properties.state);

  // ---------- views ----------
  const VIEWS = {
    na: { name: 'United States & Canada', countries: ['US', 'CA'], insets: ['US-AK', 'US-HI'], projection: () => d3.geoConicEqualArea().parallels([30, 58]).rotate([96, 0]) },
    us: { name: 'United States', countries: ['US'], insets: ['US-AK', 'US-HI'], projection: () => d3.geoConicEqualArea().parallels([29.5, 45.5]).rotate([96, 0]) },
    ca: { name: 'Canada', countries: ['CA'], insets: [], projection: () => d3.geoConicEqualArea().parallels([49, 62]).rotate([96, 0]) },
  };
  const INSETS = {
    'US-AK': { share: 0.2, aspect: 0.7, projection: () => d3.geoConicEqualArea().parallels([55, 65]).rotate([154, 0]) },
    'US-HI': { share: 0.13, aspect: 0.62, projection: () => d3.geoConicEqualArea().parallels([8, 18]).rotate([157, 0]) },
  };

  // ---------- svg ----------
  const svg = d3.select('#map');
  const root = svg.append('g').attr('class', 'l-root');
  const gFillS = root.append('g').attr('class', 'l-fill-s');
  const gFillU = root.append('g').attr('class', 'l-fill-u');
  const gLines = root.append('g');
  const gHit = root.append('g');
  const gDots = root.append('g');
  const gHover = root.append('g');
  const gLabels = svg.append('g'); // screen space: text stays crisp at any zoom
  const gMarks = svg.append('g'); // cities and capitals, also screen space
  const gInsets = svg.append('g').attr('class', 'l-insets');

  const STAR = d3.symbol(d3.symbolStar, 55)(); // about 14px across
  const WORLD_STAR = d3.symbol(d3.symbolStar, 150)(); // 770: about 23px across
  $('#star-shape').setAttribute('d', STAR);

  // T maps projected points to the screen. On the political map it's the d3 zoom; on the physical map it
  // follows the MapLibre camera, with the same projection-at-zoom-1 coordinates, so labels work the same.
  let W = 0, H = 0, T = d3.zoomIdentity, V = null, labels = [], tree = null, insetBoxes = [], marks = [];
  let projection = null, geoPath = null;
  const measure = document.createElement('canvas').getContext('2d');

  function insets() {
    const r = $('#panel').getBoundingClientRect();
    return phone() ? { l: 16, t: 16, r: 16, b: r.height + 12 } : { l: r.right + 16, t: 16, r: 64, b: 16 };
  }

  const meshes = (main) => {
    const m = (filter) => topojson.mesh(topo, collection(main), filter);
    const key = (g) => g.properties.shetach || '';
    return [
      ['regular', m((a, b) => a.properties.state !== b.properties.state && a.properties.country === b.properties.country)],
      ['country', m((a, b) => a.properties.country !== b.properties.country)],
      ['shetach', m((a, b) => a !== b && key(a) !== key(b))],
      ['coast', m((a, b) => a === b)],
    ];
  };

  // opts.focus: {ll, k} to keep looking at the same place (switching maps); opts.keep: leave the physical map's camera alone.
  function layout(opts = {}) {
    W = svg.node().clientWidth;
    H = svg.node().clientHeight;
    document.documentElement.style.setProperty('--sheet', `${$('#panel').getBoundingClientRect().height}px`);
    const view = VIEWS[state.view];
    const physical = state.base === 'physical';
    const shown = pieces.filter((g) => view.countries.includes(g.properties.country));
    const insetStates = physical ? [] : view.insets; // the physical map has Alaska and Hawaii in their real place
    const main = shown.filter((g) => !insetStates.includes(g.properties.state));
    const framed = shown.filter((g) => !view.insets.includes(g.properties.state)); // both maps frame the same area
    const regions = [...d3.group(main.filter(shetachOf), shetachOf)].map(([s, gs]) => ({ s, geo: topojson.merge(topo, gs) }));
    const blanks = [...d3.group(main.filter((g) => !shetachOf(g)), (g) => g.properties.state)].map(([st, gs]) => ({ st, geo: topojson.merge(topo, gs) }));
    const states = [...d3.group(main, (g) => g.properties.state)].map(([st, gs]) => ({ st, p: gs[0].properties, geo: topojson.merge(topo, gs) }));
    V = { view, physical, shown, main, regions, blanks, states, index: {}, insetPieces: shown.filter((g) => insetStates.includes(g.properties.state)) };

    const p = insets();
    projection = (physical ? d3.geoMercator() : view.projection()).fitExtent([[p.l, p.t], [W - p.r, H - p.b]], topojson.feature(topo, collection(framed)));
    geoPath = d3.geoPath(projection);
    if (physical) V.zFit = Math.log2((2 * Math.PI * projection.scale()) / 512); // MapLibre zoom of the framed view

    if (physical) {
      for (const g of [gFillS, gFillU, gLines, gHit, gDots, gHover]) g.selectAll('*').remove();
    } else {
      gFillS.selectAll('path').data([...regions, ...blanks]).join('path').attr('class', (r) => (r.s ? 'fill' : 'fill blank'))
        .style('--fill', (r) => (r.s ? shetachColor(r.s.id) : null)).attr('d', (r) => geoPath(r.geo));
      gFillU.selectAll('path').data(states).join('path').attr('class', 'fill')
        .style('--fill', (r) => stateColor(r.st)).attr('d', (r) => geoPath(r.geo));
      gLines.selectAll('path').data(meshes(main)).join('path').attr('class', ([c]) => `ln b-${c}`).attr('d', ([, g]) => geoPath(g));
      gHit.selectAll('path').data(main.map((g) => topojson.feature(topo, g))).join('path').attr('class', 'hit').attr('d', geoPath);
    }

    const mainIds = new Set(main.map((g) => g.properties.id));
    if (physical) V.hitAreas = main.map((g) => { const f = topojson.feature(topo, g); return { g, f, box: d3.geoBounds(f) }; });
    V.dots = dots.filter((d) => mainIds.has(d.piece));
    for (const d of V.dots) [d.x, d.y] = projection([d.lon, d.lat]);
    tree = d3.quadtree(V.dots, (d) => d.x, (d) => d.y);
    if (!physical) gDots.selectAll('circle').data(V.dots).join('circle').attr('class', 'dot').attr('cx', (d) => d.x).attr('cy', (d) => d.y);
    V.caps = capitals.filter((c) => mainIds.has(c.piece));
    V.cities = cities.filter((c) => mainIds.has(c.piece));
    for (const c of [...V.caps, ...V.cities]) [c.x, c.y] = projection([c.lon, c.lat]);
    const ui = getComputedStyle(document.documentElement).getPropertyValue('--font-ui');
    measure.font = `500 ${MARK_FONT}px ${ui}`;
    for (const c of V.cities) if (!c.widths) c.widths = c.texts.map((t) => measure.measureText(t).width);
    const [lon0, lat0] = projection.invert([W / 2, H / 2]);
    const a = projection([lon0, lat0]), b = projection([lon0, lat0 + 1]);
    V.pxPerKm = Math.hypot(b[0] - a[0], b[1] - a[1]) / 111.2; // at zoom 1

    for (const r of [...regions, ...blanks, ...states]) r.polys = projectedPolygons(r.geo);
    for (const r of [...regions, ...states]) r.anchor = anchorFor(r.polys);
    drawInsets(p);

    const shownIds = new Set(shown.map((g) => g.properties.id));
    const viewDots = dots.filter((d) => shownIds.has(d.piece));
    $('#view-name').textContent = view.name;
    $('#st-shetachim').textContent = fmt(new Set(shown.map((g) => g.properties.shetach).filter(Boolean)).size);
    $('#st-centers').textContent = fmt(d3.sum(viewDots, (d) => d.centers.length));
    $('#st-dots').textContent = fmt(viewDots.length);

    const start = opts.focus ? transformFor(opts.focus) : d3.zoomIdentity;
    if (physical) {
      mapgl.resize();
      mapgl.setMinZoom(Math.max(0, V.zFit - 1.5));
      dataGL();
      if (!opts.keep) mapgl.jumpTo(cameraFor(start));
      syncCamera();
    } else {
      zoom.translateExtent([[-W * 0.5, -H * 0.5], [W * 1.5, H * 1.5]]);
      svg.call(zoom.transform, zoom.constrain()(start, [[0, 0], [W, H]], zoom.translateExtent()));
    }
  }

  // Where the middle of the screen is, and how far in from the framed view: survives switching maps.
  function focusNow() {
    return { ll: projection.invert(T.invert([W / 2, H / 2])), k: T.k };
  }
  function transformFor({ ll, k }) {
    const pt = ll && projection(ll);
    if (!pt || !pt.every(Number.isFinite)) return d3.zoomIdentity;
    if (!V.physical) k = clamp(k, 1, 60);
    return d3.zoomIdentity.translate(W / 2 - k * pt[0], H / 2 - k * pt[1]).scale(k);
  }

  // ---------- Alaska and Hawaii boxes ----------
  function drawInsets(p) {
    gInsets.selectAll('*').remove();
    insetBoxes = [];
    let x = p.l;
    for (const g of V.insetPieces) {
      const spec = INSETS[g.properties.state];
      const w = clamp((W - p.l - p.r) * spec.share, 80, 260), h = w * spec.aspect, y = H - p.b - h;
      const feature = topojson.feature(topo, g);
      const proj = spec.projection().fitExtent([[x + 6, y + 18], [x + w - 6, y + h - 6]], feature);
      const box = { piece: g, x, y, w, h, proj, dots: dots.filter((d) => d.piece === g.properties.id) };
      const s = shetachOf(g);
      const group = gInsets.append('g');
      group.append('rect').attr('class', 'inset-frame').attr('x', x).attr('y', y).attr('width', w).attr('height', h).attr('rx', 6);
      group.append('path').datum(feature).attr('class', 'inset-land')
        .style('--fill', s ? shetachColor(s.id) : 'none').style('--fill-u', stateColor(g.properties.state)).attr('d', d3.geoPath(proj));
      box.caption = group.append('text').attr('class', 'inset-caption').attr('x', x + 8).attr('y', y + 13);
      group.selectAll('circle').data(box.dots).join('circle').attr('class', 'dot')
        .attr('cx', (d) => proj([d.lon, d.lat])[0]).attr('cy', (d) => proj([d.lon, d.lat])[1])
        .attr('r', (d) => 2.2 + 0.5 * Math.log2(d.centers.length));
      insetBoxes.push(box);
      x += w + 10;
    }
  }

  // ---------- labels ----------
  // Pole of inaccessibility: the point inside a polygon farthest from its edges (after mapbox/polylabel).
  function polylabel(rings, precision) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of rings[0]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const size = Math.min(x1 - x0, y1 - y0);
    if (!(size > 0)) return [x0, y0];
    const cell = (x, y, h) => { const d = signedDistance(x, y, rings); return { x, y, h, d, max: d + h * Math.SQRT2 }; };
    const queue = [];
    for (let x = x0; x < x1; x += size) for (let y = y0; y < y1; y += size) queue.push(cell(x + size / 2, y + size / 2, size / 2));
    const c = d3.polygonCentroid(rings[0]);
    let best = cell(c[0], c[1], 0);
    const mid = cell((x0 + x1) / 2, (y0 + y1) / 2, 0);
    if (mid.d > best.d) best = mid;
    while (queue.length) {
      let bi = 0;
      for (let i = 1; i < queue.length; i++) if (queue[i].max > queue[bi].max) bi = i;
      const q = queue[bi];
      queue[bi] = queue[queue.length - 1];
      queue.pop();
      if (q.d > best.d) best = q;
      if (q.max - best.d <= precision) continue;
      const h = q.h / 2;
      queue.push(cell(q.x - h, q.y - h, h), cell(q.x + h, q.y - h, h), cell(q.x - h, q.y + h, h), cell(q.x + h, q.y + h, h));
    }
    return [best.x, best.y];
  }
  function signedDistance(px, py, rings) {
    let inside = false, min = Infinity;
    for (const ring of rings) {
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const a = ring[i], b = ring[j];
        if ((a[1] > py) !== (b[1] > py) && px < ((b[0] - a[0]) * (py - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
        let x = b[0], y = b[1], dx = a[0] - x, dy = a[1] - y;
        if (dx || dy) {
          const t = ((px - x) * dx + (py - y) * dy) / (dx * dx + dy * dy);
          if (t > 1) { x = a[0]; y = a[1]; } else if (t > 0) { x += dx * t; y += dy * t; }
        }
        min = Math.min(min, (px - x) ** 2 + (py - y) ** 2);
      }
    }
    return (inside ? 1 : -1) * Math.sqrt(min);
  }

  // Each polygon of a geometry as rings of map pixels (zoom 1).
  function projectedPolygons(geometry) {
    const polys = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.type === 'MultiPolygon' ? geometry.coordinates : [];
    return polys.map((poly) => poly.map((ring) => ring.map((c) => projection(c)))).filter((rings) => rings.every((ring) => ring.every(Boolean)));
  }

  // Where an area's label looks for room first: the middle of each of its bigger polygons, biggest first.
  // The biggest polygon's area sets the label's size.
  function anchorFor(polys) {
    const sized = polys.map((rings) => ({ rings, area: Math.abs(d3.polygonArea(rings[0])) })).sort((a, b) => b.area - a.area);
    if (!sized.length || !(sized[0].area > 0)) return null;
    const points = sized.filter((q, i) => i < 4 && q.area >= sized[0].area * 0.05).map((q) => polylabel(q.rings, 0.5));
    return { points, area: sized[0].area };
  }

  // The edges of the labelled areas filed by height, so where a horizontal line crosses them is quick to find.
  function edgeIndex(areas) {
    let y0 = Infinity, y1 = -Infinity;
    for (const r of areas) for (const rings of r.polys) for (const pt of rings[0]) { y0 = Math.min(y0, pt[1]); y1 = Math.max(y1, pt[1]); }
    const n = Math.max(1, Math.ceil((y1 - y0) / 2)), step = (y1 - y0) / n || 1, bands = Array.from({ length: n }, () => []);
    areas.forEach((r, id) => {
      for (const rings of r.polys) for (const ring of rings) for (let i = 1; i < ring.length; i++) {
        const a = ring[i - 1], b = ring[i];
        if (a[1] === b[1]) continue;
        const lo = Math.max(0, Math.floor((Math.min(a[1], b[1]) - y0) / step)), hi = Math.min(n - 1, Math.floor((Math.max(a[1], b[1]) - y0) / step));
        for (let k = lo; k <= hi; k++) bands[k].push(id, a[0], a[1], b[0], b[1]);
      }
    });
    return { y0, step, n, bands };
  }
  function labelIndex() {
    const mode = state.borders === 'regular' ? 'regular' : 'shetach';
    return V.index[mode] || (V.index[mode] = edgeIndex(mode === 'regular' ? V.states : [...V.regions, ...V.blanks]));
  }

  // Where the line at map height y is inside each area: area → [in, out, in, out, …] (map x, in order).
  function crossings(ix, y) {
    const out = new Map(), k = Math.floor((y - ix.y0) / ix.step);
    if (!(k >= 0 && k < ix.n)) return out;
    const band = ix.bands[k];
    for (let i = 0; i < band.length; i += 5) {
      const ay = band[i + 2], by = band[i + 4];
      if ((ay > y) === (by > y)) continue;
      const id = band[i], x = band[i + 1] + ((y - ay) / (by - ay)) * (band[i + 3] - band[i + 1]);
      const xs = out.get(id);
      if (xs) xs.push(x); else out.set(id, [x]);
    }
    for (const xs of out.values()) xs.sort((a, b) => a - b);
    return out;
  }

  // What a shetach's label says in the current mode; the short form is for where it has no room.
  function shetachLabel(s) {
    if (state.labels === 'name') return { text: s.name, short: s.short, missing: false };
    const person = state.labels === 'last' ? s.lastName : s.headShliach;
    return person ? { text: person, missing: false } : { text: s.name, short: s.short, missing: true };
  }

  // A name on two lines, split at the space or hyphen that makes the lines most even.
  function twoLines(text) {
    let best = null;
    for (let i = 1; i < text.length - 1; i++) {
      if (text[i] !== ' ' && text[i] !== '-') continue;
      const lines = [text.slice(0, text[i] === '-' ? i + 1 : i), text.slice(i + 1)];
      const worst = Math.max(lines[0].length, lines[1].length);
      if (!best || worst <= best.worst) best = { worst, lines };
    }
    return best && best.lines;
  }

  const MARK_FONT = 12.5;
  const LINE = 1.2; // line height of two-line labels, in font sizes
  const SHIFTS = [0, 0.5, -0.5, 1, -1, 1.5, -1.5, 2, -2]; // how far a label may move up or down, in lines
  function buildLabels() {
    labels = [];
    if (state.labels !== 'off') {
      if (state.borders === 'regular') V.states.forEach((r, id) => { if (r.anchor) labels.push({ text: r.p.name, short: r.p.abbr, missing: false, a: r.anchor, id }); });
      else V.regions.forEach((r, id) => { if (r.anchor) labels.push({ ...shetachLabel(r.s), a: r.anchor, id }); });
    }
    const family = getComputedStyle(document.documentElement).getPropertyValue('--font-map');
    for (const L of labels) {
      L.size = clamp(Math.sqrt(L.a.area) / 10, 10, 20);
      measure.font = `${L.missing ? 500 : 700} ${L.size}px ${family}`;
      const width = (t) => measure.measureText(t).width + 0.05 * L.size * t.length;
      const options = [[[L.text], 0], [twoLines(L.text), 0.75], [L.short && L.short !== L.text ? [L.short] : null, 2.5]]
        .filter(([lines]) => lines).map(([lines, cost]) => ({ lines, cost, w: d3.max(lines, width) }));
      // Near the middle first; a second line or the short form only when the text doesn't fit nearby.
      L.tries = options.flatMap((o) => SHIFTS.map((shift) => ({ o, shift, cost: o.cost + Math.abs(shift) }))).sort((a, b) => a.cost - b.cost);
    }
    labels.sort((a, b) => b.a.area - a.a.area);
    for (const box of insetBoxes) {
      const g = box.piece, s = shetachOf(g);
      const L = state.labels === 'off' ? null : state.borders === 'regular' || !s ? { text: g.properties.name, missing: false } : shetachLabel(s);
      box.caption.text(L ? L.text : '').classed('lab-missing', !!(L && L.missing));
    }
  }

  const fontScale = (k) => clamp(Math.pow(k, 0.4), 0.8, 2.6);
  const overlaps = (box, boxes) => boxes.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]);

  // Capital stars on screen now. They shrink when the whole map is small (a phone, zoomed out).
  const STAR_FULL = 0.19; // screen pixels per km at which stars are full size (a desktop's whole-map view)
  function starsNow() {
    if (!state.capitals) return [];
    const f = clamp((V.pxPerKm * T.k) / STAR_FULL, 0.55, 1), out = [];
    for (const c of V.caps) {
      const [sx, sy] = T.apply([c.x, c.y]);
      if (sx < -12 || sx > W + 12 || sy < -12 || sy > H + 12) continue;
      const r = (c.world ? 11 : 7) * f;
      out.push({ kind: 'cap', c, f, r, sx, sy, box: [sx - r, sy - r, sx + r, sy + r] });
    }
    return out;
  }

  // The panel and zoom buttons, in map-screen coordinates: nothing is placed under them.
  function coveredRects() {
    const app = $('#app').getBoundingClientRect();
    return [...document.querySelectorAll('#panel, #zoomctl')].map((el) => {
      const r = el.getBoundingClientRect();
      return [r.left - app.left, r.top - app.top, r.right - app.left, r.bottom - app.top];
    });
  }

  // Room for a w×h label of area me on the row at screen height sy, starting from screen x ax: x is centred on
  // the stretch of me there (the part on screen); anywhere from lo to hi is 2px clear of every other area; ok(x)
  // says whether the label is almost all on me there (it may hang over water a little). null: no room.
  const ROWS = [-0.42, -0.21, 0.21, 0.42]; // besides the middle, in label heights
  function fit(ix, me, ax, sy, w, h) {
    const k = T.k, sx = (x) => T.x + x * k, mapY = (y) => (y - T.y) / k;
    const mid = crossings(ix, mapY(sy));
    const own = mid.get(me) || [];
    let s = null;
    for (let i = 0; i + 1 < own.length; i += 2) if (sx(own[i]) <= ax && ax <= sx(own[i + 1])) s = [Math.max(sx(own[i]), 4), Math.min(sx(own[i + 1]), W - 4)];
    if (!s || s[1] <= s[0]) return null;
    const xr = (s[0] + s[1]) / 2;
    let lo = 4, hi = W - 4;
    const rows = [mid, ...ROWS.map((t) => crossings(ix, mapY(sy + t * h)))];
    for (const row of rows) {
      for (const [id, xs] of row) {
        if (id === me) continue;
        for (let i = 0; i + 1 < xs.length; i += 2) {
          const a = sx(xs[i]), b = sx(xs[i + 1]);
          if (b <= xr) lo = Math.max(lo, b + 2);
          else if (a >= xr) hi = Math.min(hi, a - 2);
          else return null;
        }
      }
    }
    if (hi - lo < w) return null;
    const mine = rows.map((row) => (row.get(me) || []).map(sx));
    const ok = (x) => {
      if (x - w / 2 < lo - 0.01 || x + w / 2 > hi + 0.01) return false;
      let on = 0;
      for (const xs of mine) for (let i = 0; i + 1 < xs.length; i += 2) on += Math.max(0, Math.min(x + w / 2, xs[i + 1]) - Math.max(x - w / 2, xs[i]));
      return on >= 0.85 * w * rows.length;
    };
    return { x: clamp(xr, lo + w / 2, hi - w / 2), ok };
  }

  // When an area's middles are all off screen (zoomed in), a point on its widest stretch across the visible map.
  function visiblePoint(ix, me, p) {
    let best = null;
    for (const t of [0.5, 0.3, 0.7, 0.15, 0.85]) {
      const sy = p.t + (H - p.t - p.b) * t, xs = crossings(ix, (sy - T.y) / T.k).get(me) || [];
      for (let i = 0; i + 1 < xs.length; i += 2) {
        const a = Math.max(p.l, T.x + xs[i] * T.k), b = Math.min(W - p.r, T.x + xs[i + 1] * T.k);
        if (b - a > (best ? best.w : 0)) best = { w: b - a, at: [(a + b) / 2, sy] };
      }
    }
    return best && best.at;
  }

  // Each area's label, biggest areas first: the full text on one line, else on two, else the short form,
  // wherever it fits near the middle of the area (up or down a little to clear a star or another label).
  // Then the stars and cities, biggest first, wherever they fit.
  function placeLabels() {
    const k = T.k, f = fontScale(k), stars = starsNow(), covered = coveredRects(), p = insets(), ix = labelIndex();
    const boxes = [], blocked = [...stars.map((st) => st.box), ...covered];
    const inView = ([x, y]) => x >= p.l && x <= W - p.r && y >= p.t && y <= H - p.b;
    for (const L of labels) {
      L.show = null;
      const starts = L.a.points.map((pt) => T.apply(pt)).filter(inView);
      if (!starts.length) { const v = visiblePoint(ix, L.id, p); if (v) starts.push(v); }
      search: for (const [ax, ay] of starts) {
        for (const { o, shift } of L.tries) {
          const size = L.size * f, w = o.w * f, h = o.lines.length * LINE * size, sy = ay + shift * LINE * size;
          if (sy - h / 2 - 2 < 0 || sy + h / 2 + 2 > H) continue;
          const room = fit(ix, L.id, ax, sy, w, h);
          if (!room || !room.ok(room.x)) continue;
          // Centred if that's clear, else just beside whatever is in the way (a star, another label).
          const boxAt = (x) => [x - w / 2 - 3, sy - h / 2 - 2, x + w / 2 + 3, sy + h / 2 + 2];
          const inWay = [...boxes, ...blocked].filter((b) => overlaps(boxAt(room.x), [b]));
          const xs = [room.x, ...inWay.flatMap((b) => [b[0] - w / 2 - 3.5, b[2] + w / 2 + 3.5])].sort((a, b) => Math.abs(a - room.x) - Math.abs(b - room.x));
          const x = xs.find((x) => room.ok(x) && !overlaps(boxAt(x), boxes) && !overlaps(boxAt(x), blocked));
          if (x === undefined) continue;
          Object.assign(L, { show: o, mx: (x - T.x) / k, my: (sy - T.y) / k });
          boxes.push(boxAt(x));
          break search;
        }
      }
    }
    gLabels.selectAll('text').data(labels.filter((L) => L.show)).join('text')
      .attr('class', (L) => (L.missing ? 'lab lab-missing' : 'lab'))
      .each(function (L) {
        const n = L.show.lines.length;
        d3.select(this).selectAll('tspan').data(L.show.lines).join('tspan')
          .attr('x', 0).attr('dy', (t, i) => `${i ? LINE : (-(n - 1) / 2) * LINE}em`).text((t) => t);
      });
    placeMarks(boxes, stars, covered);
    moveLabels();
  }

  function placeMarks(boxes, stars, covered) {
    const taken = [...boxes, ...covered];
    // Right of the marker, else left, above, below; the whole label on screen and clear of everything placed so far.
    const spot = (sx, sy, gap, w) => {
      const h = MARK_FONT + 2;
      for (const [dx, dy, anchor] of [[gap, 0, 'start'], [-gap, 0, 'end'], [0, -gap - h / 2, 'middle'], [0, gap + h / 2, 'middle']]) {
        const x0 = anchor === 'start' ? sx + dx : anchor === 'end' ? sx + dx - w : sx - w / 2;
        const box = [x0 - 2, sy + dy - h / 2, x0 + w + 2, sy + dy + h / 2];
        if (box[0] >= 0 && box[2] <= W && box[1] >= 0 && box[3] <= H && !overlaps(box, taken)) return { dx, dy, anchor, box };
      }
      return null;
    };
    marks = [];
    taken.push(...stars.map((st) => st.box));
    if (state.cities) {
      const px = V.pxPerKm * T.k, least = CITY_DENSITY / (px * px);
      for (const c of V.cities) {
        if (c.weight < least) break;
        const [sx, sy] = T.apply([c.x, c.y]);
        if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
        const ring = [sx - 4, sy - 4, sx + 4, sy + 4];
        // A city right at a capital's star is marked by the star, with the city's name beside it.
        const star = stars.find((st) => !st.city && overlaps(ring, [st.box]));
        if (star) {
          const at = spot(star.sx, star.sy, star.r + 2, c.widths[0]);
          if (!at) continue;
          star.city = c;
          taken.push(at.box);
          marks.push({ kind: 'city', c, at, text: c.texts[0], anchor: star.c });
          continue;
        }
        if (overlaps(ring, taken)) continue;
        const at = spot(sx, sy, 6, c.widths[0]);
        if (!at) continue;
        taken.push(ring, at.box);
        marks.push({ kind: 'city', c, at, text: c.texts[0] });
      }
    }
    marks.push(...stars); // drawn last, on top
    gMarks.selectAll('g').remove();
    for (const m of marks) {
      const g = gMarks.append('g').attr('class', 'mk').datum(m);
      if (m.kind === 'cap') g.append('path').attr('class', 'mk-cap').attr('d', m.c.world ? WORLD_STAR : STAR).attr('transform', `scale(${m.f})`);
      else if (!m.anchor) g.append('circle').attr('class', 'mk-city').attr('r', 3);
      if (m.at) g.append('text').attr('class', 'mk-lab').attr('x', m.at.dx).attr('y', m.at.dy).attr('text-anchor', m.at.anchor).text(m.text);
    }
  }

  function moveLabels() {
    const f = fontScale(T.k);
    gLabels.selectAll('text').each(function (L) {
      const [sx, sy] = T.apply([L.mx, L.my]);
      this.setAttribute('transform', `translate(${sx},${sy})`);
      this.style.fontSize = `${L.size * f}px`;
      this.style.strokeWidth = `${Math.max(2, L.size * f * 0.2)}px`;
    });
    gMarks.selectAll('g').each(function (m) {
      const at = m.anchor || m.c;
      const [sx, sy] = T.apply([at.x, at.y]);
      this.setAttribute('transform', `translate(${sx},${sy})`);
    });
  }

  // ---------- dots ----------
  const dotBase = (d) => 1.9 + 0.55 * Math.log2(d.centers.length);
  const dotRadius = (d, k) => (dotBase(d) * Math.pow(k, 0.35)) / k;
  const sizeDots = () => gDots.selectAll('circle').attr('r', (d) => dotRadius(d, T.k));

  // ---------- zoom (political map) ----------
  let frame = 0;
  const zoom = d3.zoom().scaleExtent([1, 60])
    .on('start', (e) => { if (e.sourceEvent && !pinned) hideCard(); })
    .on('zoom', (e) => {
      T = e.transform;
      root.attr('transform', T);
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; sizeDots(); moveLabels(); gInsets.classed('away', T.k > 1.3); });
    })
    .on('end', placeLabels);
  svg.call(zoom);

  // Move either map to zoom transform t.
  function setView(t, ms) {
    if (V.physical) {
      const cam = cameraFor(t);
      if (ms && !still) mapgl.easeTo({ ...cam, duration: ms }); else mapgl.jumpTo(cam);
    } else {
      (ms && !still ? svg.transition().duration(ms) : svg).call(zoom.transform, t);
    }
  }
  function zoomToBounds([[x0, y0], [x1, y1]]) {
    const p = insets();
    const w = W - p.l - p.r, h = H - p.b - p.t;
    const k = clamp(0.9 / Math.max((x1 - x0) / w, (y1 - y0) / h), 1, 60);
    setView(d3.zoomIdentity.translate(p.l + w / 2 - (k * (x0 + x1)) / 2, p.t + h / 2 - (k * (y0 + y1)) / 2).scale(k), 750);
  }
  function zoomBy(factor) {
    if (V.physical) (factor > 1 ? mapgl.zoomIn : mapgl.zoomOut).call(mapgl, { duration: still ? 0 : 300 });
    else svg.transition().duration(still ? 0 : 300).call(zoom.scaleBy, factor);
  }
  $('#zin').addEventListener('click', () => zoomBy(1.7));
  $('#zout').addEventListener('click', () => zoomBy(1 / 1.7));
  $('#zreset').addEventListener('click', () => setView(d3.zoomIdentity, 600));

  // ---------- physical map (MapLibre GL + OpenFreeMap tiles, loaded the first time it's picked) ----------
  // A full map (land cover and relief, water, roads, places) with our borders, names, cities and dots on it.
  const GL_JS = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js';
  const GL_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const FADE = '#eef0ec'; // over land outside the shown shetachim
  let mapgl = null, glStarting = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('the map library did not load'));
      document.head.appendChild(s);
    });
  }
  const withTimeout = (promise, ms, what) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(what)), ms))]);

  // Resolves once the style has loaded; rejects if the library, WebGL or the tiles are unavailable.
  function startGL() {
    if (glStarting) return glStarting;
    glStarting = (async () => {
      if (!window.maplibregl) await withTimeout(loadScript(GL_JS), 20000, 'the map library took too long');
      const m = new maplibregl.Map({
        container: 'basemap', style: GL_STYLE, attributionControl: false, renderWorldCopies: false,
        dragRotate: false, pitchWithRotate: false, touchPitch: false, maxZoom: 18.5, fadeDuration: 150,
      });
      mapgl = m;
      m.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
      m.touchZoomRotate.disableRotation();
      m.keyboard.disableRotation();
      m.on('style.load', () => { addOverlay(); if (V && V.physical) { dataGL(); styleGL(); } });
      let styled = false;
      await withTimeout(new Promise((resolve, reject) => {
        m.once('style.load', () => { styled = true; resolve(); });
        m.on('error', (e) => { if (!styled) reject(e.error || new Error('map error')); });
      }), 20000, 'the map took too long');
      mapgl.on('move', syncCamera);
      mapgl.on('moveend', () => { if (V.physical) placeLabels(); });
      mapgl.on('movestart', () => { if (!pinned) hideCard(); });
      mapgl.on('mousemove', (e) => {
        if (!V.physical || pinned || e.originalEvent.buttons) return;
        const hit = pickAt(e.point.x, e.point.y, false);
        if (hit) showCard(hit, e.originalEvent, false); else hideCard();
      });
      mapgl.on('mouseout', () => { if (!pinned) hideCard(); });
      mapgl.on('click', (e) => {
        if (!V.physical) return;
        const hit = pickAt(e.point.x, e.point.y, e.originalEvent.pointerType === 'touch' || coarse());
        if (!hit) { hideCard(); return; }
        pinned = hit;
        showCard(hit, e.originalEvent, true);
      });
    })();
    glStarting.catch(() => {
      if (mapgl) mapgl.remove();
      mapgl = null;
      glStarting = null;
    });
    return glStarting;
  }

  const glReady = () => mapgl && mapgl.getSource('st-dots');

  // Our layers: borders over the streets but under the map's own labels; a fade over land outside the shown
  // shetachim (under the water, so seas stay blue) and a lighter one over everything outside; the dots and
  // the hover rings on top. Names, cities and capitals stay in the SVG.
  function addOverlay() {
    if (mapgl.getSource('st-dots')) return;
    const layers = mapgl.getStyle().layers;
    const lastRoad = layers.map((l) => l.type === 'line' && l['source-layer'] === 'transportation').lastIndexOf(true);
    const lineBefore = (layers.find((l, i) => i > lastRoad && l.type === 'symbol') || {}).id;
    const waterBefore = (layers.find((l) => ['water', 'waterway'].includes(l['source-layer'])) || {}).id;
    // No simplification on the fade: simplified, its holes break in some tiles and cover shetachim.
    for (const id of ['st-fade', 'st-hover-area']) mapgl.addSource(id, { type: 'geojson', data: EMPTY, tolerance: 0 });
    for (const id of ['st-lines', 'st-dots', 'st-hover-dot']) mapgl.addSource(id, { type: 'geojson', data: EMPTY });
    mapgl.addLayer({ id: 'st-fade-land', type: 'fill', source: 'st-fade', paint: { 'fill-color': FADE, 'fill-opacity': 0.72 } }, waterBefore);
    mapgl.addLayer({ id: 'st-line-casing', type: 'line', source: 'st-lines', filter: ['==', ['get', 'kind'], 'shetach'], layout: { 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 4.5, 'line-opacity': 0.5 } }, lineBefore);
    for (const kind of ['coast', 'regular', 'country', 'shetach']) {
      mapgl.addLayer({ id: `st-line-${kind}`, type: 'line', source: 'st-lines', filter: ['==', ['get', 'kind'], kind], layout: { 'line-join': 'round' } }, lineBefore);
    }
    mapgl.addLayer({ id: 'st-fade-top', type: 'fill', source: 'st-fade', paint: { 'fill-color': FADE, 'fill-opacity': 0.3 } });
    mapgl.addLayer({ id: 'st-hover-area', type: 'line', source: 'st-hover-area', paint: { 'line-width': 2.5 } });
    mapgl.addLayer({ id: 'st-dots', type: 'circle', source: 'st-dots' });
    mapgl.addLayer({ id: 'st-hover-dot', type: 'circle', source: 'st-hover-dot', paint: { 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-width': 2 } });

    // Richer natural colours: the Natural Earth relief (greens, desert tans, ice) stays strong out to the
    // state level and fades out under the streets, and woods and grass read as green further in.
    const set = (id, prop, value) => { if (mapgl.getLayer(id)) mapgl.setPaintProperty(id, prop, value); };
    if (mapgl.getLayer('natural_earth')) {
      mapgl.setLayerZoomRange('natural_earth', 0, 12);
      set('natural_earth', 'raster-opacity', ['interpolate', ['linear'], ['zoom'], 0, 0.95, 5, 0.9, 7, 0.75, 9, 0.5, 11, 0.25, 12, 0]);
      set('natural_earth', 'raster-saturation', 0.15);
    }
    set('landcover_wood', 'fill-color', 'hsl(100, 38%, 62%)');
    set('landcover_wood', 'fill-opacity', ['interpolate', ['linear'], ['zoom'], 6, 0.35, 10, 0.6]);
    set('landcover_grass', 'fill-opacity', 0.5);
    set('park', 'fill-color', '#c9e2b3');
  }

  const feature = (geometry, properties = {}) => ({ type: 'Feature', geometry, properties });

  // The world with holes where the shown shetachim are (islands in their lakes are already uncovered).
  function fadeGeometry(shown) {
    const outers = topojson.merge(topo, shown).coordinates.map((poly) => poly[0]);
    const area = (r) => Math.abs(d3.polygonArea(r));
    const holes = outers.filter((r) => !outers.some((o) => o !== r && area(o) > area(r) && d3.polygonContains(o, r[0])));
    const world = [[-180, -85.06], [180, -85.06], [180, 85.06], [-180, 85.06], [-180, -85.06]];
    const sign = Math.sign(d3.polygonArea(world));
    return { type: 'Polygon', coordinates: [world, ...holes.map((r) => (Math.sign(d3.polygonArea(r)) === sign ? [...r].reverse() : r))] };
  }

  function dataGL() {
    if (!glReady()) return;
    const set = (id, data) => mapgl.getSource(id).setData(data);
    const fc = (features) => ({ type: 'FeatureCollection', features });
    set('st-lines', fc(meshes(V.main).map(([kind, g]) => feature(g, { kind }))));
    set('st-fade', feature(fadeGeometry(V.shown)));
    set('st-dots', fc(V.dots.map((d) => feature({ type: 'Point', coordinates: [d.lon, d.lat] }, { r: dotBase(d) }))));
    set('st-hover-area', EMPTY);
    set('st-hover-dot', EMPTY);
  }

  // Paint and visibility for the current options; mirrors the CSS rules of the political map.
  function styleGL() {
    if (!glReady()) return;
    const css = getComputedStyle($('#map'));
    const v = (name) => css.getPropertyValue(name).trim();
    const paint = (id, prop, value) => mapgl.setPaintProperty(id, prop, value);
    const show = (id, on) => mapgl.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    const both = state.borders === 'both';
    const lightS = both && state.lighter === 'shetach', lightR = both && state.lighter === 'regular';
    const ink = v('--map-ink');
    const line = (kind, on, width, opacity) => {
      show(`st-line-${kind}`, on);
      paint(`st-line-${kind}`, 'line-color', ink);
      paint(`st-line-${kind}`, 'line-width', width);
      paint(`st-line-${kind}`, 'line-opacity', opacity);
    };
    line('coast', true, 0.8, 0.35);
    line('regular', state.borders !== 'shetach', 1.2, lightR ? 0.35 : 0.8);
    line('country', state.borders !== 'shetach', 2, lightR ? 0.35 : 0.9);
    line('shetach', state.borders !== 'regular', 2, lightS ? 0.3 : 0.9);
    show('st-line-casing', state.borders !== 'regular' && !lightS);
    paint('st-line-regular', 'line-dasharray', both ? [2, 2] : [1, 0]);
    // Same sizes as the political map: grows with zoom like k^0.35, and stops growing at 60x the framed view.
    const r = (dz) => ['*', ['get', 'r'], 2 ** (0.35 * dz)];
    const radius = ['interpolate', ['exponential', 2 ** 0.35], ['zoom'], V.zFit - 2, r(-2), V.zFit + Math.log2(60), r(Math.log2(60))];
    show('st-dots', state.dots);
    paint('st-dots', 'circle-radius', radius);
    paint('st-dots', 'circle-color', v('--map-dot'));
    paint('st-dots', 'circle-opacity', 0.55);
    paint('st-hover-dot', 'circle-radius', radius);
    paint('st-hover-dot', 'circle-stroke-color', v('--map-accent'));
    paint('st-hover-area', 'line-color', v('--map-accent'));
    // The map's own borders and state and country names always give way to ours; its city names do
    // while our cities are on.
    for (const layer of mapgl.getStyle().layers) {
      if (layer['source-layer'] === 'boundary') show(layer.id, false);
      if (layer.type !== 'symbol' || layer['source-layer'] !== 'place') continue;
      show(layer.id, !(/country|state|continent/.test(layer.id) || state.cities));
    }
  }

  // T from the MapLibre camera (no rotation or tilt, so it's a plain scale and shift of the projection).
  function syncCamera() {
    if (!V || !V.physical || !mapgl) return;
    const c = mapgl.getCenter(), k = 2 ** (mapgl.getZoom() - V.zFit);
    const [cx, cy] = projection([c.lng, c.lat]);
    T = d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k);
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; moveLabels(); });
  }
  function cameraFor(t) {
    const [lng, lat] = projection.invert(t.invert([W / 2, H / 2]));
    return { center: [lng, lat], zoom: V.zFit + Math.log2(t.k) };
  }

  async function setBase(value) {
    const msg = $('#base-msg');
    if (value === state.base) return;
    if (value === 'physical') {
      msg.hidden = false;
      msg.className = 'note';
      msg.textContent = 'Loading…';
      try {
        await startGL();
      } catch (err) {
        pressed('base', 'political');
        msg.className = 'error';
        msg.textContent = /webgl/i.test(String(err && err.message)) ? "This browser can't show the physical map." : "The physical map couldn't load.";
        return;
      }
      // switched back while it loaded, or a second click already finished the switch
      if (state.base === 'physical' || !$('.seg[data-name="base"] [data-value="physical"]').matches('[aria-pressed="true"]')) return;
    }
    msg.hidden = true;
    const focus = focusNow();
    hideCard();
    state.base = value;
    layout({ focus });
    apply();
  }

  // ---------- hover and tap ----------
  const card = $('#card');
  let pinned = null, lastPoint = { clientX: 0, clientY: 0 };

  // What's under a screen point: a capital star, a dot, a city, or an area.
  function pickAt(mx, my, touch, target) {
    const reach = touch ? 14 : 8;
    const box = !V.physical && T.k <= 1.3 && insetBoxes.find((b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
    if (box) {
      if (state.dots) {
        const near = d3.least(box.dots, (d) => { const [x, y] = box.proj([d.lon, d.lat]); return Math.hypot(x - mx, y - my); });
        if (near) { const [x, y] = box.proj([near.lon, near.lat]); if (Math.hypot(x - mx, y - my) <= reach) return { dot: near }; }
      }
      return target && target.classList.contains('inset-land') ? { piece: box.piece.properties } : null;
    }
    const where = (m) => T.apply(m.anchor ? [m.anchor.x, m.anchor.y] : [m.c.x, m.c.y]);
    const near = (list, extra = 0) => d3.least(list.filter((m) => { const [x, y] = where(m); return Math.hypot(x - mx, y - my) <= reach + extra; }),
      (m) => { const [x, y] = where(m); return Math.hypot(x - mx, y - my); });
    const cap = near(marks.filter((m) => m.kind === 'cap'), 3);
    if (cap) return { capital: cap.c };
    if (state.dots && tree) {
      const [x, y] = T.invert([mx, my]);
      const d = tree.find(x, y, reach / T.k);
      if (d) return { dot: d };
    }
    const city = near(marks.filter((m) => m.kind === 'city' && !m.anchor));
    if (city) return { city: city.c };
    if (V.physical) {
      const [x, y] = projection.invert(T.invert([mx, my]));
      const inBox = ([[x0, y0], [x1, y1]]) => y >= y0 && y <= y1 && (x0 <= x1 ? x >= x0 && x <= x1 : x >= x0 || x <= x1);
      const a = V.hitAreas.find((a) => inBox(a.box) && d3.geoContains(a.f, [x, y]));
      return a ? { piece: a.g.properties } : null;
    }
    const d = target && d3.select(target).datum();
    return d && d.properties && pieceById.has(d.properties.id) ? { piece: d.properties } : null;
  }
  function pick(event) {
    const [mx, my] = d3.pointer(event, svg.node());
    return pickAt(mx, my, event.pointerType === 'touch', event.target);
  }

  const count = (n) => `${fmt(n)} ${n === 1 ? 'center' : 'centers'}`;
  const chabadLink = (c) => (c && c.slug ? `<a href="https://www.chabad.org/jewish-centers/${esc(c.id)}/${esc(c.slug)}" target="_blank" rel="noopener">Open on chabad.org</a>` : '');
  // withHead: false just names the shetach whose territory this is, without implying its head shliach
  // runs the place — used for 770, which sits in New York City's territory but isn't Tzach's to run.
  function shetachLine(pieceId, withHead = true) {
    const g = pieceById.get(pieceId);
    const s = g && shetachOf(g);
    if (s) return withHead ? `${esc(s.name)} · ${esc(s.headShliach)}` : esc(s.name);
    return g ? esc(g.properties.name) : '';
  }

  // A shetach's flagship center; 770 (world HQ) gets its own wording rather than "of New York City".
  const capKicker = (c) => (c.world ? 'World Headquarters' : `${esc(c.s.name)} flagship center`);

  // Who's listed at a center (chabad.org's own listing, when scripts/chabad-personnel-scrape.js has
  // been run): the first one still living is shown as the shliach; anyone else goes under "+more".
  const personName = (p) => `${[p.title, p.firstName, p.lastName].filter(Boolean).join(' ')}${p.isDeceased ? ' obm' : ''}`;
  const personLine = (p) => `${esc(personName(p))}${p.position ? ` <span class="meta">· ${esc(p.position)}</span>` : ''}`;
  function personnelHTML(list) {
    if (!list || !list.length) return '';
    const primary = list.find((p) => !p.isDeceased) || list[0];
    const others = list.filter((p) => p !== primary);
    const more = others.length
      ? `<details class="personnel"><summary>+${others.length} more</summary>${others.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    return `<p class="person">${personLine(primary)}</p>${more}`;
  }

  function dotHTML(d) {
    const n = d.centers.length;
    const items = d.centers.map((c) => {
      const cap = capitalOfCenter.get(c.id);
      return `<li>
        <strong>${esc(c.name)}</strong>
        <span class="meta">${esc([c.type, c.city].filter(Boolean).join(' · '))}</span>
        ${personnelHTML(c.personnel)}
        ${cap ? `<span class="flag${cap.world ? ' flag-world' : ''}">${capKicker(cap)}</span>` : ''}
        ${chabadLink(c)}
      </li>`;
    }).join('');
    const head = n > 1 ? `<span class="kicker">${n} listings at this address</span><h2>${esc(d.centers[0].city || 'Same address')}</h2>` : '';
    return `${head}<ul>${items}</ul><div class="foot"><span class="meta">${shetachLine(d.piece)}</span></div>`;
  }

  function capitalHTML(c) {
    return `<span class="kicker${c.world ? ' kicker-world' : ''}">${capKicker(c)}</span><h2>${esc(c.name)}</h2>
      ${c.city ? `<p>${esc(c.city)}</p>` : ''}${personnelHTML(c.center && c.center.personnel)}${chabadLink(c.center)}
      <div class="foot"><span class="meta">${shetachLine(c.piece, !c.world)}</span></div>`;
  }

  function cityHTML(c) {
    const pop = c.pop ? `<p>Population ${fmt(c.pop)}</p>` : '';
    return `<span class="kicker">City</span><h2>${esc(c.name)}</h2>${pop}
      <div class="foot"><span class="meta">${count(c.centers)} · ${shetachLine(c.piece)}</span></div>`;
  }

  function areaHTML(p) {
    const g = pieceById.get(p.id), s = shetachOf(g);
    const inMain = V.main.includes(g);
    const zoomBtn = inMain ? `<button type="button" class="zoomto" data-piece="${esc(p.id)}">Zoom in</button>` : '';
    if (state.borders === 'regular' || !s) {
      const inState = [...new Set(pieces.filter((x) => x.properties.state === p.state).map(shetachOf).filter(Boolean))];
      const part = state.borders === 'regular' && inState.length ? `<p>${esc(inState.map((x) => x.name).join(', '))}</p>` : '';
      return `<span class="kicker">${p.country === 'US' ? 'State' : 'Province'}</span><h2>${esc(p.name)}</h2>${part}
        <div class="foot"><span class="meta">${count(centersInState(p.state))}</span>${zoomBtn}</div>`;
    }
    const states = s.states.size > 1 ? `<p>${esc([...s.states].map((st) => stateName.get(st)).sort().join(', '))}</p>` : '';
    const capital = s.capital ? `<p>Capital: ${esc(s.capital.name)}${s.capital.city ? `, ${esc(s.capital.city)}` : ''}</p>` : '';
    return `<span class="kicker">Shetach</span><h2>${esc(s.name)}</h2>
      <p>Head shliach: ${esc(s.headShliach)}</p>${states}${capital}
      <div class="foot"><span class="meta">${count(centersInShetach(s))}</span>${zoomBtn}</div>`;
  }

  function showCard(hit, event, pin) {
    card.innerHTML = (hit.dot ? dotHTML(hit.dot) : hit.capital ? capitalHTML(hit.capital) : hit.city ? cityHTML(hit.city) : areaHTML(hit.piece)) +
      '<button type="button" class="close" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
    card.hidden = false;
    card.classList.toggle('pinned', pin);
    card.classList.toggle('world', !!(hit.capital && hit.capital.world));
    lastPoint = { clientX: event.clientX, clientY: event.clientY };
    if (!phone()) {
      const app = $('#app').getBoundingClientRect();
      const cw = card.offsetWidth, ch = card.offsetHeight;
      let x = event.clientX - app.left + 14, y = event.clientY - app.top + 14;
      if (x + cw > W - 8) x = event.clientX - app.left - cw - 14;
      if (y + ch > H - 8) y = Math.max(8, H - ch - 8);
      card.style.left = `${Math.max(8, x)}px`;
      card.style.top = `${y}px`;
    }
    highlight(hit);
  }
  function hideCard() {
    card.hidden = true;
    pinned = null;
    highlight(null);
  }

  // The outline an area's card is about: its state, its shetach, or the blank part of its state.
  function areaGeometry(pieceId) {
    const g = pieceById.get(pieceId), s = shetachOf(g);
    if (state.borders === 'regular') return (V.states.find((r) => r.st === g.properties.state) || {}).geo;
    if (s) return (V.regions.find((r) => r.s === s) || {}).geo;
    return (V.blanks.find((r) => r.st === g.properties.state) || {}).geo;
  }
  function highlight(hit) {
    const dot = hit && (hit.dot || (hit.capital && dotOfCenter.get(hit.capital.centerId)));
    const onMain = (id) => V.main.some((g) => g.properties.id === id);
    const area = hit && hit.piece && onMain(hit.piece.id) ? areaGeometry(hit.piece.id) : null;
    if (V.physical) {
      if (!glReady()) return;
      mapgl.getSource('st-hover-dot').setData(dot && state.dots && onMain(dot.piece) ? feature({ type: 'Point', coordinates: [dot.lon, dot.lat] }, { r: dotBase(dot) }) : EMPTY);
      mapgl.getSource('st-hover-area').setData(area ? feature(area) : EMPTY);
      return;
    }
    gHover.selectAll('*').remove();
    if (dot && dot.x !== undefined && onMain(dot.piece)) {
      gHover.append('circle').attr('class', 'dot-hover').attr('cx', dot.x).attr('cy', dot.y).attr('r', dotRadius(dot, T.k) + 2.5 / T.k);
    } else if (area) {
      gHover.append('path').attr('class', 'hover-ring').attr('d', geoPath(area));
    }
  }

  svg.on('pointermove', (e) => {
    if (pinned || e.pointerType === 'touch' || e.buttons) return;
    const hit = pick(e);
    if (hit) showCard(hit, e, false);
    else hideCard();
  });
  svg.on('pointerleave', () => { if (!pinned) hideCard(); });
  svg.on('click', (e) => {
    if (e.defaultPrevented) return;
    const hit = pick(e);
    if (!hit) { hideCard(); return; }
    pinned = hit;
    showCard(hit, e, true);
  });
  card.addEventListener('click', (e) => {
    if (e.target.closest('.close')) { hideCard(); return; }
    const z = e.target.closest('.zoomto');
    if (z) {
      const geom = areaGeometry(z.dataset.piece);
      hideCard();
      if (geom) zoomToBounds(geoPath.bounds(geom));
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCard(); });

  // ---------- options ----------
  function pressed(name, value) {
    document.querySelectorAll(`.seg[data-name="${name}"] button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
  }
  function apply() {
    svg.attr('class', `borders-${state.borders} lighter-${state.lighter}${state.color === 'plain' ? ' plain' : ''}${state.dots ? '' : ' no-dots'}`);
    $('#app').classList.toggle('physical', V.physical);
    $('#colors-ctl').hidden = V.physical;
    gInsets.attr('class', `l-insets${T.k > 1.3 ? ' away' : ''}`);
    $('#lighter-row').hidden = state.borders !== 'both';
    if (V.physical) styleGL();
    buildLabels();
    placeLabels();
    sizeDots();
    if (pinned) showCard(pinned, lastPoint, true);
  }
  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const name = seg.dataset.name;
    pressed(name, b.dataset.value);
    if (name === 'base') { setBase(b.dataset.value); return; }
    state[name] = b.dataset.value;
    if (name === 'view') { hideCard(); layout(); }
    apply();
  }));
  for (const [id, key] of [['#show-dots', 'dots'], ['#show-cities', 'cities'], ['#show-capitals', 'capitals']]) {
    $(id).addEventListener('change', (e) => { state[key] = e.target.checked; apply(); });
  }
  // Light or dark, whichever the device uses until one is picked here; the pick is remembered.
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const theme = () => document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
  const SUN = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg>';
  const MOON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 12.6A7 7 0 0 1 7.4 3.4a7 7 0 1 0 9.2 9.2z"/></svg>';
  function showThemeButton() {
    const dark = theme() === 'dark';
    $('#theme-toggle').innerHTML = dark ? SUN : MOON;
    $('#theme-toggle').setAttribute('aria-label', dark ? 'Light mode' : 'Dark mode');
  }
  $('#theme-toggle').addEventListener('click', () => {
    const next = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('shetachim-theme', next); } catch (e) { /* not remembered, still switched */ }
    showThemeButton();
  });
  darkQuery.addEventListener('change', showThemeButton);
  showThemeButton();

  $('#panel-toggle').addEventListener('click', () => {
    const panel = $('#panel');
    const open = panel.classList.toggle('collapsed') === false;
    $('#panel-toggle').setAttribute('aria-expanded', String(open));
    $('#panel-toggle').textContent = open ? 'Close' : 'Options';
    document.documentElement.style.setProperty('--sheet', `${panel.getBoundingClientRect().height}px`);
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout({ keep: V.physical }); apply(); }, 150); });

  await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise((r) => setTimeout(r, 1500))]);
  layout();
  apply();
})();
</script>
</body>
</html>
