<head>

<script>try { const t = localStorage.getItem('shetachim-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script>// Hebrew (?lang=he, or picked before): the whole page right to left
try { const q = new URLSearchParams(location.search).get('lang'); if (q) localStorage.setItem('shetachim-lang', q); if ((q || localStorage.getItem('shetachim-lang')) === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; document.title = 'מפת שטחי חב״ד'; } } catch (e) {}</script>
<script>// The map's data and the street map's style, asked for at once, while the page and the map library still load.
// Every data file is checked with the site each time (an unchanged one then comes from the browser's cache, a new
// version at once: never an old map after an update). With ?v= in the address (the refresh button) all of it is
// fetched anew, and so is every other site file the page asks for (fresh()).
window.EARLY = (() => {
  const v = new URLSearchParams(location.search).get('v');
  const fresh = (url) => (v ? `${url}${url.includes('?') ? '&' : '?'}v=${encodeURIComponent(v)}` : url);
  const files = new Map();
  const bytes = (url) => {
    if (!files.has(url)) {
      const got = fetch(fresh(url), { cache: v ? 'reload' : 'no-cache' }).then((r) => {
        if (!r.ok) throw new Error(`${url} (${r.status})`);
        return r.arrayBuffer().then((buf) => ({ buf, etag: r.headers.get('etag') || r.headers.get('last-modified') || '' }));
      });
      got.catch(() => {}); // (whoever reads it hears of a failure)
      files.set(url, got);
    }
    return files.get(url);
  };
  ['data/geo.json', 'data/centers.geojson', 'data/shetachim.json', 'data/cities.json', 'data/outside-lo.json'].forEach(bytes);
  if (document.documentElement.lang === 'he') bytes('data/he.json');
  const style = fetch('https://tiles.openfreemap.org/styles/liberty').then((r) => r.json());
  style.catch(() => {});
  return { v, fresh, bytes, style };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400&family=Heebo:wght@400..800&display=swap">
<style>
/* Layout: full-bleed map of the shetachim alone on a plain ground (or on a physical map); options card top-left (bottom sheet on phones); zoom buttons bottom-right. */
:root {
  --bg: #f1f3f0;
  --ink: #1e2b32;
  --halo: #ffffff;
  --dot: #163e74;
  --panel: #fbfcfb;
  --panel-line: #d2d9dc;
  --muted: #5a6870;
  --missing: #86939a;
  --accent: #1d4f8f;
  --accent-soft: #e3ebf5;
  --c1: #f0e1a2; --c2: #cce1b5; --c3: #efc7c1; --c4: #c5d9ee;
  --c5: #f3cfa9; --c6: #d8c8e5; --c7: #bcded6; --c8: #e1d8be;
  --plain: #fcfcfa;
  --empty: #dcdfdb; /* land with no shetach, when shown */
  /* what the map draws with: the theme's colors, except on the physical map, which is always light */
  --map-ink: var(--ink); --map-halo: var(--halo); --map-dot: var(--dot); --map-accent: var(--accent); --map-missing: var(--missing); --map-secondary: #3d5f8f;
  --font-ui: "Inter", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-map: "Inter", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgb(20 35 45 / .08), 0 6px 20px rgb(20 35 45 / .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
    --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
    --map-secondary: #a8c3ea;
    --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
    --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
    --plain: #223036;
  --empty: #2f383c;
    --empty: #2f383c;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
  --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
  --map-secondary: #a8c3ea;
  --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
  --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
  --plain: #223036;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
.physical #map { --map-ink: #1e2b32; --map-halo: #ffffff; --map-dot: #163e74; --map-accent: #1d4f8f; --map-missing: #6b7780; --map-secondary: #3d5f8f; }

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-ui); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#basemap { position: absolute; inset: 0; width: 100%; height: 100%; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- the map (MapLibre): only the rules this page uses ---- */
.maplibregl-map { position: absolute; inset: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; font: 12px/18px var(--font-ui); }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas { touch-action: pan-x pan-y; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-ctrl-top-right { position: absolute; top: 0; right: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl { clear: both; float: right; pointer-events: auto; }
.maplibregl-ctrl-attrib { position: relative; margin: 10px; padding: 2px 8px; min-height: 20px; box-sizing: content-box;
  background: var(--panel); color: var(--muted); border: 1px solid var(--panel-line); border-radius: 12px; }
.maplibregl-ctrl-attrib a { color: inherit; }
.maplibregl-attrib-empty { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact { padding: 2px 24px 2px 0; }
.maplibregl-ctrl-attrib.maplibregl-compact-show { padding: 2px 28px 2px 8px; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-inner { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner { display: block; }
.maplibregl-ctrl-attrib-button { display: none; position: absolute; top: 0; right: 0; width: 24px; height: 24px; border-radius: 12px; cursor: pointer;
  list-style: none; appearance: none; -webkit-appearance: none;
  background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%236b7780' fill-rule='evenodd' viewBox='0 0 20 20'%3E%3Cpath d='M4 10a6 6 0 1 0 12 0 6 6 0 1 0-12 0m5-3a1 1 0 1 0 2 0 1 1 0 1 0-2 0m0 3a1 1 0 1 1 2 0v3a1 1 0 1 1-2 0'/%3E%3C/svg%3E") center / 20px no-repeat; }
.maplibregl-ctrl-attrib-button::-webkit-details-marker { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-button { display: block; }

/* ---- options panel ---- */
#panel {
  position: absolute; z-index: 3; top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
.p-head h1 { margin: 0; font: 700 20px/1.1 var(--font-map); letter-spacing: -.01em; white-space: nowrap; }
.p-head .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
#panel-toggle { display: none; }
.p-actions { display: flex; align-items: center; gap: 6px; flex: none; }
#theme-toggle { width: 34px; height: 34px; padding: 0; border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
#theme-toggle:hover, #lang-toggle:hover { border-color: var(--accent); }
#lang-toggle { height: 34px; min-width: 34px; padding: 0 8px; border: 1px solid var(--panel-line); background: transparent; color: inherit; border-radius: 999px; cursor: pointer; font: 500 14px var(--font-ui); }
#theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#panel-body { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 10px 0; border-block: 1px solid var(--panel-line); }
.stats div { min-width: 0; }
.stats dt { font: 600 10px var(--font-map); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
fieldset.ctl { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
fieldset.ctl legend { padding: 0; margin-bottom: 7px; font: 600 10.5px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 4px 11px; cursor: pointer;
  font-size: 13.5px; line-height: 1.3; transition: background .15s, border-color .15s;
}
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.seg-label { align-self: center; font-size: 13px; color: var(--muted); margin-right: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #163e74; }
.legend-ring { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--halo); }
.legend-star { width: 12px; height: 12px; fill: var(--ink); }
#views { margin-top: 6px; }
#views[open] > .seg { margin-top: 6px; }
#more > summary, #views > summary { cursor: pointer; font: 600 10.5px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); list-style: none; padding: 2px 0; }
#more > summary::-webkit-details-marker, #views > summary::-webkit-details-marker { display: none; }
#more > summary::after, #views > summary::after { content: '▾'; margin-inline-start: 6px; font-size: 11px; }
#more[open] > summary::after, #views[open] > summary::after { content: '▴'; }
.more-body { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.more-body .checks { display: flex; flex-direction: column; gap: 7px; }
.legend-sea { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: #a9c7f2; }
.legend-empty { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: var(--empty); border: 1px solid var(--map-ink); opacity: .7; }
.legend-rest { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--empty) 42%, var(--map-ink) 42% 58%, var(--empty) 58%); border: 1px solid var(--map-ink); opacity: .7; }
.downloads { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.downloads:hover { text-decoration: underline; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.error { margin: 0; color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; }

/* ---- zoom buttons ---- */
#zoomctl { position: absolute; z-index: 3; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
#zoomctl button { width: 38px; height: 38px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
#zoomctl button + button { border-top: 1px solid var(--panel-line); }
#zoomctl button:hover { background: var(--accent-soft); }
#zoomctl svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* ---- info card ---- */
#card {
  position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 32px); max-height: 60%; overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 14px; pointer-events: none;
}
#card.pinned { pointer-events: auto; }
/* a head shliach's shetach with its territories (Kantor: Thailand, then India): separate cards, one under the other */
#card.stack { background: transparent; border: 0; box-shadow: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#card.stack > .part { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; }
#card.pinned > ul:first-child > li:first-child, #card.pinned > .kicker:first-child { padding-inline-end: 26px; }
#card h2 { margin: 0 0 4px; margin-inline-end: 22px; font: 700 16px/1.25 var(--font-ui); text-wrap: balance; }
#card .kicker { display: block; font: 600 10px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
#card .kicker-world { color: var(--accent); font-weight: 700; }
#card .subcard { margin-top: 12px; padding-top: 10px; border-top: 2px solid var(--panel-line); } /* a center of its own, under Lubavitch */
#card.world .kicker-world { font-size: 14px; letter-spacing: .06em; margin-bottom: 2px; } /* 770: "World Headquarters" in scale with its big title */
#card h2.honor-h { font-size: 30px; line-height: 1.1; margin-bottom: 6px; } /* Lubavitch and 770: a big, prominent title (owner, Oct 7) */
#card.world { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
#card ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#card li { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#card li strong { font-weight: 500; }
#card .meta, #card p { color: var(--muted); font-size: 13px; margin: 0; }
#card .flag { font-size: 12.5px; font-style: italic; color: var(--muted); }
#card .flag-world { color: var(--accent); font-weight: 600; font-style: normal; }
#card .person { font-size: 13px; margin: 2px 0 0; }
#card .personnel { margin: 2px 0 0; pointer-events: auto; }
#card .personnel summary { cursor: pointer; font-size: 12px; color: var(--accent); list-style: none; }
#card .personnel summary::-webkit-details-marker { display: none; }
#card .personnel .pother { font-size: 13px; margin-top: 3px; padding-left: 10px; }
#card a { color: var(--accent); font-size: 13px; }
#card .foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--panel-line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
#card .close { position: absolute; top: 6px; inset-inline-end: 6px; width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; display: none; }
#card.pinned .close { display: grid; place-items: center; }
#card .close:hover { background: var(--accent-soft); }
#card .zoomto { border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; }
#card .zoomto:hover { border-color: var(--accent); }

/* ---- phones: the options become a bottom sheet ---- */
@media (max-width: 760px) {
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 70%; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .p-head { align-items: center; padding: 10px 16px; }
  .p-head h1 { font-size: 19px; }
  #panel-toggle { display: block; border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 14px; }
  #panel.collapsed #panel-body { display: none; }
  #zoomctl { bottom: calc(var(--sheet, 64px) + 12px); }
  #card, #card.pinned { left: 16px !important; right: 16px; top: auto !important; bottom: calc(var(--sheet, 64px) + 12px); width: auto; max-height: 45%; }
}
@media (prefers-reduced-motion: reduce) {
  .l-insets, .seg button { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="basemap" role="img" aria-label="Map of Chabad shetachim and centers"></div>

  <aside id="panel" class="collapsed" aria-label="Map options">
    <header class="p-head">
      <div>
        <h1>Chabad Shetachim</h1>
        <p class="sub" id="view-name">World</p>
      </div>
      <div class="p-actions">
        <button id="lang-toggle" type="button"></button>
        <button id="theme-toggle" type="button"></button>
        <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body">Options</button>
      </div>
    </header>
    <div id="panel-body">
      <p id="load-error" class="error" hidden></p>
      <dl class="stats">
        <div><dt>Shetachim</dt><dd id="st-shetachim">–</dd></div>
        <div><dt>Centers</dt><dd id="st-centers">–</dd></div>
        <div><dt>Dots</dt><dd id="st-dots">–</dd></div>
      </dl>
      <fieldset class="ctl">
        <legend>Show</legend>
        <div class="seg" data-name="view">
          <button type="button" data-value="world" aria-pressed="true">World</button>
        </div>
        <!-- the other views only when asked for (owner, Oct 7: the default is the whole world) -->
        <details id="views">
        <summary>Regions &amp; countries</summary>
        <div class="seg" data-name="view">
          <button type="button" data-value="europe" aria-pressed="false">Europe</button>
          <button type="button" data-value="fsu" aria-pressed="false">FSU</button>
          <button type="button" data-value="israel" aria-pressed="false">Israel</button>
          <button type="button" data-value="mideast" aria-pressed="false">Middle East</button>
          <button type="button" data-value="asia" aria-pressed="false">Asia</button>
          <button type="button" data-value="africa" aria-pressed="false">Africa</button>
          <button type="button" data-value="oceania" aria-pressed="false">Oceania</button>
          <button type="button" data-value="latam" aria-pressed="false">Latin America</button>
        </div>
        <div class="seg" data-name="view">
          <button type="button" data-value="na" aria-pressed="false">US &amp; Canada</button>
          <button type="button" data-value="us" aria-pressed="false">USA</button>
          <button type="button" data-value="ca" aria-pressed="false">Canada</button>
        </div>
        </details>
      </fieldset>
      <fieldset class="ctl">
        <legend>Map</legend>
        <div class="seg" data-name="base">
          <button type="button" data-value="political" aria-pressed="true">Political</button>
          <button type="button" data-value="streets" aria-pressed="false">Streets</button>
          <button type="button" data-value="physical" aria-pressed="false">Physical</button>
          <button type="button" data-value="tinted" aria-pressed="false">Tinted</button>
        </div>
        <p id="base-msg" class="note" role="status" hidden></p>
      </fieldset>
      <fieldset class="ctl">
        <legend>Borders</legend>
        <div class="seg" data-name="borders">
          <button type="button" data-value="shetach" aria-pressed="true">Shetachim</button>
          <button type="button" data-value="regular" aria-pressed="false">States</button>
          <button type="button" data-value="both" aria-pressed="false">Both</button>
        </div>
        <div class="seg" data-name="lighter" id="lighter-row" hidden>
          <span class="seg-label">Lighter:</span>
          <button type="button" data-value="regular" aria-pressed="true">States</button>
          <button type="button" data-value="shetach" aria-pressed="false">Shetachim</button>
        </div>
        <!-- Israel's held ground, each shown as held or as part of Israel (Countries, Both; owner, Oct 8: "mix and match") -->
        <div class="seg" data-multi="joined" id="held-row" hidden>
          <span class="seg-label">Part of Israel:</span>
          <button type="button" data-value="HELD-GAZA" aria-pressed="false">Gaza</button>
          <button type="button" data-value="HELD-LBN" aria-pressed="false">Lebanon</button>
          <button type="button" data-value="HELD-SYR" aria-pressed="false">Syria</button>
        </div>
      </fieldset>
      <fieldset class="ctl">
        <legend>Labels</legend>
        <div class="seg" data-name="labels">

(async function () {

  // ---------- data ----------
  // The refresh button reloads the page as ?v=<time>: a new address no cache has (the browser's or GitHub's), and every
  // data file and map tile is asked for with the same ?v=, so all of it comes fresh from the site. (The files themselves
  // were asked for at the top of the page: EARLY.)
  const { v: BUST, fresh } = window.EARLY;

  const versions = new Map(); // each file's version (its ETag), for the map tiles' address (tileVersion)
  const get = (url) => window.EARLY.bytes(url).then(({ buf, etag }) => { versions.set(url, etag); return JSON.parse(decoder.decode(buf)); });
  // the map tiles are built with the data files: a short fingerprint of their versions ('' when the site gives none)
  function tileVersion() {
    const t = ['data/geo.json', 'data/shetachim.json'].map((f) => versions.get(f) || '').join('|');
    if (t === '|') return '';
    let h = 2166136261;
    for (let i = 0; i < t.length; i++) h = Math.imul(h ^ t.charCodeAt(i), 16777619);
    return (h >>> 0).toString(36);
  }
  let topo, centersGeo, shetachFile, cityFile;
  try {
    [topo, centersGeo, shetachFile, cityFile] = await Promise.all([get('data/geo.json'), get('data/centers.geojson'), get('data/shetachim.json'), get('data/cities.json').catch(() => [])]);
  } catch (err) {

  // millionth of a degree (a tenth of a metre; the shapes are as they were, and shorter to hand to the map).
  function decodeArcs(t) {
    if (!t.transform) return t;
    const { scale: [kx, ky], translate: [dx, dy] } = t.transform;
    for (const arc of t.arcs) {
      let x = 0, y = 0;
      for (const p of arc) { x += p[0]; y += p[1]; p[0] = Math.round((x * kx + dx) * 1e6) / 1e6; p[1] = Math.round((y * ky + dy) * 1e6) / 1e6; }
    }
    delete t.transform;
    return t;
  }
  decodeArcs(topo);
  // Hebrew: the map's right-to-left text support, asked for from the start (the map waits for it before it starts)
  const RTL_PLUGIN = new URL('lib/mapbox-gl-rtl-text.js', location.href).href; // right-to-left text (Hebrew), from @mapbox/mapbox-gl-rtl-text 0.3.0, kept here

  // ---------- Hebrew ----------
  // The page in Hebrew (the switch in the header, or ?lang=he): every word on it, and the names of the

  let HE = document.documentElement.lang === 'he';
  const HE_TEXT = {
    'Chabad Shetachim': 'שטחי חב״ד', Options: 'אפשרויות', Close: 'סגירה', Shetachim: 'שטחים', Centers: 'מוסדות', Dots: 'נקודות', 'Dot color': 'צבע הנקודות', Gold: 'זהב', Red: 'אדום', Black: 'שחור', Navy: 'כחול כהה', Green: 'ירוק', Purple: 'סגול',
    Show: 'תצוגה', World: 'עולם', Europe: 'אירופה', FSU: 'חבר העמים', Israel: 'ארץ ישראל', 'Middle East': 'המזרח התיכון', Asia: 'אסיה',

    'United States & Canada': 'ארצות הברית וקנדה', 'United States': 'ארצות הברית', 'Former Soviet Union': 'ברית המועצות לשעבר',
    'Latin America & Caribbean': 'אמריקה הלטינית והאיים הקריביים',

    'Zoom in': 'התקרבות', 'Zoom out': 'התרחקות', 'Show all': 'הצגת הכול', 'Load the latest version': 'טעינת הגרסה העדכנית', Zoom: 'זום',
    'Download maps (SVG, PNG)': 'הורדת מפות (SVG, PNG)', 'Map options': 'אפשרויות המפה', 'Map of Chabad shetachim and centers': 'מפת שטחי חב״ד ומוסדותיה', 'Light mode': 'מצב בהיר', 'Dark mode': 'מצב כהה',
    'Loading…': 'טוען…', "This browser can't show the physical map.": 'הדפדפן הזה לא יכול להציג את המפה הפיזית.', "The physical map couldn't load.": 'המפה הפיזית לא נטענה.',
    'Open on chabad.org': 'לעמוד ב-chabad.org', 'World Headquarters': 'המטה העולמי', 'Same address': 'אותה כתובת', City: 'עיר', Population: 'אוכלוסייה',
    Province: 'פרובינציה', State: 'מדינה', Country: 'ארץ', Capital: 'בירה', 'No centralized leadership': 'אין הנהגה מרכזית', Leadership: 'הנהלה',
    // center types (chabad.org's)
    'Chabad House': 'בית חב״ד', 'High School - Girls': 'תיכון לבנות', 'Vocational School': 'בית ספר מקצועי', Preschool: 'גן ילדים', 'Hebrew School': 'תלמוד תורה',
    'Yeshivah Ketanah/Mesivtah': 'ישיבה קטנה', 'Day School': 'בית ספר', 'Yeshivah for Beginners - Men': 'ישיבה למתחילים', Kollel: 'כולל', 'Social Services': 'שירותי רווחה',
    Synagogue: 'בית כנסת', 'Campus Chabad House': 'בית חב״ד בקמפוס', 'Adult Education': 'לימוד למבוגרים', 'High School - Boys': 'תיכון לבנים', Library: 'ספרייה',
    "Teachers' Seminary": 'סמינר למורות', 'Yeshivah Gedolah': 'ישיבה גדולה', 'Jewish Learning Institute': 'JLI – המכון ללימודי יהדות', Publications: 'פרסומים',
    'Jewish Community Center': 'מרכז קהילתי יהודי', 'Tzivos Hashem Chapter': 'סניף צבאות השם', Orphanage: 'בית יתומים', Mikveh: 'מקווה', 'Mikveh (for men)': 'מקווה גברים',
    'Russian Jewry Center': 'מרכז ליהודי רוסיה', 'Publishing House': 'הוצאה לאור', 'Educational Resource Center': 'מרכז חומרי לימוד', 'Rabbinic Council': 'ועד רבנים',
    'Soup Kitchen': 'בית תמחוי', 'Overnight Camp': 'קייטנה עם לינה', 'TV / Radio Programs': 'תוכניות טלוויזיה ורדיו', 'Friendship Circle': 'מעגל ידידות',
    'Charitable Foundation': 'קרן צדקה', "Women's Group": 'קבוצת נשים', Cheder: 'חדר', "Children's Club": 'מועדון ילדים', 'Youth Center': 'מרכז נוער', Kashrut: 'כשרות',
    'Hebrew High': 'תיכון ללימודי יהדות', 'Day Camp': 'קייטנה', Restaurant: 'מסעדה', 'Senior Club & Study': 'מועדון גיל הזהב', 'Teen Club': 'מועדון נוער', Internet: 'אינטרנט',
    'Young Professionals': 'צעירים', Cemetery: 'בית עלמין', 'Semichah Program': 'תוכנית סמיכה', 'Israeli Center': 'מרכז לישראלים', 'Judaica/Gift Shop': 'חנות יודאיקה',
    'Yeshivah for Beginners - Women': 'מדרשה למתחילות', 'Elementary/ Primary School - Boys': 'בית ספר יסודי לבנים', 'Elementary / Primary School - Girls': 'בית ספר יסודי לבנות',
    'Hospitality Center': 'מרכז הכנסת אורחים', 'Senior Center': 'מרכז לגיל הזהב', 'Drug Rehabilitation Center': 'מרכז גמילה', "N'Shei Chabad": 'נשי חב״ד', 'Free Loan Fund': 'גמ״ח',
    'Yeshiva Camp': 'קייטנת ישיבה', 'Humanitarian Aid': 'סיוע הומניטרי', 'Hospital Visitation': 'ביקור חולים', 'Mitzvah Mobile': 'טנק מצוות', 'Yeshivah for Beginners': 'ישיבה למתחילים',
    'Kosher Store': 'חנות כשרה',
  };
  const tr = (t) => (HE && HE_TEXT[t]) || t;

  const DISPUTED = /^(Disputed|במחלוקת)(.*)$/;
  // Both languages are kept: every name on the page holds its English and its Hebrew (data/he.json, loaded the first
  // time Hebrew is asked for) and shows the one the page is in, so the switch in the header changes the language at
  // once, in place, without reloading the page.
  let heData = null;
  const loadHebrew = () => (heData ? Promise.resolve(heData) : get('data/he.json').then((h) => (heData = h)).catch(() => null));
  if (HE) await loadHebrew();
  // obj[field] in the page's language: the English as it came, or, in Hebrew, he(heData) — [value] (even an empty
  // one), or null where there's no Hebrew (then the English stays)
  function dual(obj, field, he) {
    const en = obj[field];

    Object.defineProperty(obj, field, {
      configurable: true, enumerable: true,
      get() { if (!HE || !heData) return en; if (!got) got = he(heData) || [en]; return got[0]; },

  const ORIGINAL = new Map();
  function pageWords() {
    const swap = (en) => (HE && HE_TEXT[en]) || en;
    const walk = (node) => {
      for (const n of node.childNodes) {

          if (!ORIGINAL.has(n)) { const t = n.nodeValue.trim(); if (!t || !HE_TEXT[t]) continue; ORIGINAL.set(n, t); }

    $('#lang-toggle').textContent = HE ? 'EN' : 'עב';
    $('#lang-toggle').lang = HE ? 'en' : 'he';
    $('#lang-toggle').title = HE ? 'English' : 'עברית';
    $('#lang-toggle').setAttribute('aria-label', HE ? 'English' : 'עברית');
  }
  pageWords();

  // Pieces: whole states and provinces, and the parts of states split between shetachim. Each knows its
  // state and its shetach (none where no shetach is entered yet).
  const notShown = new Set(shetachFile.notShown || []);
  const pieces = topo.objects.areas.geometries.filter((g) => !notShown.has(g.properties.state));
  const pieceById = new Map(pieces.map((g) => [g.properties.id, g]));
  const collection = (geometries) => ({ type: 'GeometryCollection', geometries });
  const shetachById = new Map(shetachFile.shetachim.map((s) => [s.id, {
    ...s, lastName: s.lastName || (s.headShliach ? s.headShliach.trim().split(/\s+/).pop() : ''), states: new Set(), pieces: [],
  }]));
  const shetachOf = (g) => shetachById.get(g.properties.shetach) || null;
  for (const g of pieces) {
    const s = shetachOf(g);

  }

    .map((f) => ({ lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], ...f.properties, piece: f.properties.piece || f.properties.region }))
    .filter((d) => pieceById.has(d.piece));
  const centersIn = new Map();
  for (const d of dots) centersIn.set(d.piece, (centersIn.get(d.piece) || 0) + d.centers.length);
  const centersInShetach = (s) => d3.sum(s.pieces, (g) => centersIn.get(g.properties.id) || 0);

  const dotOfCenter = new Map(dots.flatMap((d) => d.centers.map((c) => [c.id, d])));

    return { s, ...cap, piece: dot ? dot.piece : s.pieces[0] && s.pieces[0].properties.id, center: dot && dot.centers.find((c) => c.id === cap.centerId) };
  }));

  const rusPiece = [...pieceById.keys()].find((k) => k.startsWith('RUS:'));

    capitals.push(lub);

  const capitalOfCenter = new Map(capitals.filter((c) => c.centerId).map((c) => [c.centerId, c]));

  const cities = cityFile.map((c) => ({ ...c, piece: c.piece || c.region })).filter((c) => pieceById.has(c.piece))

    .sort((a, b) => b.weight - a.weight);

  let bilingualDone = false;
  function bilingual() {
    if (bilingualDone) return;
    bilingualDone = true;
    const hs = (s) => heData.shetachim[s.id];
    for (const s of shetachById.values()) {
      const englishHead = s.headShliach || '';
      const enTitle = s.headTitle;
      s._enHead = englishHead;
      dual(s, 'name', (h) => hs(s) && [hs(s).name]);
      dual(s, 'short', (h) => hs(s) && [hs(s).short]);
      dual(s, 'headShliach', (h) => hs(s) && [hs(s).headShliach]);
      dual(s, 'mapName', (h) => hs(s) && [hs(s).mapName]);
      dual(s, 'lastName', (h) => hs(s) && [hs(s).lastName]);
      dual(s, 'headTitle', (h) => hs(s) && [hs(s).headTitle || (enTitle && (HE_TEXT[enTitle] || enTitle))]);

      const BORDER = 'hsl(258, 28%, 44%)';
      for (const lid of ['st-line-shetach', 'st-line-inner']) {
        show(lid, physOn && shetachLines);
        paint(lid, 'line-color', BORDER);
        paint(lid, 'line-width', ['interpolate', ['linear'], ['zoom'], 2, 1, 6, 1.7, 10, 2.6]);
        paint(lid, 'line-opacity', fadeOut(lightS ? 0.4 : 0.85));
      }
      paint('st-line-inner', 'line-dasharray', [3, 2]);
      show('st-line-casing', physOn && shetachLines && !lightS);
      paint('st-line-casing', 'line-color', '#ffffff');
      paint('st-line-casing', 'line-width', ['interpolate', ['linear'], ['zoom'], 2, 3, 6, 4.5, 10, 6]);
      paint('st-line-casing', 'line-opacity', fadeOut(0.55));
      // Physical: no tint, the land itself (greens, deserts, relief) with the shetachim's borders only (owner, Oct 7: tints
      // made it look like a political map). Tinted, the fourth map: the same with each shetach softly tinted.
      show('st-tint', physOn && shetachLines && state.base === 'tinted');
      map.setFilter('st-tint', ['all', inView, ['>=', ['get', 'cs'], 0]]);
      paint('st-tint', 'fill-color', state.color === 'plain' ? '#ffffff' : ['match', ['get', 'cs'], ...PHYS_TINTS.flatMap((c, i) => [i, c]), '#ffffff']);
      paint('st-tint', 'fill-opacity', ['interpolate', ['linear'], ['zoom'], 0, lightS ? 0.22 : 0.42, 6, lightS ? 0.2 : 0.36, 9, 0.22, 11, 0.08, 12, 0]);
    }
    // dots: as before, growing with zoom like k^0.35 from the framed view, up to 60× it
    const ds = dotStyle();
    for (const T of [V.M, V.F]) {
      if (!T) continue;
      const on = T === S, id = (n) => n + T.sfx;
      const zf = T.zFit ?? 2, r = (dz) => ['*', ['+', ds.a, ['*', ds.b, ['get', 'l']]], 2 ** (0.35 * dz)];
      const radius = ['interpolate', ['exponential', 2 ** 0.35], ['zoom'], zf - 2, r(-2), zf + Math.log2(60), r(Math.log2(60))];
      show(id('dots'), on && state.dots);
      paint(id('dots'), 'circle-radius', radius);
      paint(id('dots'), 'circle-color', ds.color === 'dot' ? pal.dot : pal.dotSolid);
      paint(id('dots'), 'circle-opacity', ds.alpha === 1 ? 1 : ds.alpha + 0.1);
      paint(id('dots'), 'circle-stroke-width', ds.alpha === 1 ? 0.6 : 0);
      paint(id('dots'), 'circle-stroke-color', pal.dotEdge);
      show(id('hover-dot'), on);
      show(id('hover-area'), on);
      paint(id('hover-dot'), 'circle-radius', ['interpolate', ['exponential', 2 ** 0.35], ['zoom'], zf - 2, ['+', r(-2), 2.5], zf + Math.log2(60), ['+', r(Math.log2(60)), 2.5]]);
      paint(id('hover-dot'), 'circle-stroke-color', pal.accent);
      paint(id('hover-area'), 'line-color', pal.accent);
      // names, cities, capitals: in the street map's way (dark grey with a soft white halo); on the street map its own
      // cities, which ours would only double
      if (on) setNames(T); // (the other map's names are worked out when it's shown)
      for (const lid of ['names', 'names-alt', 'cities', 'cities-big', 'cap-names', 'honor']) {
        paint(id(lid), 'text-color', /^names/.test(lid) ? ['case', ['==', ['get', 'kind'], 'miss'], pal.missing, ['==', ['get', 'kind'], 'sec'], pal.secondary, pal.ink] : lid === 'cities' || lid === 'cities-big' || lid === 'cap-names' ? (pal.dark ? '#c9d1d6' : '#333333') : pal.ink);
        paint(id(lid), 'text-halo-color', pal.halo);
        paint(id(lid), 'text-halo-width', /^names/.test(lid) ? 1.6 : 1.2);
        paint(id(lid), 'text-halo-blur', 0.8);
      }
      show(id('seas'), on && T.flat);
      paint(id('seas'), 'text-color', G.seaText || (pal.dark ? '#7f9cc0' : '#4a6390'));
      paint(id('seas'), 'text-halo-color', G.water);
      paint(id('seas'), 'text-halo-width', 1);
      show(id('names'), on && state.labels !== 'off');
      show(id('names-alt'), on && state.labels !== 'off');
      show(id('cities'), on && state.cities);
      show(id('cities-big'), on && state.cities);
      show(id('caps'), on && state.capitals);
      show(id('cap-names'), on && state.capitals && !street);
      show(id('honor'), on);
      const zs = T.zFit ?? 2;
      map.setLayoutProperty(id('caps'), 'icon-size', ['interpolate', ['linear'], ['zoom'], zs, phone() ? 0.42 : 0.6, zs + 3, 1]);
    }
    if (pinned) showCard(pinned, lastPoint, true);
  }

  // whether S's areas are on the map yet (its names wait for them: names over an empty sea looked broken)
  const areasShown = (S) => { const f = FED.get(`areas${S.sfx}`); return !!f && f[0] === S; };
  function setNames(T) {
    const what = `names|${labelKey()}`;
    if (T.made.has(what) && areasShown(T)) { feed(T, 'names', what, () => T.made.get(what) || EMPTY); markDrawn(); return; }
    if (T.made.has(what)) return; // (handed over with the areas: feedSet)
    // (not worked out yet: no names for now rather than another view's or mode's, and these as soon as they're ready)
    feed(T, 'names', 'none', () => EMPTY);
    namesFor(T).then((data) => { if (data && T === V.cur) setNames(T); }, (e) => console.error(e));
  }

  // ---------- hover and tap ----------
  const card = $('#card');
  let pinned = null, lastPoint = { clientX: 0, clientY: 0 };
  // What's under a point on screen: Lubavitch or a capital, a dot, a city, or an area.
  function pickAt(point, touch) {
    const reach = touch ? 14 : 8, sfx = V.cur.sfx;
    const box = [[point.x - reach, point.y - reach], [point.x + reach, point.y + reach]];
    const q = (ids) => map.queryRenderedFeatures(box, { layers: ids.map((id) => id + sfx).filter((id) => map.getLayer(id) && map.getLayoutProperty(id, 'visibility') !== 'none') });
    const nearest = (fs) => d3.least(fs, (f) => { const p = map.project(f.geometry.coordinates); return Math.hypot(p.x - point.x, p.y - point.y); });
    let f = nearest(q(['honor', 'caps']));
    if (f) return { capital: V.caps[f.properties.i] };
    f = nearest(q(['dots']));
    if (f) return { dot: V.dots[f.properties.i] };
    f = nearest(q(['cities']));
    if (f) return { city: V.cities[f.properties.i] };
    // Countries with Head shliach names: a head's name stands for his whole shetach (owner, Oct 8: tapping Bentolila's
    // name outlines all his countries)
    if (state.borders === 'regular' && state.labels === 'full') {
      f = nearest(q(['names', 'names-alt']).filter((x) => shetachById.has(x.properties.sid)));
      if (f) return { shetach: shetachById.get(f.properties.sid) };
    }
    const a = map.queryRenderedFeatures(point, { layers: [`pick${sfx}`] })[0];
    return a ? { piece: pieceById.get(a.properties.id).properties } : null;
  }
  // The area a card is about: its state with States borders, else its shetach or the blank part of its state.
  function areaOf(S, pieceId) {
    const g = pieceById.get(pieceId), s = shetachOf(g);
    if (state.borders === 'regular') {
      const st = joinedState(polState(g.properties));
      // Israel with what's shown as part of it: one outline round them all
      if (st === 'ISR' && state.joined.size) {
        const key = [...state.joined].sort().join();
        if (!S.israelJoined || S.israelJoined.key !== key) {
          const gs = V.main.filter((x) => x.properties.country === 'ISR' && joinedState(x.properties.state) === 'ISR');
          S.israelJoined = { key, geometry: within(S, () => projGeom(topojson.merge(topo, gs))) };
        }
        return S.israelJoined;
      }
      return S.states.find((r) => r.st === st);
    }
    if (s) return S.regions.find((r) => r.s === s);
    const gs = V.main.filter((x) => !shetachOf(x) && x.properties.state === g.properties.state);
    return gs.length ? { geometry: within(S, () => projGeom(topojson.merge(topo, gs))) } : null;
  }
  function highlight(hit) {
    if (!glOK) return;
    const S = V.cur;
    const dot = hit && (hit.dot || (hit.capital && dotOfCenter.get(hit.capital.centerId)));
    const area = hit && hit.shetach ? shetachArea(S, hit.shetach) : hit && hit.piece && V.mainIds.has(hit.piece.id) ? areaOf(S, hit.piece.id) : null;
    map.getSource(`hover-dot${S.sfx}`).setData(dot && state.dots && V.mainIds.has(dot.piece) ? feature({ type: 'Point', coordinates: within(S, () => P(dot.lon, dot.lat)) }, { l: Math.log2(dot.centers.length) }) : EMPTY);
    map.getSource(`hover-area${S.sfx}`).setData(area && area.geometry ? feature(area.geometry) : EMPTY);
  }
  // Zoom to an area (in the way it's drawn now).
  function zoomToArea(pieceId) { zoomTo(areaOf(V.cur, pieceId)); }
  // A shetach with its territories (Thailand with India): one outline round all its countries, worked out once a set
  function shetachArea(S, s) {
    const top = groupOf(s.id), gs = V.main.filter((g) => groupOf(g.properties.shetach) === top);
    if (!gs.length) return null;
    if (gs.every((g) => g.properties.shetach === s.id)) return S.regions.find((r) => r.s === s) || null;
    S.groupAreas = S.groupAreas || new Map();
    if (!S.groupAreas.has(top)) S.groupAreas.set(top, { geometry: within(S, () => projGeom(topojson.merge(topo, gs))) });
    return S.groupAreas.get(top);
  }
  function zoomTo(area) {
    const S = V.cur;
    if (!area || !area.geometry) return;
    const b = S.flat && !S.boxed ? flatBounds(area.geometry) : d3.geoBounds(feature(area.geometry)); // (boxed: standard outside the boxes, Alaska across 180°)
    const bounds = b[0][0] > b[1][0] ? [[b[0][0], b[0][1]], [b[1][0] + 360, b[1][1]]] : b;
    map.fitBounds(bounds, { padding: framePadding(), duration: still ? 0 : 900, maxZoom: 12 });
  }

  const headHTML = (t) => { const m = DISPUTED.exec(t || ''); return m ? `<em>${esc(m[1])}</em>${esc(m[2])}` : esc(t); };
  const count = (n) => (HE ? (n === 1 ? 'מוסד אחד' : `${fmt(n)} מוסדות`) : `${fmt(n)} ${n === 1 ? 'center' : 'centers'}`);
  // a center's page: chabad.org's, or, for one not listed there, its own elsewhere (Chabad of India's directory: owner,
  // Oct 8, "the same should be for these Chabad India ones")
  const chabadLink = (c) => (c && c.slug ? `<a href="https://www.chabad.org/jewish-centers/${esc(c.pageId || c.id)}/${esc(c.slug)}" target="_blank" rel="noopener">${tr('Open on chabad.org')}</a>`
    : c && c.url && /^https:\/\//.test(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${HE ? `לדף ב${esc(c.siteHe || c.site)}` : `Open on ${esc(c.site || new URL(c.url).hostname)}`}</a>` : '');
  // withHead: false just names the shetach whose territory this is, without implying its head shliach
  // runs the place — used for 770, which sits in New York City's territory but isn't Tzach's to run.
  function shetachLine(pieceId, withHead = true) {
    const g = pieceById.get(pieceId);
    const s = g && shetachOf(g);
    if (s) return shetachWithHead(s, withHead);
    return g ? esc(g.properties.name) : '';
  }
  // "Central Africa · Shlomo Bentolila" (a territory like India: its parent's head)
  function shetachWithHead(s, withHead = true, label = s.name) {
    const head = (s.territoryOf && shetachById.get(s.territoryOf) || s).headShliach;
    return withHead && head ? `${esc(label)} · ${headHTML(head)}` : esc(label);
  }
  // On a state several shetachim share, each line names its part of the state (owner, Oct 8: Ontario's card says "Essex
  // County · Berel Shemtov", not "Michigan · …"), from data/shetachim.json `partNames`; else the shetach's own name
  // already says it (Northeast Ohio, Long Island)
  const partName = (state, s) => { const n = (shetachFile.partNames || {})[state]; const v = n && n[s.id]; return v ? v[HE ? 1 : 0] || v[0] : s.name; };
  // A country's own head shliach, where its shetach spans several countries (Kenya in Central Africa): the first living
  // man listed at its national center on chabad.org (data/country-heads.json names the center; the owner, Oct 7: "who is
  // head shliach of that country, with head of shetach on top of him")
  const countryHeads = shetachFile.countryHeads || {};
  // "in Kenya" in Hebrew: ב + the name, the article dropped where the name has one (ברפובליקה הדומיניקנית)
  const heIn = (name) => `ב${/^ה(רפובליקה|אמירויות|פיליפינים|ממלכה|איים|וותיקן)/.test(name) ? name.slice(1) : name}`;
  function countryHeadHTML(p, shetachim) {
    const id = countryHeads[p.state];
    if (!id || shetachim.length !== 1) return '';
    const d = dotOfCenter.get(id), c = d && d.centers.find((x) => x.id === id);
    const man = c && (c.personnel || []).find((x) => !x.isDeceased && isMale(x));
    if (!man) return '';
    // ("in the Bahamas", "in the Cayman Islands", "in the Dominican Republic")
    const the = /(Islands|Republic|Bahamas|Netherlands|Kingdom|States|Emirates|Philippines)$/.test(p.name) ? 'the ' : '';
    return `<p>${HE ? `השליח הראשי ${esc(heIn(p.name))}` : `Head shliach in ${the}${esc(p.name)}`}: ${esc(personName(man))}</p>`;
  }

  // A shetach's flagship center; 770 (world HQ) gets its own wording rather than "of New York City".
  const capKicker = (c) => (c.world ? tr('World Headquarters') : (HE ? `המוסד המרכזי של ${esc(c.s.name)}` : `${esc(c.s.name)} flagship center`) + (c.for ? ` · ${esc(c.for)}` : ''));

  // Who's listed at a center (chabad.org's own listing, or ours for unlisted centers). The owner's rule: the shliach shown
  // is the first man listed who's alive (a woman listed first, or a man who has passed away, is passed over). With no
  // living man: where a man listed has passed away (her husband), "<last name> family" from the living woman; where
  // only women are listed (a mikvah Mrs. Axelrod runs), the first woman by name. Everyone else alive goes under "+more"; anyone who has passed
  // away in a "Deceased" section, each with obm / ע״ה after the name. Men and women are told apart by title (Mrs., Ms., Miss, Rebbetzin = women).
  const FEMALE = /^(mrs|ms|miss|rebbetzin|rebbitzen|mme|madame|sra|frau)\.?$/i;
  const isMale = (p) => !FEMALE.test((p.title || '').trim());
  // a person's name and position in the page's language (Hebrew: first names word by word, the last name whole; a
  // position has a man's and a woman's form where Hebrew needs them)
  const heFirst = (n) => (n || '').trim().split(/\s+/).filter(Boolean).map((w) => (heData && heData.first && heData.first[w]) || w).join(' ');
  const heLast = (n) => (heData && heData.last && heData.last[(n || '').trim()]) || n;
  const firstOf = (p) => (HE ? heFirst(p.firstName) : p.firstName);
  const lastOf = (p) => (HE ? heLast(p.lastName) : p.lastName);
  const positionOf = (p) => {
    const pos = (p.position || '').trim();
    if (!HE || !pos) return pos;
    const h = heData && heData.positions && heData.positions[pos];
    if (h === undefined) return pos;
    return Array.isArray(h) ? h[isMale(p) ? 0 : 1] : h;
  };
  const personName = (p) => `${[firstOf(p), lastOf(p)].filter(Boolean).join(' ')}${p.isDeceased ? (HE ? ' ע״ה' : ' obm') : ''}`;
  // The center in Lubavitch (opened 2008 near the Rebbeim's graves; not on chabad.org's locator, so given here), shown
  // on Lubavitch's card as a center of its own, under a divider
  const LUBAVITCH_CENTER_PEOPLE = [{ title: 'Rabbi', firstName: 'Gavriel', lastName: 'Gordon', position: 'Director', isDirector: true, isDeceased: false }];
  const personLine = (p) => { const pos = positionOf(p); return `${esc(personName(p))}${pos ? ` <span class="meta">· ${esc(pos)}</span>` : ''}`; };
  function personnelHTML(list) {
    if (!list || !list.length) return '';
    const living = list.filter((p) => !p.isDeceased), passed = list.filter((p) => p.isDeceased);
    const primary = living.find(isMale);
    const woman = !primary && living.find((p) => !isMale(p) && p.lastName);
    const widowed = woman && passed.some(isMale);
    const head = primary ? personLine(primary) : widowed ? esc(HE ? `משפחת ${lastOf(woman)}` : `${woman.lastName} family`) : woman ? personLine(woman) : '';
    const others = living.filter((p) => p !== primary && !(woman && !widowed && p === woman)); // under "<name> family" she's still listed
    const more = others.length
      ? `<details class="personnel"><summary>+${others.length} ${HE ? 'נוספים' : 'more'}</summary>${others.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    const obm = passed.length
      ? `<details class="personnel"><summary>${HE ? 'נפטרו' : 'Deceased'} (${passed.length})</summary>${passed.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    return `${head ? `<p class="person">${head}</p>` : ''}${more}${obm}`;
  }

  function dotHTML(d) {
    const n = d.centers.length;
    const items = d.centers.map((c) => {
      const cap = capitalOfCenter.get(c.id);
      return `<li>
        <strong>${esc(c.name)}</strong>
        <span class="meta">${esc([c.type, c.city].filter(Boolean).join(' · '))}</span>
        ${personnelHTML(c.personnel)}
        ${cap ? `<span class="flag${cap.world ? ' flag-world' : ''}">${capKicker(cap)}</span>` : ''}
        ${chabadLink(c)}
      </li>`;
    }).join('');
    const head = n > 1 ? `<span class="kicker">${HE ? `${n} מוסדות בכתובת זו` : `${n} listings at this address`}</span><h2>${esc(d.centers[0].city || tr('Same address'))}</h2>` : '';
    return `${head}<ul>${items}</ul><div class="foot"><span class="meta">${shetachLine(d.piece)}</span></div>`;
  }

  function capitalHTML(c) {
    if (c.honor) return `<h2 class="honor-h">${esc(c.name)}</h2>
      <p class="meta">${HE ? 'מקום מושב הרביים, תקע״ג–תרע״ה' : 'Seat of the Rebbeim, 1813–1915'}</p>
      <div class="subcard"><ul><li><strong>${HE ? 'חצר רבותינו נשיאינו בליובאוויטש' : "Hatzer Raboteinu Nesieinu B'Lubavitch"}</strong>
        <span class="meta">${esc([HE ? 'מרכז מורשת' : 'Heritage center', HE ? 'ליובאוויטש' : 'Lubavitch'].join(' · '))}</span>
        ${personnelHTML(LUBAVITCH_CENTER_PEOPLE)}</li></ul></div>`;
    return `<span class="kicker${c.world ? ' kicker-world' : ''}">${capKicker(c)}</span><h2${c.world ? ' class="honor-h"' : ''}>${esc(c.name)}</h2>
      ${c.city ? `<p>${esc(c.city)}</p>` : ''}${personnelHTML(c.center && c.center.personnel)}${chabadLink(c.center)}
      <div class="foot"><span class="meta">${shetachLine(c.piece, !c.world)}</span></div>`;
  }

  function cityHTML(c) {
    const pop = c.pop ? `<p>${tr('Population')} ${fmt(c.pop)}</p>` : '';
    return `<span class="kicker">${tr('City')}</span><h2>${esc(c.name)}</h2>${pop}
      <div class="foot"><span class="meta">${count(c.centers)} · ${shetachLine(c.piece)}</span></div>`;
  }

  const areaKind = (p) => tr(p.state.startsWith('HELD-') ? 'Held by Israel' : p.country === 'CA' ? 'Province' : p.state.includes('-') ? 'State' : 'Country');
  function areaHTML(p) {
    const g = pieceById.get(p.id), s = shetachOf(g);
    const inMain = V.main.includes(g);
    const zoomBtn = inMain ? `<button type="button" class="zoomto" data-piece="${esc(p.id)}">${tr('Zoom in')}</button>` : '';
    if (state.borders === 'regular' || !s) {
      // as the Countries map shows it: occupied Ukraine is Russia's, a held area shown as part of Israel is Israel's
      // (that country's own card, its centers all of what the map shows as it)
      const pst = state.borders === 'regular' ? joinedState(polState(p)) : p.state;
      const own = pst !== p.state && pieces.find((x) => x.properties.state === pst);
      if (own) p = own.properties;
      const shownAs = (x) => (state.borders === 'regular' ? joinedState(polState(x.properties)) : x.properties.state) === p.state;
      const inState = [...new Set(pieces.filter(shownAs).map(shetachOf).filter(Boolean))];
      const centers = d3.sum(pieces, (x) => (shownAs(x) ? centersIn.get(x.properties.id) || 0 : 0));
      // each shetach covering it, with its head; then the country's own head shliach where its shetach spans several
      const part = state.borders === 'regular' ? inState.map((x) => `<p>${shetachWithHead(x, true, inState.length > 1 ? partName(p.state, x) : x.name)}</p>`).join('') + countryHeadHTML(p, inState) : '';
      return `<span class="kicker">${areaKind(p)}</span><h2>${esc(p.name)}</h2>${part}
        <div class="foot"><span class="meta">${count(centers)}</span>${zoomBtn}</div>`;
    }
    return shetachHTML(s, zoomBtn);
  }
  // A shetach's card: its head (or "Overseen by" for a territory, "Shluchim: … family"), its capital(s), its centers
  function shetachHTML(s, zoomBtn) {
    // (the page's capitals, which hold both languages: name, town and claimant in Hebrew too)
    const caps = capitals.filter((c) => !c.honor && c.s === s);
    // "Capital: …", or for a disputed shetach "Capital (Chaim Tzvi Groner): …", one per claimant
    const capital = caps.map((c) => `<p>${tr('Capital')}${c.for ? ` (${esc(c.for)})` : ''}: ${esc(c.name)}${c.city ? `, ${esc(c.city)}` : ''}</p>`).join('');
    // a family at the head (Pinson, Blumenfeld): "Shluchim: Pinson family" (they are the shluchim there)
    return `<h2>${esc(s.name)}</h2>
      ${s.territoryOf && shetachById.get(s.territoryOf) ? (() => { const p = shetachById.get(s.territoryOf); return `<p>${HE ? 'בהנהגת' : 'Overseen by'} ${headHTML(p.headShliach)}</p>`; })()
        : s.noCentralLeadership ? `<p>${tr('No centralized leadership')}</p>`
        : s.headShliach && / family$|^משפחת /.test(s.headShliach) ? `<p>${HE ? 'שלוחים' : 'Shluchim'}: ${headHTML(s.headShliach)}</p>`
        : s.headShliach ? `<p>${esc(s.headTitle || tr('Head shliach'))}: ${headHTML(s.headShliach)}</p>` : ''}${capital}
      <div class="foot"><span class="meta">${count(centersInShetach(s))}</span>${zoomBtn}</div>`;
  }


  // A head shliach's name tapped: his shetach's card, and under it a card for each territory of it in the view (owner,
  // Oct 8: Kantor → Thailand's card on top, India's under it). "Zoom in" on the first fits them all, on a territory's itself.
  function shetachCards(s) {
    const top = shetachById.get(groupOf(s.id)) || s;
    const inView = (x) => V.main.some((g) => g.properties.shetach === x.id);
    const group = [top, ...[...shetachById.values()].filter((x) => x.territoryOf === top.id && inView(x))];
    const zoom = (x, i) => `<button type="button" class="zoomto" data-shetach="${esc(x.id)}"${i ? ' data-own="1"' : ''}>${tr('Zoom in')}</button>`;
    return group.length > 1 ? group.map((x, i) => `<div class="part">${shetachHTML(x, zoom(x, i))}</div>`).join('') : shetachHTML(s, zoom(s, 0));
  }
  function showCard(hit, event, pin) {
    card.innerHTML = (hit.dot ? dotHTML(hit.dot) : hit.capital ? capitalHTML(hit.capital) : hit.city ? cityHTML(hit.city)
      : hit.shetach ? shetachCards(hit.shetach)
      : areaHTML(hit.piece)) +
      '<button type="button" class="close" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
    card.hidden = false;
    card.classList.toggle('pinned', pin);
    card.classList.toggle('world', !!(hit.capital && (hit.capital.world || hit.capital.honor))); // 770 and Lubavitch: the special card
    card.classList.toggle('stack', !!card.querySelector(':scope > .part'));
    lastPoint = { clientX: event.clientX, clientY: event.clientY };
    if (!phone()) {
      const app = $('#app').getBoundingClientRect(), W = app.width, H = app.height;
      const cw = card.offsetWidth, ch = card.offsetHeight;
      let x = event.clientX - app.left + 14, y = event.clientY - app.top + 14;
      if (x + cw > W - 8) x = event.clientX - app.left - cw - 14;
      if (y + ch > H - 8) y = Math.max(8, H - ch - 8);
      card.style.left = `${Math.max(8, x)}px`;
      card.style.top = `${y}px`;
    }
    highlight(hit);
  }
  function hideCard() {
    card.hidden = true;
    pinned = null;
    highlight(null);
  }
  card.addEventListener('click', (e) => {
    if (e.target.closest('.close')) { hideCard(); return; }
    const z = e.target.closest('.zoomto');
    if (z) {
      hideCard();
      const s = z.dataset.shetach && shetachById.get(z.dataset.shetach);
      if (s) zoomTo(z.dataset.own ? V.cur.regions.find((r) => r.s === s) : shetachArea(V.cur, s)); else zoomToArea(z.dataset.piece);
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCard(); });

  // ---------- options ----------
  function pressed(name, value) {
    document.querySelectorAll(`.seg[data-name="${name}"] button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
  }
  // "Part of Israel": each held area on its own (several may be on at once)
  $('#held-row').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const st = b.dataset.value, on = !state.joined.has(st);
    if (on) state.joined.add(st); else state.joined.delete(st);
    b.setAttribute('aria-pressed', String(on));
    apply();
  });
  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    if (seg.dataset.multi) return; // (its own handler)
    const b = e.target.closest('button');
    if (!b) return;
    const name = seg.dataset.name;
    if (name === 'base' && /^(physical|tinted)$/.test(b.dataset.value) && glOK && !physicalOK) {
      $('#base-msg').hidden = false;
      $('#base-msg').className = 'error';
      $('#base-msg').textContent = tr("The physical map couldn't load.");
      return;
    }
    $('#base-msg').hidden = true;
    pressed(name, b.dataset.value);
    state[name] = b.dataset.value;
    if (name === 'view' || name === 'alaska') { hideCard(); showView(name === 'view'); return; }
    if (name === 'base' && glOK) {
      // at the view as framed, the other look framed too (the physical world isn't flat); closer in, the same place
      const framed = V.cur.zFit != null && map.getZoom() < V.cur.zFit + 0.75;
      if (framed) {
        apply();
        frameView(false);
      } else { apply(); setMode(wantedSet()); }
      limits();
      return;
    }
    apply();
  }));
  $('#show-empty').addEventListener('change', (e) => { state.empty = e.target.checked; apply(); });
  // (owner, Oct 7: with Shetachim borders too, the countries no shetach covers can be seen as ordinary countries, each
  // with its borders; on the political map that shows the rest of the world as well)
  $('#show-rest-borders').addEventListener('change', (e) => { state.restBorders = e.target.checked; apply(); });
  $('#show-sea').addEventListener('change', (e) => { state.sea = e.target.checked; apply(); });
  for (const [id, key] of [['#show-dots', 'dots'], ['#show-cities', 'cities'], ['#show-capitals', 'capitals']]) {
    $(id).addEventListener('change', (e) => { state[key] = e.target.checked; apply(); });
  }
  // Light or dark, whichever the device uses until one is picked here; the pick is remembered.
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const theme = () => document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
  const SUN = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg>';
  const MOON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 12.6A7 7 0 0 1 7.4 3.4a7 7 0 1 0 9.2 9.2z"/></svg>';
  function showThemeButton() {
    const dark = theme() === 'dark';
    $('#theme-toggle').innerHTML = dark ? SUN : MOON;
    $('#theme-toggle').setAttribute('aria-label', tr(dark ? 'Light mode' : 'Dark mode'));
  }
  $('#theme-toggle').addEventListener('click', () => {
    const next = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('shetachim-theme', next); } catch (e) { /* not remembered, still switched */ }
    showThemeButton();
    apply();
  });
  darkQuery.addEventListener('change', () => { showThemeButton(); apply(); });
  showThemeButton();

  const syncSheet = () => document.documentElement.style.setProperty('--sheet', `${$('#panel').getBoundingClientRect().height}px`);
  $('#more').addEventListener('toggle', syncSheet);
  $('#views').addEventListener('toggle', syncSheet);
  $('#panel-toggle').addEventListener('click', () => {
    const panel = $('#panel');
    const open = panel.classList.toggle('collapsed') === false;
    $('#panel-toggle').setAttribute('aria-expanded', String(open));
    $('#panel-toggle').textContent = tr(open ? 'Close' : 'Options');
    syncSheet();
  });
  $('#zin').addEventListener('click', () => map && map.zoomIn({ duration: still ? 0 : 300 }));
  $('#zout').addEventListener('click', () => map && map.zoomOut({ duration: still ? 0 : 300 }));
  $('#zreset').addEventListener('click', () => { hideCard(); if (map) frameView(true); });
  let resizeTimer = 0, wasPhone = phone();
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { syncSheet(); if (phone() !== wasPhone) { wasPhone = phone(); apply(); } }, 150);
  });

  // The language switch: the page, the panel and the map's names change over in place.

  async function setLanguage(lang) {
    const he = lang === 'he';
    if (he === HE) return;
    if (he) {
      await loadHebrew();
      // right-to-left shaping for the map's Hebrew names, loaded the first time Hebrew is shown
      // right-to-left shaping for the map's Hebrew names, loaded the first time Hebrew is shown (a tap meanwhile waits)
      await (rtlLoad || (rtlLoad = loadRTL()));
      bilingual();
    }
    HE = he;
    try { localStorage.setItem('shetachim-lang', lang); } catch (e) { /* not remembered, still switched */ }
    const q = new URLSearchParams(location.search);
    q.delete('lang');
    history.replaceState(null, '', `${location.pathname}${q.toString() ? `?${q}` : ''}${location.hash}`);
    document.documentElement.lang = lang;
    document.documentElement.dir = he ? 'rtl' : 'ltr';
    document.title = he ? 'מפת שטחי חב״ד' : 'Chabad Shetachim Map';
    pageWords();
    showThemeButton();
    $('#panel-toggle').textContent = tr($('#panel').classList.contains('collapsed') ? 'Options' : 'Close');
    $('#view-name').textContent = tr(V.view.name);
    const regular = tr(V.view.world ? 'Countries' : 'States');
    document.querySelectorAll('[data-name="borders"] [data-value="regular"], [data-name="lighter"] [data-value="regular"]').forEach((btn) => { btn.textContent = regular; });
    syncSheet();
    if (!glOK) return;
    baseLanguage();
    // the map's own names, cities, capitals and seas in this language (apply hands them over again)
    apply();
    if (pinned) showCard(pinned, lastPoint, true); else hideCard();
  }
  let switching = null; // (a tap while the language is still changing waits for it, then switches back)
  $('#lang-toggle').addEventListener('click', () => { switching = (switching || Promise.resolve()).then(() => setLanguage(HE ? 'en' : 'he')).finally(() => { switching = null; }); });

  // ---------- start ----------
  syncSheet();
  viewData();
  prepSet(V.cur); // (the first shapes are worked out while the map starts)
  try {
    await startMap();
  } catch (err) {
    $('#panel').classList.remove('collapsed');
    $('#load-error').hidden = false;
    $('#load-error').textContent = HE ? `המפה לא נטענה (${err.message}). נסו לטעון את הדף מחדש.` : `The map didn't load (${err.message}). Reload the page to try again.`;
    return;
  }
  map.on('mousemove', (e) => {
    if (pinned || e.originalEvent.buttons) return;
    const hit = pickAt(e.point, false);
    map.getCanvas().style.cursor = hit && !hit.piece ? 'pointer' : '';
    if (hit) showCard(hit, e.originalEvent, false); else hideCard();
  });
  map.getCanvas().addEventListener('mouseleave', () => { if (!pinned) hideCard(); });
  map.on('click', (e) => {
    const touch = e.originalEvent.pointerType === 'touch' || coarse();
    const hit = pickAt(e.point, touch);
    if (!hit) { hideCard(); return; }
    pinned = hit;
    showCard(hit, e.originalEvent, true);
  });
  map.on('movestart', (e) => { if (e.originalEvent && !pinned) hideCard(); });
  showView(false);
  // the credits start folded on a phone (an (i) to open them), as map sites do
  if (phone()) { const at = document.querySelector('.maplibregl-ctrl-attrib'); if (at) at.classList.remove('maplibregl-compact-show'); }
  // ready: for tests and anyone curious
  window.__map = map;
  window.__dbg = { map: () => map, showCard: (hit) => showCard(hit, { clientX: 400, clientY: 300 }, true), labelData, V: () => V, dotData, spotsFor, partsOf, polylabel, unlon, unlat, PX, setMode, centreLL, spanKm,
    zoomTo: (st) => zoomToArea(pieces.find((g) => g.properties.state === st).properties.id),
    at: (lon, lat) => map.jumpTo({ center: within(V.cur, () => P(lon, lat)) }),
    go: (lon, lat, z) => { V.cur = V.M; limits(); apply(); map.jumpTo({ center: [lon, lat], zoom: z }); }, // go: a standard place and zoom (the map then picks flat or standard)
    // settled: nothing left to work out or hand over for the map shown, its names included, and the map has drawn it
    settled: () => { const n = FED.get(`names${V.cur.sfx}`); return !WAITING.length && !!V.cur.fedAll && map.loaded() && (state.labels === 'off' || (!!n && n[0] === V.cur && n[1] === `names|${labelKey()}`)); } };
  document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
