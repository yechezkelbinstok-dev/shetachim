<!doctype html><meta charset="utf-8">
<style>
body{margin:0;font:13px system-ui;background:#fff;color:#5b6670}
.row{display:flex;align-items:center;gap:22px;padding:10px 16px;border-bottom:1px solid #eee}
.row.dark{background:#15191d;color:#9aa5ae}
.lab{width:40px;font-weight:600}
svg{display:block}
.line{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.4;color:#1d2a33}
.dark .line{color:#e6edf2}
.line svg{flex:none;width:14px;height:14px;margin-top:2px;color:#68737d}
.line.s16 svg{width:16px;height:16px;margin-top:1px}
.dark .line svg{color:#9aa5ae}
.big svg{width:96px;height:96px}
</style>
<body>
<script>
const W = 'fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
const V = {
 person: `<circle cx="8" cy="5.2" r="2.7" ${W}/><path d="M2.8 14c.6-2.9 2.7-4.4 5.2-4.4s4.6 1.5 5.2 4.4" ${W}/>`,
 F: `<path d="M1.7 6.3C4.9 5.4 11.1 5.4 14.3 6.3" ${W}/><path d="M4.6 5.7C4.5 3.4 5.2 1.7 6.5 1.6C7.3 1.5 7.6 2.3 8 2.3S8.7 1.5 9.5 1.6C10.8 1.7 11.5 3.4 11.4 5.7" ${W}/><path d="M4.8 7.6C4.8 11.6 6.2 14.4 8 14.4S11.2 11.6 11.2 7.6" ${W}/><path d="M6.5 10.4C7.4 11 8.6 11 9.5 10.4" ${W}/>`,
 F3: `<path d="M1.8 6.2C4.9 5.3 11.1 5.3 14.2 6.2" ${W}/><path d="M4.9 5.6C4.8 3.6 5.4 2 6.6 1.9C7.3 1.8 7.6 2.4 8 2.4S8.7 1.8 9.4 1.9C10.6 2 11.2 3.6 11.1 5.6" ${W}/><path d="M4.9 7.4C4.9 10.6 6 13.1 7.3 14C7.7 14.3 8.3 14.3 8.7 14C10 13.1 11.1 10.6 11.1 7.4" ${W}/><path d="M6.6 10C7.5 10.6 8.5 10.6 9.4 10" ${W}/>`,
 F4: `<path d="M1.8 6.2C4.9 5.3 11.1 5.3 14.2 6.2" ${W}/><path d="M4.9 5.6C4.8 3.6 5.4 2 6.6 1.9C7.3 1.8 7.6 2.4 8 2.4S8.7 1.8 9.4 1.9C10.6 2 11.2 3.6 11.1 5.6" ${W}/><path d="M4.9 7.4C4.9 10.6 6 13.1 7.3 14C7.7 14.3 8.3 14.3 8.7 14C10 13.1 11.1 10.6 11.1 7.4" ${W}/><path d="M6.4 9.6C7 10.4 7.5 10.6 8 10.6S9 10.4 9.6 9.6" ${W}/>`,

};
const svg = (k, s) => `<svg viewBox="0 0 16 16" width="${s}" height="${s}" aria-hidden="true">${V[k]}</svg>`;
let h = '';
for (const dark of [false, true]) {
  h += `<div class="row${dark ? ' dark' : ''} big">` + Object.keys(V).map((k) => `<div><div class="lab">${k}</div>${svg(k, 96)}</div>`).join('') + '</div>';
  for (const k of Object.keys(V)) h += `<div class="row${dark ? ' dark' : ''}" dir="rtl"><span class="lab">${k}</span><span class="line">${svg(k, 14)}<span><span style="opacity:.7">שליח ראשי:</span> בן־ציון קארף</span></span><span class="line s16">${svg(k, 16)}<span><span style="opacity:.7">שליח ראשי:</span> מנחם מענדל הרסון</span></span><span class="line" dir="ltr">${svg(k, 14)}<span><span style="opacity:.7">Head shliach:</span> Benjy Korf</span></span></div>`;
}
document.body.innerHTML = h;
</script>
