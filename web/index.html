<script>// Hebrew (?lang=he, or picked before): the whole page right to left
try { const q = new URLSearchParams(location.search).get('lang'); if (q) localStorage.setItem('shetachim-lang', q); if ((q || localStorage.getItem('shetachim-lang')) === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; document.title = 'מפת שטחי חב״ד'; } } catch (e) {}</script>
<script>// The map's data and the street map's style, asked for at once, while the page and the map library still load.
// Every data file is checked with the site each time (an unchanged one then comes from the browser's cache, a new
// version at once: never an old map after an update). With ?v= in the address (the refresh button) all of it is
// fetched anew, and so is every other site file the page asks for (fresh()).
window.EARLY = (() => {
  const v = new URLSearchParams(location.search).get('v');
  const fresh = (url) => (v ? `${url}${url.includes('?') ? '&' : '?'}v=${encodeURIComponent(v)}` : url);
  const files = new Map();
  const bytes = (url) => {
    if (!files.has(url)) {
      const got = fetch(fresh(url), { cache: v ? 'reload' : 'no-cache' }).then((r) => {
        if (!r.ok) throw new Error(`${url} (${r.status})`);
        return r.arrayBuffer().then((buf) => ({ buf, etag: r.headers.get('etag') || r.headers.get('last-modified') || '' }));
      });
      got.catch(() => {}); // (whoever reads it hears of a failure)
      files.set(url, got);
    }
    return files.get(url);
  };
  ['data/geo.json', 'data/centers.geojson', 'data/shetachim.json', 'data/cities.json', 'data/outside-lo.json'].forEach(bytes);
  if (document.documentElement.lang === 'he') bytes('data/he.json');
  const style = fetch('https://tiles.openfreemap.org/styles/liberty').then((r) => r.json());
  style.catch(() => {});
  return { v, fresh, bytes, style };
})();
</script>

<style>
/* Layout: full-bleed map of the shetachim alone on a plain ground (or on a physical map); options card top-left (bottom sheet on phones); zoom buttons bottom-right. */
:root {
  --bg: #f1f3f0;
  --ink: #1e2b32;
  --halo: #ffffff;
  --dot: #163e74;
  --panel: #fbfcfb;
  --panel-line: #d2d9dc;
  --muted: #5a6870;
  --missing: #86939a;
  --accent: #1d4f8f;
  --accent-soft: #e3ebf5;
  --c1: #f0e1a2; --c2: #cce1b5; --c3: #efc7c1; --c4: #c5d9ee;
  --c5: #f3cfa9; --c6: #d8c8e5; --c7: #bcded6; --c8: #e1d8be;
  --plain: #fcfcfa;
  --empty: #dcdfdb; /* land with no shetach, when shown */
  --honor: #8a6a1e; --honor-line: #c39a3e; --honor-soft: #f6efdc; /* the honorary cards' gold: its text, its rules and dots, its panels */
  --mush: #b3261e; --mush-av: #f1cfcb; --tile: #eef1f3; --sub: #7b5fc4; /* the everyday cards: a mushroom's red (and its people's badge), a quiet tile, a sub-shetach's lilac */
  /* what the map draws with: the theme's colors, except on the physical map, which is always light */
  --map-ink: var(--ink); --map-halo: var(--halo); --map-dot: var(--dot); --map-accent: var(--accent); --map-missing: var(--missing); --map-secondary: #3d5f8f;
  --font-ui: "Inter", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-map: "Inter", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgb(20 35 45 / .08), 0 6px 20px rgb(20 35 45 / .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
    --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
    --map-secondary: #a8c3ea;
    --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
    --mush: #f08a7f; --mush-av: #5a2c28; --tile: #1e2b31; --sub: #b49be8;
    --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
    --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
    --plain: #223036;
  --empty: #2f383c;
    --empty: #2f383c;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1518; --ink: #e6edf0; --halo: #0f1518; --dot: #f1cf78;
  --panel: #152025; --panel-line: #2b3a41; --muted: #9baab0; --missing: #7d8c93; --accent: #93b8ec; --accent-soft: #22344a;
  --map-secondary: #a8c3ea;
  --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
  --mush: #f08a7f; --mush-av: #5a2c28; --tile: #1e2b31; --sub: #b49be8;
  --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f;
  --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
  --plain: #223036;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
.physical #map { --map-ink: #1e2b32; --map-halo: #ffffff; --map-dot: #163e74; --map-accent: #1d4f8f; --map-missing: #6b7780; --map-secondary: #3d5f8f; }

html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-ui); overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#basemap { position: absolute; inset: 0; width: 100%; height: 100%; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- the map (MapLibre): only the rules this page uses ---- */
.maplibregl-map { position: absolute; inset: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; font: 12px/18px var(--font-ui); }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas { touch-action: pan-x pan-y; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan, .maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-ctrl-top-right { position: absolute; top: 0; right: 0; z-index: 2; pointer-events: none; }
.maplibregl-ctrl { clear: both; float: right; pointer-events: auto; }
.maplibregl-ctrl-attrib { position: relative; margin: 10px; padding: 2px 8px; min-height: 20px; box-sizing: content-box;
  background: var(--panel); color: var(--muted); border: 1px solid var(--panel-line); border-radius: 12px; }
.maplibregl-ctrl-attrib a { color: inherit; }
.maplibregl-attrib-empty { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact { padding: 2px 24px 2px 0; }
.maplibregl-ctrl-attrib.maplibregl-compact-show { padding: 2px 28px 2px 8px; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-inner { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact-show .maplibregl-ctrl-attrib-inner { display: block; }
.maplibregl-ctrl-attrib-button { display: none; position: absolute; top: 0; right: 0; width: 24px; height: 24px; border-radius: 12px; cursor: pointer;
  list-style: none; appearance: none; -webkit-appearance: none;
  background: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%236b7780' fill-rule='evenodd' viewBox='0 0 20 20'%3E%3Cpath d='M4 10a6 6 0 1 0 12 0 6 6 0 1 0-12 0m5-3a1 1 0 1 0 2 0 1 1 0 1 0-2 0m0 3a1 1 0 1 1 2 0v3a1 1 0 1 1-2 0'/%3E%3C/svg%3E") center / 20px no-repeat; }
.maplibregl-ctrl-attrib-button::-webkit-details-marker { display: none; }
.maplibregl-ctrl-attrib.maplibregl-compact .maplibregl-ctrl-attrib-button { display: block; }

/* ---- search: a bar at the top of the map (owner, Oct 13: "search function for shluchim, chabad houses, etc") ---- */
#search { position: absolute; z-index: 4; top: 16px; left: 322px; width: min(380px, calc(100% - 400px)); }
#search .bar { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px 0 12px; background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 999px; box-shadow: var(--shadow); }
#search .bar:focus-within { border-color: var(--accent); }
#search .bar > svg { flex: none; width: 17px; height: 17px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
#search-q { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: inherit; font: 15px var(--font-ui); }
#search-q::-webkit-search-cancel-button { display: none; }
#search-clear { flex: none; width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
#search-clear:hover { background: var(--accent-soft); }
#search-results { margin: 6px 0 0; padding: 4px 0; list-style: none; max-height: min(60vh, 460px); overflow: auto; background: var(--panel);
  border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); }
#search-results .grp { padding: 8px 14px 2px; font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#search-results .hit { display: flex; flex-direction: column; gap: 1px; padding: 7px 14px; cursor: pointer; }
#search-results .hit[aria-selected="true"], #search-results .hit:hover { background: var(--accent-soft); }
#search-results .hit b { font-weight: 600; }
#search-results .hit span { color: var(--muted); font-size: 13px; }
#search-results .tabs { display: flex; gap: 6px; padding: 6px 10px 4px; }
#search-results .tabs button { border: 1px solid var(--panel-line); background: transparent; color: inherit; border-radius: 999px; padding: 3px 12px; font: 500 13px var(--font-ui); cursor: pointer; }
#search-results .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
#mark-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 6px 4px 12px; background: #e8590c; color: #fff; border-radius: 999px;
  box-shadow: var(--shadow); font: 500 13px var(--font-ui); max-width: 100%; }
#mark-chip[hidden] { display: none; }
#mark-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mark-chip button { flex: none; width: 22px; height: 22px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .2); color: inherit; cursor: pointer; display: grid; place-items: center; }
/* the mushroom networks (options): their lines' sign, and the list of them */
.legend-net { display: inline-block; width: 15px; border-top: 2px dashed #c0392b; vertical-align: middle; }
#net-list { list-style: none; margin: 0; padding: 0; padding-inline-start: 24px; display: flex; flex-direction: column; gap: 1px; }
#net-list[hidden] { display: none; }
#net-list button { border: 0; background: transparent; color: inherit; padding: 3px 0; font: 13.5px/1.3 var(--font-ui); cursor: pointer; text-align: start; }
#net-list button:hover { color: var(--accent); }
#net-list button[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
#net-list .n { color: var(--muted); font-size: 12.5px; }
#search-results .none { padding: 10px 14px; color: var(--muted); font-size: 14px; }
@media (max-width: 760px) {
  #search { top: 12px; left: 12px; right: 56px; width: auto; }
}

/* ---- options panel ---- */
#panel {
  position: absolute; z-index: 3; top: 16px; left: 16px; width: 290px; max-height: calc(100% - 32px); overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.p-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
.p-head h1 { margin: 0; font: 700 20px/1.1 var(--font-map); letter-spacing: -.01em; white-space: nowrap; }
.p-head .sub { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
#panel-toggle { display: none; }
.p-actions { display: flex; align-items: center; gap: 6px; flex: none; }
#theme-toggle { width: 34px; height: 34px; padding: 0; border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
#theme-toggle:hover, #lang-toggle:hover { border-color: var(--accent); }
#lang-toggle { height: 34px; min-width: 34px; padding: 0 8px; border: 1px solid var(--panel-line); background: transparent; color: inherit; border-radius: 999px; cursor: pointer; font: 500 14px var(--font-ui); }
#theme-toggle svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#panel-body { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 10px 0; border-block: 1px solid var(--panel-line); }
.stats div { min-width: 0; }
.stats dt { font: 600 10px var(--font-map); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stats dd { margin: 2px 0 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
fieldset.ctl { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
fieldset.ctl legend { padding: 0; margin-bottom: 7px; font: 600 10.5px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 4px 11px; cursor: pointer;
  font-size: 13.5px; line-height: 1.3; transition: background .15s, border-color .15s;
}
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.seg-label { align-self: center; font-size: 13px; color: var(--muted); margin-right: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #163e74; }
.legend-ring { display: inline-block; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--halo); }
.legend-star { width: 12px; height: 12px; fill: var(--ink); }
#views { margin-top: 6px; }
#views[open] > .seg { margin-top: 6px; }
#more > summary, #views > summary { cursor: pointer; font: 600 10.5px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); list-style: none; padding: 2px 0; }
#more > summary::-webkit-details-marker, #views > summary::-webkit-details-marker { display: none; }
#more > summary::after, #views > summary::after { content: '▾'; margin-inline-start: 6px; font-size: 11px; }
#more[open] > summary::after, #views[open] > summary::after { content: '▴'; }
.more-body { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.more-body .checks { display: flex; flex-direction: column; gap: 7px; }
.legend-sea { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: #a9c7f2; }
.legend-empty { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: var(--empty); border: 1px solid var(--map-ink); opacity: .7; }
.legend-rest { display: inline-block; width: 12px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, var(--empty) 42%, var(--map-ink) 42% 58%, var(--empty) 58%); border: 1px solid var(--map-ink); opacity: .7; }
.downloads { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.downloads:hover { text-decoration: underline; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.error { margin: 0; color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; }

/* ---- zoom buttons ---- */
#zoomctl { position: absolute; z-index: 3; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
#zoomctl button { width: 38px; height: 38px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
#zoomctl button + button { border-top: 1px solid var(--panel-line); }
#zoomctl button:hover { background: var(--accent-soft); }
#zoomctl svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* ---- info card ---- */
#card {
  position: absolute; z-index: 5; width: 300px; max-width: calc(100% - 32px); max-height: 60%; overflow: auto;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 14px; pointer-events: none;
}
#card.pinned { pointer-events: auto; }
/* a head shliach's shetach with its territories (Kantor: Thailand, then India): separate cards, one under the other */
#card.stack { background: transparent; border: 0; box-shadow: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#card.stack > .part { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; }
#card.pinned > ul:first-child > li:first-child, #card.pinned > .kicker:first-child { padding-inline-end: 26px; }
#card h2 { margin: 0 0 4px; margin-inline-end: 22px; font: 700 16px/1.25 var(--font-ui); text-wrap: balance; }
#card .kicker { display: block; font: 600 10px var(--font-map); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
#card .kicker-world { color: var(--accent); font-weight: 700; }
#card.world .kicker-world { font-size: 14px; letter-spacing: .06em; margin-bottom: 2px; } /* 770: "World Headquarters" in scale with its big title */
#card h2.honor-h { font-size: 30px; line-height: 1.1; margin-bottom: 6px; } /* Lubavitch and 770: a big, prominent title (owner, Oct 7) */
#card.world { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
/* the Rebbeim's other towns and the mosdos in them (owner, Nov 3: "only Lubavitch and 770 card situations should be that
   big the other prominent places should be smaller … not as small as a random capital or moised"): between the two */
#card h2.honor-m { font-size: 22px; line-height: 1.15; margin-bottom: 5px; }
#card.prominent { border-color: var(--accent); }
#card ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
#card li { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
#card li strong { font-weight: 500; }
#card .meta, #card p { color: var(--muted); font-size: 13px; margin: 0; }
#card .flag { font-size: 12.5px; font-style: italic; color: var(--muted); }
#card .alt-name { margin: -2px 0 4px; color: var(--ink); font-size: 14px; } /* a second name under the title (none now: Crown Heights's "Shchunas HaRebbe" taken out, owner, Nov 4) */
/* the Rebbe on 770's card: its leader, bigger than a shliach's line */
#card .rebbe { margin: 4px 0 2px; color: var(--ink); font: 700 18px/1.25 var(--font-map); }
#card .rebbe .role { white-space: nowrap; font-weight: 600; color: var(--muted); }
/* ---- the honorary cards: the Rebbeim's towns, their ohalim and mosdos, and 770 (owner, Nov 4: "designed nicely and
   properly not just a bunch of ugly text"). Navy and gold, like the seforim; the wording is as it was (Oct 7, Oct 26) ---- */
#card .hc-head { margin: -10px -12px 12px; padding: 13px 14px 12px; border-bottom: 1px solid var(--panel-line); background: linear-gradient(180deg, var(--honor-soft), var(--panel) 92%); }
#card.pinned .hc-head .kicker { padding-inline-end: 22px; }
#card .hc-head .kicker { color: var(--honor); font-weight: 700; margin-bottom: 3px; }
#card .hc-head h2 { margin-bottom: 0; letter-spacing: -.01em; }
#card .hc-sub { margin: 0; color: var(--muted); font: 500 13.5px/1.35 var(--font-ui); }
#card .hc-sub::before { content: ''; display: block; width: 30px; height: 2px; margin: 8px 0 7px; border-radius: 2px; background: var(--honor-line); } /* a short gold rule under the title */
#card .hc-label { margin: 0 0 10px; color: var(--muted); font: 700 10.5px/1.2 var(--font-map); letter-spacing: .09em; text-transform: uppercase; }
:root[lang="he"] #card .hc-label { font-size: 12.5px; letter-spacing: 0; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
(async function () {
  'use strict';
  const SCRIPT = document.currentScript; // (this code, for the fingerprint the names are kept under)
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d3.format(',');
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const PHONE_MQ = window.matchMedia('(max-width: 760px)');
  const phone = () => PHONE_MQ.matches;
  const coarse = () => window.matchMedia('(pointer: coarse)').matches;
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { joined: new Set(), alaska: 'box', empty: true, restBorders: false, view: 'world', base: 'political', borders: 'shetach', lighter: 'regular', color: 'colorful', labels: 'full', dots: true, dotStyle: 'solid', dotColor: 'navy', mushroomLook: 'dot', cities: true, capitals: true, sea: true };
  // a mushroom drawn as a dot or as a little mushroom (owner, Nov 3: "little tiny mushroom icons"), remembered
  try { if (localStorage.getItem('shetachim-mushroom-look') === 'icon') state.mushroomLook = 'icon'; } catch (e) { /* the dot */ }
  // the rest of the world shown (Rest of the world, or its borders, which show it too)
  const rest = () => state.empty || state.restBorders;
  if (!phone()) $('#panel').classList.remove('collapsed');

  // ---------- data ----------
  // The refresh button reloads the page as ?v=<time>: a new address no cache has (the browser's or GitHub's), and every
  // data file and map tile is asked for with the same ?v=, so all of it comes fresh from the site. (The files themselves
  // were asked for at the top of the page: EARLY.)
  const { v: BUST, fresh } = window.EARLY;
  $('#refresh').addEventListener('click', () => { location.replace(`${location.pathname}?v=${Date.now()}${location.hash}`); });
  const decoder = new TextDecoder();
  // each file's version, for the map tiles' address (tileVersion) and the names and shapes kept between visits: a
  // fingerprint of its contents (SHA-1's first 8 bytes), or its ETag where the browser can't work one out. (GitHub Pages
  // gives every file a new ETag on every update, changed or not, so whatever was kept was thrown away each time.)
  const versions = new Map();
  const contentPrint = (buf) => (window.crypto && crypto.subtle
    ? crypto.subtle.digest('SHA-1', buf).then((d) => [...new Uint8Array(d, 0, 8)].map((b) => b.toString(16).padStart(2, '0')).join(''), () => '')
    : Promise.resolve(''));
  const get = (url) => window.EARLY.bytes(url).then(({ buf, etag }) => contentPrint(buf).then((print) => { versions.set(url, print || etag); return JSON.parse(decoder.decode(buf)); }));
  // the map tiles are built with the data files: a short fingerprint of their versions ('' when the site gives none)
  function tileVersion() {
    const t = ['data/geo.json', 'data/shetachim.json'].map((f) => versions.get(f) || '').join('|');
    if (t === '|') return '';
    let h = 2166136261;
    for (let i = 0; i < t.length; i++) h = Math.imul(h ^ t.charCodeAt(i), 16777619);
    return (h >>> 0).toString(36);
  }
  let topo, centersGeo, shetachFile, cityFile;
  try {
    [topo, centersGeo, shetachFile, cityFile] = await Promise.all([get('data/geo.json'), get('data/centers.geojson'), get('data/shetachim.json'), get('data/cities.json').catch(() => [])]);
  } catch (err) {
    $('#panel').classList.remove('collapsed');
    $('#load-error').hidden = false;
    $('#load-error').textContent = document.documentElement.lang === 'he' ? `נתוני המפה לא נטענו (${err.message}). נסו לטעון את הדף מחדש.` : `The map data didn't load (${err.message}). Reload the page to try again.`;
    return;
  }
  // Mushrooms (owner, Oct 12): centers outside the country's official Chabad (extra-centers.json "mushroom") are left
  // off unless the Mushrooms option is on (remembered). The data is kept whole and the map's centers are worked out
  // from it either way (useCenters), so switching is instant (owner, Oct 26: it used to reload the page).
  let mushroomsOn = false;

  // ---------- views and options on the map ----------

  // how far out and in the map may zoom (the political map only so far in), and whether it repeats sideways (a flat

  function limits() {

    const regional = V.view !== VIEWS.world;

  // A new view: its data into the map, framed.

  // What each of the map's sources holds: [set, what]. A source is handed data only when that changes (the map copies

    const street = !political(), kinds = isPhysical() && physicalOK ? [] : [...(street ? [] : ['coast', 'edge']),

  const pageAct = (c) => { const p = pageOf(c); return p ? `<a class="cc-act" href="${p.href}" target="_blank" rel="noopener" title="${p.label}">${icon('ext')}<span class="lab">${p.label.replace(/^(Open on |לעמוד ב-|לדף ב)/, '')}</span></a>` : ''; };
  // the same as a small button: a center's page in its header, a mushroom's "Show network" in its network's box (the
  // bar along the foot is gone: owner, Nov 5)
  // (owner, Nov 6: an icon, not a "chabad.org" pill; the name of the site is in its tooltip)
  const pageChip = (c) => { const p = pageOf(c); return p ? `<a class="cc-chip cc-icon" href="${p.href}" target="_blank" rel="noopener" title="${p.label}" aria-label="${p.label}">${icon('ext')}</a>` : ''; };
  const netPill = (c) => { const n = c.mushroom && c.network && networks().get(c.network);
    return n ? `<button type="button" class="cc-chip mush net-show" data-net="${esc(c.network)}" aria-pressed="${netPinned === n}"><span class="dash"></span><span class="lab">${netButton(n)}</span></button>` : ''; };
  const pageGo = (c) => { const p = pageOf(c); return p ? `<a class="cc-go" href="${p.href}" target="_blank" rel="noopener" title="${p.label}" aria-label="${p.label}">${icon('ext')}</a>` : ''; };
  const zoomAct = (attrs) => `<button type="button" class="cc-act zoomto" ${attrs}>${icon('zoom')}<span class="lab">${tr('Zoom in')}</span></button>`;
  const netAct = (c) => { const n = c.mushroom && c.network && networks().get(c.network);
    return n ? `<button type="button" class="cc-act mush net-show" data-net="${esc(c.network)}" aria-pressed="${netPinned === n}"><span class="dash"></span><span class="lab">${netButton(n)}</span></button>` : ''; };
  const netBox = (c) => { const n = networks().get(c.network), name = HE ? c.networkHe || c.network : c.network;

  const ccTile = (n, one, many, heOne, heMany, cls = '') => `<div class="cc-tile${cls ? ` ${cls}` : ''}"><b>${fmt(n)}</b><span>${HE ? (n === 1 ? heOne : heMany) : n === 1 ? one : many}</span></div>`;
  const CNT = () => document.documentElement.dataset.cnt || 'line';
  const DOTMARK = '<svg class="ic dot" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.4" fill="currentColor" stroke="var(--panel)" stroke-width="1.6"/></svg>';
  const countLine = (n, m) => { const c = n - m;
    return `<div class="cc-flagrow cc-countrow">${DOTMARK}<span><b>${fmt(c)}</b> ${HE ? (c === 1 ? 'מוסד' : 'מוסדות') : c === 1 ? 'center' : 'centers'}</span>${m ? `<span class="cc-gap"></span>${icon('mush')}<span><b class="mu">${fmt(m)}</b> ${HE ? (m === 1 ? 'פטרייה' : 'פטריות') : m === 1 ? 'mushroom' : 'mushrooms'}</span>` : ''}</div>`; };
  const PIN = '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6a4.6 4.6 0 0 0-4.6 4.6c0 3.5 4.6 8.3 4.6 8.3s4.6-4.8 4.6-8.3A4.6 4.6 0 0 0 8 1.6zm0 6.3a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4z" fill="currentColor"/></svg>';
  const countText = (n, m) => { const c = n - m;
    return `<b>${fmt(c)}</b> ${HE ? (c === 1 ? 'מוסד' : 'מוסדות') : c === 1 ? 'center' : 'centers'}${m ? `<span class="cc-dot">·</span><b class="mu">${fmt(m)}</b> ${HE ? (m === 1 ? 'פטרייה' : 'פטריות') : m === 1 ? 'mushroom' : 'mushrooms'}` : ''}`; };
  const headCount = (n, m) => (CNT() === 'head' ? `<span class="cc-count">${countText(n, m)}</span>` : '');
  const zoomCount = (n, m) => (CNT() === 'zoom' ? `<span class="cc-dot">·</span>${countText(n, m)}` : '');
  const ccTiles = (n, m) => CNT() === 'line' ? countLine(n, m) : CNT() !== 'box' ? '' : `<div class="cc-tiles">${ccTile(n - m, 'center', 'centers', 'מוסד', 'מוסדות')}${m ? ccTile(m, 'mushroom', 'mushrooms', 'פטרייה', 'פטריות', 'mush') : ''}</div>`;
  // A shetach's flagship center; 770 (world HQ) gets its own wording rather than "of New York City".
  const capKicker = (c) => (c.world ? tr('World Headquarters') : (HE ? `המוסד המרכזי של ${esc(c.s.name)}` : `${esc(c.s.name)} flagship center`) + (c.for ? ` · ${esc(c.for)}` : ''));

  // Who's listed at a center (chabad.org's own listing, or ours for unlisted centers). The owner's rule: the shliach shown
  // is the first man listed who's alive (a woman listed first, or a man who has passed away, is passed over). With no
  // living man: where a man listed has passed away (her husband), "<last name> family" from the living woman; where
  // only women are listed (a mikvah Mrs. Axelrod runs), the first woman by name. Everyone else alive goes under "+more"; anyone who has passed
  // away in a "Deceased" section, each with obm / ע״ה after the name. Men and women are told apart by title (Mrs., Ms., Miss, Rebbetzin = women).
  const FEMALE = /^(mrs|ms|miss|rebbetzin|rebbitzen|mme|madame|sra|frau)\.?$/i;
  const isMale = (p) => !FEMALE.test((p.title || '').trim());
  // a person's name and position in the page's language (Hebrew: first names word by word, the last name whole; a
  // position has a man's and a woman's form where Hebrew needs them)
  const heFirst = (n) => (n || '').trim().split(/\s+/).filter(Boolean).map((w) => (heData && heData.first && heData.first[w]) || w).join(' ');
  const heLast = (n) => (heData && heData.last && heData.last[(n || '').trim()]) || n;
  const firstOf = (p) => (HE ? heFirst(p.firstName) : p.firstName);
  const lastOf = (p) => (HE ? heLast(p.lastName) : p.lastName);
  const positionOf = (p) => {
    if (p.role) return HE ? p.role[1] : p.role[0]; // (a role given on the page, both languages: the ohalim's caretakers)
    const pos = (p.position || '').trim();
    if (!HE || !pos) return pos;

  // shluchim murdered al kiddush Hashem (hyd, data/extra-centers.json): HY"D / הי״ד instead
  const personName = (p) => `${[firstOf(p), lastOf(p)].filter(Boolean).join(' ')}${p.isDeceased ? (p.hyd ? (HE ? ' הי״ד' : ' HY"D') : HE ? ' ע״ה' : ' obm') : ''}`;
  // The center in Lubavitch (opened 2008 near the Rebbeim's graves; not on chabad.org's locator, so given here), shown
  // on Lubavitch's card as a center of its own, under a divider
  const LUBAVITCH_CENTER_PEOPLE = [{ title: 'Rabbi', firstName: 'Gavriel', lastName: 'Gordon', position: 'Director', isDirector: true, isDeceased: false }];
  const personLine = (p) => { const pos = positionOf(p); return `${esc(personName(p))}${pos ? ` <span class="meta">· ${esc(pos)}</span>` : ''}`; };
  // 770, Chabad Lubavitch Headquarters: the Rebbe as its leader, first and bigger than any shliach's line (owner,
  // Oct 13: "the Rebbe as the leader … def bigger than other shluchim", not in a box of his own)
  const WORLD_HQ = '117678';
  const rebbeHTML = (c) => (c && c.id === WORLD_HQ ? `<p class="rebbe"><span class="role">${HE ? 'נשיא הדור:' : 'Leader:'}</span> ${HE ? 'כ״ק אדמו״ר נשיא דורנו זצוקללה״ה נבג״מ זי״ע' : 'The Lubavitcher Rebbe, zy"a'}</p>` : '');
  function personnelHTML(list) {
    if (!list || !list.length) return '';
    const living = list.filter((p) => !p.isDeceased), passed = list.filter((p) => p.isDeceased);
    const primary = living.find(isMale);
    const woman = !primary && living.find((p) => !isMale(p) && p.lastName);
    const widowed = woman && passed.some(isMale);
    const head = primary ? personLine(primary) : widowed ? esc(HE ? `משפחת ${lastOf(woman)}` : `${woman.lastName} family`) : woman ? personLine(woman) : '';
    const others = living.filter((p) => p !== primary && !(woman && !widowed && p === woman)); // under "<name> family" she's still listed
    const more = others.length
      ? `<details class="personnel"><summary>+${others.length} ${HE ? 'נוספים' : 'more'}</summary>${others.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    const obmList = passed.filter((p) => !p.hyd); // (the kedoshim are at the top of the center, in memorialHTML)
    const obm = obmList.length
      ? `<details class="personnel"><summary>${HE ? 'נפטרו' : 'Deceased'} (${obmList.length})</summary>${obmList.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    return `${head ? `<p class="person">${head}</p>` : ''}${more}${obm}`;
  }

  // A center's shluchim murdered al kiddush Hashem, at the top of its entry (owner, Oct 10: "prominently featured on
  // their center"), with their titles: "Rabbi Gavriel Holtzberg HY"D" / "הרב גבריאל הולצברג הי״ד"
  const HE_TITLE = { rabbi: 'הרב', 'mrs.': 'הרבנית', rebbetzin: 'הרבנית' };
  function memorialHTML(c) {
    const kedoshim = (c && c.personnel || []).filter((p) => p.hyd);
    if (!kedoshim.length) return '';
    const title = (p) => (HE ? HE_TITLE[(p.title || '').trim().toLowerCase()] : p.title) || '';
    const names = kedoshim.map((p) => `<div class="mem-name">${esc([title(p), personName(p)].filter(Boolean).join(' '))}</div>`).join('');
    const note = c.memorial && (HE ? c.memorial.he : c.memorial.en);
    return `<div class="memorial">${names}${note ? `<div class="mem-note">${esc(note)}</div>` : ''}</div>`;
  }

  // A center's card: the header in its shetach's colour with the small map (a mushroom's red, its area grey), the
  // shetach and its head above the name (a mushroom's area only: it isn't under the shetach's head, owner, Oct 12; a
  // flagship's star badge instead, its shetach under its people), what it is and where; its network (a mushroom's),
  // its people; the bar of actions. Several at one address: the address in the header, a row each.
  const mushKick = (c) => `<p class="cc-kick mush">${icon('mush')}${tr('Mushroom')}${c.networkFlagship && networks().has(c.network) ? ` · ${HE ? 'המוסד המרכזי של הרשת' : 'Network flagship'}` : ''}</p>`;

  // The Rebbeim who led from Lubavitch, on its card (owner, Oct 13): the Mitteler Rebbe came in 1813, the Rebbe Rashab
  // left in 1915; the Tzemach Tzedek and the Rebbe Maharash are buried there (their own list on the card, owner, Oct 26)
  const LUBAVITCH_REBBEIM = [
    ['The Mitteler Rebbe', 'Rabbi DovBer', 'כ״ק אדמו״ר האמצעי', 'רבי דובער', '1813–1827', 'תקע״ג–תקפ״ח'],
    ['The Tzemach Tzedek', 'Rabbi Menachem Mendel', 'כ״ק אדמו״ר הצמח צדק', 'רבי מנחם מענדל', '1827–1866', 'תקפ״ח–תרכ״ו', ['13 Nissan 5626 (1866)', 'י״ג ניסן תרכ״ו']],
    ['The Rebbe Maharash', 'Rabbi Shmuel', 'כ״ק אדמו״ר מהר״ש', 'רבי שמואל', '1866–1882', 'תרכ״ו–תרמ״ג', ['13 Tishrei 5643 (1882)', 'י״ג תשרי תרמ״ג']],
    ['The Rebbe Rashab', 'Rabbi Sholom DovBer', 'כ״ק אדמו״ר הרש״ב', 'רבי שלום דובער', '1882–1915', 'תרמ״ג–תרע״ה'],
  ];
  // The other towns of the Rebbeim (owner, Oct 26), each a big card like Lubavitch's: the Rebbe Rashab came to Rostov in
  // 1915 and passed away there in 1920 (his ohel is there); the Frierdiker Rebbe led from Rostov until 1924. The Alter
  // Rebbe was born in Liozna (1745) and led from there until he moved to Liadi in 1801; he left Liadi in 1812, fleeing

  const ALTER_REBBE = ['The Alter Rebbe', 'Rabbi Schneur Zalman', 'כ״ק אדמו״ר הזקן', 'רבי שניאור זלמן'];
  // A Rebbe resting in the town: under his own name in the list, with his yahrzeit (the 7th field; owner, Oct 26: not a

  // respect — in Hebrew ציון / ציוני (Chabad's word; not מקום מנוחתו, owner, Oct 26)
  const HADITCH_BURIAL = { burial: ['Burial place of the Alter Rebbe, Rabbi Schneur Zalman of Liadi, zy"a', 'ציון כ״ק אדמו״ר הזקן, רבי שניאור זלמן מליאדי, זי״ע'], yahrzeit: ['Histalkus: 24 Teves 5573 (1812)', 'הסתלקות: כ״ד טבת תקע״ג'], portraits: ['alter-rebbe'] };
  const NEZHIN_BURIAL = { burial: ['Burial place of the Mitteler Rebbe, Rabbi DovBer, zy"a', 'ציון כ״ק אדמו״ר האמצעי, רבי דובער, זי״ע'], yahrzeit: ['Histalkus: 9 Kislev 5588 (1827)', 'הסתלקות: ט׳ כסלו תקפ״ח'], portraits: ['mitteler-rebbe'] };
  const HONOR_CARDS = {
    // the towns
    lubavitch: { seat: ['Seat of the Rebbeim, 1813–1915', 'מקום מושב הרביים, תקע״ג–תרע״ה'], title: ['Rebbeim in Lubavitch', 'נשיאי חב״ד בליובאוויטש'], rebbeim: LUBAVITCH_REBBEIM },

      ['The Rebbe Rashab', 'Rabbi Sholom DovBer', 'כ״ק אדמו״ר הרש״ב', 'רבי שלום דובער', '1915–1920', 'תרע״ו–תר״פ', ['2 Nissan 5680 (1920)', 'ב׳ ניסן תר״פ']],
      ['The Frierdiker Rebbe', 'Rabbi Yosef Yitzchak', 'כ״ק אדמו״ר הריי״צ', 'רבי יוסף יצחק', '1920–1924', 'תר״פ–תרפ״ד'],
    ] },

      [...ALTER_REBBE, 'until 1801', 'עד תקס״א'],

    liadi: { seat: ['Seat of the Alter Rebbe, 1801–1812', 'מקום מושב אדמו״ר הזקן, תקס״א–תקע״ב'], title: ['Rebbe in Liadi', 'נשיא חב״ד בליאדי'], rebbeim: [
      [...ALTER_REBBE, '1801–1812', 'תקס״א–תקע״ב'],
    ] },
    haditch: HADITCH_BURIAL,
    nezhin: NEZHIN_BURIAL,
    // the mosdos in them
    'lubavitch-ohel': { portraits: ['tzemach-tzedek', 'rebbe-maharash'], burial: ['Burial place of the Tzemach Tzedek, Rabbi Menachem Mendel, zy"a, and the Rebbe Maharash, Rabbi Shmuel, zy"a', 'ציוני כ״ק אדמו״ר הצמח צדק, רבי מנחם מענדל, זי״ע, וכ״ק אדמו״ר מהר״ש, רבי שמואל, זי״ע'],
      yahrzeit: ['Histalkus: 13 Nissan 5626 (1866) · 13 Tishrei 5643 (1882)', 'הסתלקות: י״ג ניסן תרכ״ו · י״ג תשרי תרמ״ג'] },
    // (the center in Lubavitch, opened 2008, not on chabad.org's locator: its wording is the owner's, Oct 7; ask him before
    // changing it)
    'lubavitch-chatzer': { place: ['Heritage center · Lubavitch', 'מרכז מורשת · ליובאוויטש'], people: LUBAVITCH_CENTER_PEOPLE },
    // (chabad.org, June 17 2026: "Rabbi Danziger is responsible for maintaining the Rebbe Rashab's resting place")
    'rostov-ohel': { portraits: ['rebbe-rashab'], burial: ['Burial place of the Rebbe Rashab, Rabbi Sholom DovBer, zy"a', 'ציון כ״ק אדמו״ר הרש״ב, רבי שלום דובער, זי״ע'], yahrzeit: ['Histalkus: 2 Nissan 5680 (1920)', 'הסתלקות: ב׳ ניסן תר״פ'],
      people: [{ title: 'Rabbi', firstName: 'Chaim', lastName: 'Danzinger', role: ["In charge of the Rebbe Rashab's Ohel", 'אחראי על אוהל אדמו״ר הרש״ב'], isDirector: true, isDeceased: false }] },
    // (Rabbi Deitsch, "השליח והאחראי על המקומות הקדושים בהאדיטש ובניעז'ין": JDN, Dec 4 2022; chabad.org lists him at the
    // Heichel without a position)
    'haditch-ohel': { ...HADITCH_BURIAL, roles: { Deutsh: ['In charge of the Heichal', 'אחראי על ההיכל'] } },
    'nezhin-ohel': { ...NEZHIN_BURIAL, people: [{ title: 'Rabbi', firstName: 'Shneor Zalman', lastName: 'Deutsh', role: ['In charge of the Ohel', 'אחראי על האוהל'], isDirector: true, isDeceased: false }] },
    // (the Rebbe with his whole title, as on 770's card; owner, Oct 26)
    ohel: { portraits: ['frierdiker-rebbe', 'the-rebbe'], burial: ['Burial place of the Frierdiker Rebbe, zy"a, and the Lubavitcher Rebbe, zy"a', 'ציוני כ״ק אדמו״ר הריי״צ זי״ע וכ״ק אדמו״ר נשיא דורנו זצוקללה״ה נבג״מ זי״ע'], yahrzeit: ['Histalkus: 10 Shevat 5710 (1950) · 3 Tammuz 5754 (1994)', 'הסתלקות: י׳ שבט תש״י · ג׳ תמוז תשנ״ד'] },

  // The honorary cards, designed (owner, Nov 4: "designed nicely and properly not just a bunch of ugly text"): a header
  // (the town above a mosad's name, the title, its seat or place under it), the Rebbeim as a timeline (each Rebbe's years

  // panel of its own (still one line, with its histalkus under it, not small print), and the place's own people set
  // apart under a hairline, smaller than the Rebbeim's lines. The wording is as it was (owner, Oct 7 and Oct 26).
  const honorHead = (c, honor, town) => `<header class="hc-head">${town ? `<span class="kicker">${esc(town.name)}</span>` : ''}
    <h2 class="${c.honor === 'lubavitch' ? 'honor-h' : 'honor-m'}">${esc(c.title || (c.center && c.center.name) || c.name)}</h2>${
    honor.seat ? `<p class="hc-sub">${esc(HE ? honor.seat[1] : honor.seat[0])}</p>` : ''}${honor.place ? `<p class="hc-sub">${esc(HE ? honor.place[1] : honor.place[0])}</p>` : ''}</header>`;
  // The Rebbeim's portraits (web/img/rebbeim/<key>.jpg; sources in data/rebbeim-portraits.json): the Alter Rebbe's and the

    if (!q) { showResults(''); return; }
    const words = q.split(' ');
    // a name that starts with what's typed first, then a word in it that does, then anywhere
    const score = (t) => (t.startsWith(q) ? 0 : t.includes(` ${words[0]}`) ? 1 : 2);
    const index = buildSearch();
    const found = index.filter((it) => it.text && words.every((w) => it.text.includes(w)));
    let html = '';
    for (const [kind, max, en, he] of GROUPS) {
      const list = found.filter((it) => it.kind === kind).sort((a, b) => score(a.text) - score(b.text) || a.text.localeCompare(b.text)).slice(0, max);
      if (!list.length) continue;
      html += `<li class="grp" role="presentation">${HE ? he : en}</li>`;
      for (const it of list) {
        const [title, sub] = it.kind === 'shetach' ? [it.s.name, [it.s.altName || '', it.s.vaad && it.s.vaadFirst ? it.s.vaad : '', it.s.headShliach ? `${tr('Head shliach')}: ${it.s.headShliach}` : ''].filter(Boolean).join(' · ')]
          : it.kind === 'person' ? [personName(it.p), [it.c.name, it.c.city].filter(Boolean).join(' · ')]
          : it.kind === 'center' ? [it.c.name, [it.c.type, it.c.city].filter(Boolean).join(' · ')]
          : [it.city.name, counts(it.city.centers, mushroomsOn ? it.city.mushrooms || 0 : 0)];
        html += `<li class="hit" role="option" id="sr-${searchHits.length}" data-i="${searchHits.length}" aria-selected="false"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</li>`;
        searchHits.push(it);
      }
    }
    showResults(html || `<li class="none">${HE ? 'לא נמצא' : 'Nothing found'}</li>`);
  }
  // The dropdown: two tabs on top (everything, or last names), then the results.
  function showResults(html) {
    const tab = (m, en, he) => `<button type="button" role="tab" data-mode="${m}" aria-selected="${searchMode === m}">${HE ? he : en}</button>`;
    sres.innerHTML = `<li class="tabs" role="presentation">${tab('all', 'All', 'הכל')}${tab('last', 'Last name', 'שם משפחה')}</li>${html}`;
    sres.hidden = false;
    sq.setAttribute('aria-expanded', 'true');
  }
  // Last name (owner, Oct 13): "a separate place … search, click the last name, then it shows on the map highlighted all
  // those ones". Each last name of someone who runs a center (a living director, or the shliach the card shows), with
  // how many houses; a pick rings every one of them on the map.
  function lastNameResults(q) {
    buildSearch();
    if (!q) { showResults(`<li class="none">${HE ? 'הקלידו שם משפחה' : 'Type a last name'}</li>`); return; }
    const list = searchFamilies.filter((f) => f.text.split(' ').some((w) => w.startsWith(q)))
      .sort((a, b) => (fold(a.en).startsWith(q) || fold(a.he).startsWith(q) ? 0 : 1) - (fold(b.en).startsWith(q) || fold(b.he).startsWith(q) ? 0 : 1) || b.centers.size - a.centers.size)
      .slice(0, 30);
    let html = '';
    for (const f of list) {
      const n = f.centers.size;
      html += `<li class="hit" role="option" id="sr-${searchHits.length}" data-i="${searchHits.length}" aria-selected="false"><b>${esc(HE && f.he ? f.he : f.en)}</b><span>${HE ? (n === 1 ? 'בית חב״ד אחד' : `${n} בתי חב״ד`) : `${n} Chabad ${n === 1 ? 'house' : 'houses'}`}</span></li>`;
      searchHits.push({ kind: 'family', f });
    }
    showResults(html || `<li class="none">${HE ? 'לא נמצא' : 'Nothing found'}</li>`);
  }
  // Ring a family's houses on the map, and frame them (switching to World if the view doesn't have them all).
  function markFamily(f) {
    marked = f;
    netPinned = null; // (the chip: this family now, not a network)
    closeSearch();
    sq.blur();
    hideCard();
    const ds = [...f.dots];
    if (!ds.every((d) => V.mainIds.has(d.piece))) { pressed('view', 'world'); state.view = 'world'; showView(false); }
    showMark();
    paintNet();
    netListUI();
    $('#mark-chip-text').textContent = HE ? `${f.centers.size} בתי חב״ד בניהול ${f.he || f.en}` : `${f.centers.size} Chabad ${f.centers.size === 1 ? 'house' : 'houses'} run by ${f.en}`;
    $('#mark-chip').hidden = false;
    frameDots(ds);
  }
  // frame a set of dots (in the view as it's drawn now); on a phone with the card left open, above it (a desktop's card
  // is left where it is: framing beside it squeezed a world-wide network into world copies)
  function frameDots(ds, besideCard) {
    if (!glOK) return;
    const pts = ds.map((d) => within(V.cur, () => P(d.lon, d.lat))).filter(Boolean);
    if (!pts.length) return;
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const pad = 0.02, padding = framePadding();
    if (besideCard && phone()) {
      const c = card.getBoundingClientRect(), app = $('#app').getBoundingClientRect();
      padding.bottom = Math.max(padding.bottom, app.bottom - c.top + 12);
      if (app.height - padding.top - padding.bottom < 120) Object.assign(padding, framePadding()); // (no room above it: as usual)
    }
    map.fitBounds([[Math.min(...xs) - pad, Math.min(...ys) - pad], [Math.max(...xs) + pad, Math.max(...ys) + pad]], { padding, duration: still ? 0 : 1200, maxZoom: 11 });
  }
  function showMark() {
    if (!glOK) return;
    for (const T of [V.M, V.F]) {
      if (!T || !map.getSource(`mark${T.sfx}`)) continue;
      const ds = marked && T === V.cur ? [...marked.dots].filter((d) => V.mainIds.has(d.piece)) : [];
      map.getSource(`mark${T.sfx}`).setData({ type: 'FeatureCollection', features: ds.map((d) => feature({ type: 'Point', coordinates: within(T, () => P(d.lon, d.lat)) }, { l: Math.log2(d.centers.length), m: d.centers.every((c) => c.mushroom) ? 1 : 0 })) });
    }
  }
  function clearMark() { marked = null; $('#mark-chip').hidden = true; showMark(); if (netPinned) { netPinned = null; paintNet(); syncNet(); } }
  function selectHit(i) {
    searchSel = i;
    sres.querySelectorAll('.hit').forEach((el) => el.setAttribute('aria-selected', String(+el.dataset.i === i)));
    const el = sres.querySelector(`[data-i="${i}"]`);
    if (el) { el.scrollIntoView({ block: 'nearest' }); sq.setAttribute('aria-activedescendant', el.id); }
  }
  function closeSearch() { sres.hidden = true; sq.setAttribute('aria-expanded', 'false'); }
  function goToHit(it) {
    if (it.kind === 'family') { markFamily(it.f); return; }
    closeSearch();
    sq.blur();
    const shown = it.kind === 'shetach' ? V.main.some((g) => g.properties.shetach === it.s.id) : V.mainIds.has(it.d ? it.d.piece : it.city.piece);
    if (!shown) { pressed('view', 'world'); state.view = 'world'; hideCard(); showView(false); }
    if (!glOK) return;
    const r = map.getContainer().getBoundingClientRect();
    if (it.kind === 'shetach') {
      pinned = { shetach: it.s };
      showCard(pinned, { clientX: r.left + r.width / 2, clientY: r.top + r.height / 3 }, true);
      zoomTo(shetachArea(V.cur, it.s));
      return;
    }
    const [lon, lat] = it.d ? [it.d.lon, it.d.lat] : [it.city.lon, it.city.lat];
    const at = within(V.cur, () => P(lon, lat));
    if (!at) return;
    const honorary = it.d && it.d.centers.every((c) => HONOR_BY_CENTER.has(c.id)) && HONOR_BY_CENTER.get(it.d.centers[0].id);
    const hit = honorary ? { capital: honorary } : it.d ? { dot: it.d, focus: it.c && it.c.id } : { city: it.city };
    hideCard();
    // (a mosad of the Rebbeim's — the Heichel in Haditch: close enough for its own marker, apart from its town's; the
    // map checks a marker's zoom filter at whole zooms only, hence the ceil)
    const zoom = Math.max(Math.min(14, Math.max(map.getZoom(), (V.cur.zFit ?? 2) + (it.city ? 5 : 7))),
      honorary && honorary.kind === 'mosad' ? Math.ceil(within(V.cur, () => zoomFor(honorary.kmPx, lon, lat))) + 0.25 : 0);
    map.flyTo({ center: at, zoom, duration: still ? 0 : 1400 });
    map.once('moveend', () => {
      if (hit.city && !CITY_CARDS) return; // (a city: just there, no card)
      const pt = map.project(at);
      pinned = hit;
      showCard(hit, { clientX: r.left + pt.x, clientY: r.top + pt.y }, true);
    });
  }
  sq.addEventListener('input', runSearch);
  sq.addEventListener('focus', runSearch);
  sq.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (searchHits.length) selectHit((searchSel + (e.key === 'ArrowDown' ? 1 : searchHits.length - 1) + (searchSel < 0 && e.key === 'ArrowUp' ? 1 : 0)) % searchHits.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (searchHits.length) goToHit(searchHits[Math.max(0, searchSel)]);
    } else if (e.key === 'Escape') { e.stopPropagation(); closeSearch(); sq.blur(); }
  });
  sres.addEventListener('pointerdown', (e) => e.preventDefault()); // (keeps the field focused until the pick is made)
  sres.addEventListener('click', (e) => {
    const t = e.target.closest('[data-mode]');
    if (t) {
      searchMode = t.dataset.mode;
      sq.placeholder = searchMode === 'last' ? (HE ? 'שם משפחה…' : 'Last name…') : '';
      if (searchMode !== 'last') searchWords();
      runSearch();
      sq.focus();
      return;
    }
    const el = e.target.closest('.hit');
    if (el) goToHit(searchHits[+el.dataset.i]);
  });
  $('#mark-chip-x').addEventListener('click', clearMark);
  sclear.addEventListener('click', () => { sq.value = ''; runSearch(); sq.focus(); });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#search')) closeSearch(); });

  function wireTaps() {
    map.on('click', (e) => {
      const touch = e.originalEvent.pointerType === 'touch' || coarse();
      const hit = pickAt(e.point, touch);
      if (!hit) { hideCard(); return; }
      pinned = hit;
      showCard(hit, e.originalEvent, true);
    });
    map.on('movestart', (e) => { if (e.originalEvent && !pinned) hideCard(); });
  }
  wireTaps();
  showView(false);
  try {
    const r = JSON.parse(sessionStorage.getItem(RESUME) || 'null');
    sessionStorage.removeItem(RESUME);
    if (r && Date.now() - r.t < 60 * 60e3) resume(r);
  } catch (e) { /* a fresh start */ }
  // the credits start folded on a phone (an (i) to open them), as map sites do
  if (phone()) { const at = document.querySelector('.maplibregl-ctrl-attrib'); if (at) at.classList.remove('maplibregl-compact-show'); }
  // ready: for tests and anyone curious
  window.__map = map;
  window.__dbg = { keptCount: () => keptRead, capitals: () => capitals, map: () => map, showCard: (hit) => showCard(hit, { clientX: 400, clientY: 300 }, true), labelData, V: () => V, dotData, spotsFor, partsOf, polylabel, unlon, unlat, PX, setMode, centreLL, spanKm,
    zoomTo: (st) => zoomToArea(pieces.find((g) => g.properties.state === st).properties.id),
    at: (lon, lat) => map.jumpTo({ center: within(V.cur, () => P(lon, lat)) }),
    // tap: what a tap at a place lands on, its card shown (the hit's kind returned)
    tap: (lon, lat) => { const p = map.project(within(V.cur, () => P(lon, lat))), hit = pickAt(p, false); if (hit) showCard(hit, { clientX: p.x, clientY: p.y }, true); return hit && Object.keys(hit)[0]; },
    go: (lon, lat, z) => { V.cur = V.M; limits(); apply(); map.jumpTo({ center: [lon, lat], zoom: z }); }, // go: a standard place and zoom (the map then picks flat or standard)
    // settled: nothing left to work out or hand over for the map shown, its names included, and the map has drawn it
    settled: () => { const n = FED.get(`names${V.cur.sfx}`); return !WAITING.length && !!V.cur.fedAll && map.loaded() && (state.labels === 'off' || (!!n && n[0] === V.cur && n[1] === `names|${labelKey()}`)); } };
  document.documentElement.dataset.ready = '1';
})();
</script>
