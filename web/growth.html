<style>
:root {

  --dot: #163e74; --dot-halo: rgb(255 255 255 / .9); --pop: #d29b2a; --star: #c8952a; --star-edge: #6b4a0f;
  --panel: rgb(251 252 251 / .94); --panel-line: #d2d9dc; --accent: #1d4f8f; --accent-soft: #e3ebf5;

}

    --bg: #0b1114; --land: #1b2428; --land-edge: #34444b; --line: rgb(200 220 228 / .30); --state-line: rgb(200 220 228 / .20);
    --reached: #1e3142; --reached-new: #31587c; --ink: #e6edf0; --halo: #0b1114; --muted: #96a6ad;
    --dot: #f1cf78; --dot-halo: rgb(11 17 20 / .85); --pop: #ffe7a3; --star: #fff8e6; --star-edge: #b8892a;
    --panel: rgb(21 32 37 / .94); --panel-line: #2b3a41; --accent: #93b8ec; --accent-soft: #22344a;
    --bar-past: #f1cf78; --bar-future: #33434a; --chip: #2c2716; --chip-ink: #f3dc9a; --chip-line: #5a4a1e;
    --tile: #1e2b31; --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
    --pick-fill: rgb(147 184 236 / .13); --name-ink: rgb(230 237 240 / .88);
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1114; --land: #1b2428; --land-edge: #34444b; --line: rgb(200 220 228 / .30); --state-line: rgb(200 220 228 / .20);
  --reached: #1e3142; --reached-new: #31587c; --ink: #e6edf0; --halo: #0b1114; --muted: #96a6ad;
  --dot: #f1cf78; --dot-halo: rgb(11 17 20 / .85); --pop: #ffe7a3; --star: #fff8e6; --star-edge: #b8892a;
  --panel: rgb(21 32 37 / .94); --panel-line: #2b3a41; --accent: #93b8ec; --accent-soft: #22344a;
  --bar-past: #f1cf78; --bar-future: #33434a; --chip: #2c2716; --chip-ink: #f3dc9a; --chip-line: #5a4a1e;
  --tile: #1e2b31; --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
  --pick-fill: rgb(147 184 236 / .13); --name-ink: rgb(230 237 240 / .88);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#gl { position: absolute; inset: 0; background: var(--bg); }
#app.streets #stage { display: none; }
#app:not(.streets) #gl { display: none; }
.maplibregl-ctrl-bottom-right { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 76px) !important; }
.maplibregl-ctrl-attrib.maplibregl-compact { font-size: 10px; }
#gl .maplibregl-ctrl.maplibregl-ctrl-attrib { background: var(--panel); color: var(--muted); }
#gl .maplibregl-ctrl-attrib a { color: var(--muted); }
#gl.gl-dark .maplibregl-ctrl-attrib-button { filter: invert(1); background-color: transparent; }
/* on the street map the year sits on a frosted plate (the map's own names run under it) */
#app.streets .plate { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 10px 16px 9px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#app.streets .year, #app.streets .count { text-shadow: none; }

.head { position: absolute; top: max(12px, env(safe-area-inset-top)); inset-inline-start: 16px; pointer-events: none; z-index: 3; }
.year { font: 800 58px/0.95 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink);
  text-shadow: 0 0 10px var(--bg), 0 0 4px var(--bg); unicode-bidi: isolate; }
.year[dir="rtl"] { letter-spacing: 0; }
.count { margin-top: 6px; font: 600 14px/1.3 var(--font); color: var(--muted); text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 750; }
.firsts { margin-top: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.first { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 13px; background: var(--chip); color: var(--chip-ink);
  border: 1px solid var(--chip-line); font: 650 12.5px/1.2 var(--font); box-shadow: var(--shadow); animation: firstIn .45s cubic-bezier(.2, .8, .2, 1) both; }
.first.out { animation: firstOut .5s ease forwards; }
.first svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
@keyframes firstIn { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes firstOut { to { opacity: 0; transform: translateY(-4px); } }

.tools { position: absolute; z-index: 6; top: max(12px, env(safe-area-inset-top)); inset-inline-end: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.row { display: flex; gap: 6px; }
/* settings behind the gear, as on the history page */
.menu { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px; font: 600 13px var(--font); color: var(--ink); cursor: pointer; }
.opt input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 36px; height: 21px; margin: 0; border-radius: 11px; background: var(--panel-line); cursor: pointer; transition: background .2s; }
.opt input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .2s; }
.opt input:checked { background: var(--accent); }
.opt input:checked::before { transform: translateX(15px); }
[dir="rtl"] .opt input::before { left: auto; right: 2px; }
[dir="rtl"] .opt input:checked::before { transform: translateX(-15px); }
.chip { appearance: none; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); font: 600 13px var(--font); height: 34px; min-width: 34px; padding: 0 10px;
  border-radius: 17px; box-shadow: var(--shadow); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.chip svg { width: 17px; height: 17px; fill: currentColor; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 17px; box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 650 13px var(--font); height: 28px; padding: 0 12px; border-radius: 14px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.bar { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(760px, calc(100% - 20px));
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 18px; box-shadow: var(--shadow); padding: 8px 12px 6px 10px; box-sizing: border-box;
  display: flex; align-items: center; gap: 10px; direction: ltr; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.bar .play { appearance: none; border: 0; background: var(--accent); color: var(--bg); width: 42px; height: 42px; border-radius: 21px; flex: none; cursor: pointer; display: grid; place-items: center;
  box-shadow: 0 2px 8px rgb(29 79 143 / .25); }
.bar .play svg { width: 19px; height: 19px; fill: currentColor; }
.bar .step { appearance: none; border: 0; background: transparent; color: var(--accent); width: 32px; height: 38px; border-radius: 10px; flex: none; cursor: pointer; display: grid; place-items: center; }
.bar .step svg { width: 18px; height: 18px; fill: currentColor; }
.bar .step:active { background: var(--accent-soft); }
.bar .speed { appearance: none; border: 1px solid var(--panel-line); background: transparent; color: var(--muted); font: 700 12px var(--font); height: 28px; min-width: 38px; border-radius: 14px; cursor: pointer; flex: none; font-variant-numeric: tabular-nums; }
.track { flex: 1; min-width: 0; position: relative; height: 54px; }
#hist { position: absolute; left: 0; right: 0; top: 2px; height: 26px; width: 100%; display: block; }
#slider { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; height: 24px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
#slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--bar-past) var(--p, 100%), var(--bar-future) var(--p, 100%)); }
#slider::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--bar-past) var(--p, 100%), var(--bar-future) var(--p, 100%)); }
#slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); box-shadow: var(--shadow); }
#slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); box-shadow: var(--shadow); }
.ticks { position: absolute; left: 9px; right: 9px; bottom: -2px; height: 10px; pointer-events: none; font: 600 9.5px var(--font); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); top: -1px; opacity: .8; }

#card { position: absolute; z-index: 5; inset-inline-start: 12px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 84px); width: 330px; max-width: calc(100% - 24px); max-height: calc(100% - 220px);
  overflow: auto; overscroll-behavior: contain; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; box-shadow: var(--shadow); box-sizing: border-box;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: cardIn .25s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#card .top { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; background: var(--panel); }
#card .where { font: 650 12px var(--font); color: var(--muted); letter-spacing: .02em; }
#card .close { appearance: none; border: 0; background: transparent; color: var(--muted); width: 26px; height: 26px; border-radius: 13px; cursor: pointer; display: grid; place-items: center; flex: none; }
#card .close svg { width: 16px; height: 16px; fill: currentColor; }
#card .item { padding: 8px 12px 10px; border-top: 1px solid var(--panel-line); }
#card .item:first-of-type { border-top: 0; }
#card .name { font: 700 15px/1.3 var(--font); color: var(--ink); }
#card .what { margin-top: 1px; color: var(--muted); font-size: 12.5px; }
#card .when { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
#card .yr { font: 800 18px/1 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }
#card .conf { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 11px; font: 650 11.5px var(--font); background: var(--accent-soft); color: var(--accent); }
#card .conf i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
#card .conf.h { background: rgb(46 125 80 / .12); color: #2e7d50; }
#card .conf.m { background: rgb(176 120 20 / .13); color: #9a6a10; }
#card .conf.l { background: rgb(120 130 136 / .16); color: var(--muted); }
:root[data-theme="dark"] #card .conf.h { color: #79d3a0; } :root[data-theme="dark"] #card .conf.m { color: #e8c06a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #card .conf.h { color: #79d3a0; } :root:not([data-theme="light"]) #card .conf.m { color: #e8c06a; } }
#card .none { color: var(--muted); font-size: 12.5px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
/* ---- a shetach's card and a flagship's, as on the history page (its CSS, scoped to .hc) ---- */
#card.hc { padding: 10px 12px; font-size: 14px; line-height: 1.4; }
#card.hc.world { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
#card.hc .close { position: absolute; top: 6px; inset-inline-end: 6px; z-index: 2; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
#card.hc .close:hover { background: var(--accent-soft); }
#card.hc h2 { margin: 0 0 4px; margin-inline-end: 22px; font: 700 16px/1.25 var(--font); text-wrap: balance; }
#card.hc p, #card .meta { margin: 0; color: var(--muted); font-size: 13px; }

#card.hc h2.honor-h { font-size: 30px; line-height: 1.1; margin-bottom: 6px; }
#card.hc .hc-head { margin: -10px -12px 12px; padding: 13px 14px 12px; border-bottom: 1px solid var(--panel-line); border-radius: 9px 9px 0 0; background: linear-gradient(180deg, var(--honor-soft), var(--panel) 92%); }

#card.hc .rb-pic { flex: none; display: block; width: var(--w, 50px); aspect-ratio: 4 / 5; box-sizing: border-box; padding: 3px; border-radius: 2px;
  background: linear-gradient(135deg, #f7e8bb 0%, #c99e47 24%, #f2d998 46%, #9b7428 72%, #dcbb6e 100%);

#card.hc .hc-city { margin-top: 10px; }
#card.hc .foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-line); }
#card.hc .cc-head { --t: var(--tile); position: relative; display: flex; align-items: center; gap: 13px; margin: -10px -12px 0; padding: 14px; border-radius: 9px 9px 0 0;
  background: var(--tile); background: linear-gradient(150deg, color-mix(in srgb, var(--t) 52%, var(--panel)) 0%, color-mix(in srgb, var(--t) 18%, var(--panel)) 100%);
  border-bottom: 1px solid color-mix(in srgb, var(--t) 45%, var(--panel-line)); }

#card.hc .cc-sub { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; }

  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--panel-line)); border-radius: 999px; background: color-mix(in srgb, var(--panel) 82%, transparent);
  color: var(--accent); font: 600 12px/1 var(--font); text-decoration: none; white-space: nowrap; cursor: pointer; }

      <button class="chip" id="gear" type="button" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.81 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
      <button class="chip" id="lang" type="button"></button>
      <a class="chip" id="home" href="./" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M15 5.1 9 3 3 5v16l6-2.1 6 2.1 6-2V3l-6 2.1zM10 5.4l4 1.4v11.8l-4-1.4V5.4zM5 6.4l3-1v11.8l-3 1V6.4zm14 11.2-3 1V6.8l3-1v11.8z"/></svg></a>

    <div class="menu" id="menu" hidden><label class="opt"><span id="hyLbl"></span><input type="checkbox" id="hySw" role="switch"></label><label class="opt"><span id="msLbl"></span><input type="checkbox" id="msSw" role="switch"></label></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const HE = document.documentElement.lang === 'he';
  const L = (en, hb) => (HE ? hb : en);
  const Q = new URLSearchParams(location.search);
  const get = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });
  let topo, sfile, hist, data, he = null, photos = { photos: [] }, centers = {};
  try {
    [topo, sfile, hist, data, he, photos, centers] = await Promise.all([get('data/history-geo.json'), get('data/shetachim.json'), get('../data/shetach-history.json'),
      get('data/growth.json'), HE ? get('data/he.json').catch(() => null) : null, get('../data/head-photos.json').catch(() => ({ photos: [] })),
      get('data/history-centers.json').catch(() => ({}))]);
  } catch (err) {
    const e = $('#err'); e.hidden = false; e.textContent = L("The data didn't load", 'הנתונים לא נטענו'); return;
  }

  // ---------- the shapes (as on the history page: shared lines, long straight edges given points so the projection bends them) ----------
  (function decodeArcs(t) {
    if (!t.transform) return;
    const { scale: [kx, ky], translate: [dx, dy] } = t.transform;
    for (const arc of t.arcs) { let x = 0, y = 0; for (const p of arc) { x += p[0]; y += p[1]; p[0] = x * kx + dx; p[1] = y * ky + dy; } }
    delete t.transform;
  })(topo);
  topo.arcs = topo.arcs.map((arc) => {
    let out = null;
    for (let k = 1; k < arc.length; k++) {
      const [x0, y0] = arc[k - 1], [x1, y1] = arc[k];
      const n = Math.abs(x1 - x0) > 180 ? 1 : Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) / 0.5);
      if (n > 1 && !out) out = arc.slice(0, k);
      if (out) { for (let j = 1; j < n; j++) out.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]); out.push(arc[k]); }
    }
    return out || arc;
  });
  const pieces = topo.objects.areas.geometries, outside = topo.objects.outside.geometries;
  const isHI = (g) => g.properties && g.properties.state === 'US-HI';

  // ---------- Hebrew years (owner, Nov 12: "why isn't this Hebrew dates?????"), as on the history page: a date counts in the
  // Hebrew year it fell in and the timeline goes by Hebrew years. A year's slot is its Hebrew year less 3760 (5746's is
  // 1986: most of 1986 was 5746); a date with only a year is taken to be in that Hebrew year, one with a month mid-month.
  // On by default; a chip switches to the ordinary years.
  let HY = (() => { const q = Q.get('hy'); if (q === '1' || q === '0') return q === '1'; try { const v = localStorage.getItem('growth-hy'); return v == null ? true : v === '1'; } catch (e) { return true; } })();
  const hebYear = (() => {
    try {
      const f = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', timeZone: 'UTC' }), of = (d) => +f.formatToParts(d).find((x) => x.type === 'year').value;
      if (of(new Date(Date.UTC(1986, 0, 1))) !== 5746 || of(new Date(Date.UTC(1975, 8, 20))) !== 5736) throw new Error('no Hebrew calendar');
      return of;
    } catch (e) { return (d) => d.getUTCFullYear() + 3760 + (d.getUTCMonth() > 8 || (d.getUTCMonth() === 8 && d.getUTCDate() >= 20) ? 1 : 0); }
  })();
  const yr = (s) => {
    const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(String(s)); if (!m) return NaN;
    if (!HY || !m[2]) return +m[1];
    return hebYear(new Date(Date.UTC(+m[1], +m[2] - 1, m[3] ? +m[3] : 15))) - 3760;
  };
  // a year as shown: תשנ״א in Hebrew, 5751 in English; 1991 with the ordinary years
  function gem(n) {
    const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], hund = ['', 'ק', 'ר', 'ש', 'ת'];
    let h = Math.floor(n / 100), s = ''; const r = n % 100;
    while (h > 4) { s += 'ת'; h -= 4; }
    s += hund[h] + (r === 15 ? 'טו' : r === 16 ? 'טז' : tens[Math.floor(r / 10)] + ones[r % 10]);
    return s.length > 1 ? `${s.slice(0, -1)}״${s.slice(-1)}` : `${s}׳`;
  }
  const yearText = (y) => (y == null ? '' : !HY ? String(y) : HE ? gem((y + 3760) % 1000) : String(y + 3760));

  // ---------- the shetachim by year (data/shetach-history.json, read as the history page reads it) ----------
  function startOf(p) {
    if (!p) return null;
    if (p.from) return { y: yr(p.from) };
    const b = p.fromBound || {};
    if (b.by) return { y: yr(b.by) };
    if (b.after) return { y: yr(b.after) };
    return null;
  }
  const areaKeys = Object.keys(hist.areas);
  const P = pieces.map((g) => {
    const id = g.properties.id, sid = g.properties.shetach;
    if (g.properties.north) return { north: true, sliver: false, periods: [] };
    const key = hist.areas[id] ? id : areaKeys.find((k) => k.split(':')[1] === sid);
    const list = key ? hist.areas[key] : [];
    // ('sliver': the bit of New York the borders give to Southern Ontario's piece, left out of names, as on the history page)
    return { sliver: !!key && key !== id && key.slice(0, 2) !== id.slice(0, 2), periods: list.map((p) => ({ sid: p.shetach || null, st: startOf(p) })).filter((q) => q.st) };
  });
  const sidStart = new Map();
  for (const a of P) for (const q of a.periods) if (q.sid && (!sidStart.has(q.sid) || q.st.y < sidStart.get(q.sid))) sidStart.set(q.sid, q.st.y);
  const headsOf = (sid) => hist.heads[sid] || [];
  // the head that year, as on the history page: { x: the history's entry, last, from, to }
  function headAt(sid, Y) {
    const hs = headsOf(sid); let k = -1;
    hs.forEach((x, j) => { const st = startOf(x); const y = st ? st.y : (j === 0 ? -Infinity : null); if (y != null && y <= Y) k = j; });
    if (k < 0) return null;
    const next = hs[k + 1] && startOf(hs[k + 1]), st = startOf(hs[k]);
    return { x: hs[k], last: k === hs.length - 1, from: st ? st.y : sidStart.get(sid), to: next ? next.y : null };
  }
  const sidAt = (i, Y) => { if (P[i].north) return null; let s = null; for (const q of P[i].periods) if (q.st.y <= Y) s = q.sid; return s && headAt(s, Y) ? s : null; };
  function flagAt(sid, Y) { let f = null; for (const x of (hist.flagships || {})[sid] || []) { const st = startOf(x); if (st && st.y <= Y) f = x; } return f; }
  const CFG = new Map(); let nCfg = 0;
  function config(Y) {
    let c = CFG.get(Y); if (c) return c;
    const s = pieces.map((_, i) => sidAt(i, Y)), key = s.join('|');
    for (const v of CFG.values()) if (v.key === key) { CFG.set(Y, v); return v; }
    const groups = new Map(); s.forEach((sid, i) => { if (sid) (groups.get(sid) || groups.set(sid, []).get(sid)).push(i); });
    c = { id: nCfg++, key, s, sids: [...groups.keys()], groups }; CFG.set(Y, c);
    return c;
  }

  // ---------- the centers ----------
  const NOW = HY ? hebYear(new Date()) - 3760 : new Date().getFullYear();
  const START = 1940; // the Frierdiker Rebbe came to America in 1940; the few older (a shul founded earlier, later Lubavitch) are there from the start
  const slotOf = (date, year) => { const t = date ? yr(date) : NaN; return Number.isFinite(t) ? t : year; };
  const DOTS = data.dots.map((d) => { const s = slotOf(d[7], d[2]); return { lon: d[0], lat: d[1], y: Math.max(START, s), y0: s, c: d[3], st: d[4], sh: d[5], L: d[6], pid: d[8] || '', x: 0, yy: 0, hi: d[4] === 'US-HI' }; })
    .sort((a, b) => a.y - b.y);
  const LIST = data.listings;
  const PIDX = new Map(pieces.map((g, i) => [g.properties.id, i]));
  for (const d of DOTS) d.pi = PIDX.get(d.pid);
  const FIRST = {}; // the year each state or province got its first center
  for (const d of DOTS) if (d.st && (FIRST[d.st] == null || d.y0 < FIRST[d.st])) FIRST[d.st] = d.y0;
  const NREG = 60; // 50 states and 10 provinces (Washington DC counted with the states it sits among, not on its own)
  const regionsBy = (Y) => { let n = 0; for (const [r, y] of Object.entries(FIRST)) if (r !== 'US-DC' && Math.max(START, y) <= Y) n++; return n; };
  const perYear = new Map(); for (const d of DOTS) perYear.set(d.y, (perYear.get(d.y) || 0) + 1);
  const cum = new Map(); { let n = 0; for (let y = START; y <= NOW; y++) { n += perYear.get(y) || 0; cum.set(y, n); } }
  const firstsIn = new Map(); for (const [r, y] of Object.entries(FIRST)) { const k = Math.max(START, y); if (r !== 'US-DC') (firstsIn.get(k) || firstsIn.set(k, []).get(k)).push(r); }
  const stateName = (r) => { const t = HE && he && he.areas && he.areas[r]; if (t) return t; const g = pieces.find((x) => x.properties.state === r); return g ? g.properties.name : r; };
  const heName = (n) => (HE && he && he.centers && he.centers[n]) || n;
  const heCity = (n) => (HE && he && he.cities && he.cities[n]) || n;
  const SH = new Map(sfile.shetachim.map((s) => [s.id, s]));
  const shetachName = (sid) => { const t = HE && he && he.shetachim && he.shetachim[sid]; return (t && t.name) || (SH.get(sid) || {}).name || ''; };

  // ---------- the shetachim's history, as the history page reads and shows it (owner, Nov 12: "THERES SO MUCH STUFF IN THE
  // SHETACHIM YEAR BY YEAR LIKE THOSE ORIGINAL YESHIVAS ... WHY DIDNT YOU FUCKING INTEGRATE THE DATA?"): the year's name, head
  // (his photo), vaad and flagship or first place (a yeshiva, a school, a shul), on cards as there. (Copied from
  // web/history.html: a change to its cards wants the same change here.) ----------
  // the flagship that year and its years at that place
  function flagSpan(sid, Y) {
    const list = (hist.flagships || {})[sid];
    if (!list) return { from: null, to: null };
    let k = -1; list.forEach((x, j) => { const st = startOf(x); if (st && st.y <= Y) k = j; });
    const nx = list[k + 1] && startOf(list[k + 1]);
    return { from: startOf(list[k]).y, to: nx ? nx.y : null };
  }
  // the vaad that year (hist.vaads: Florida's, New Jersey's) and its years; each lasts until the next
  const vaadsOf = (sid) => (hist.vaads || {})[sid] || [];
  function vaadAt(sid, Y) {
    const vs = vaadsOf(sid); let k = -1;
    vs.forEach((v, j) => { const st = startOf(v); if (st && st.y <= Y) k = j; });

  const AREAS = new Map();

  }
  let glNames = null;
  function dotImage(fill, edge) {

  }
  function starImage(fill, edge) {

  }
  // the street map's names in the page's language, as on the main map: English, the English (or Latin) name; Hebrew,
  // places only where they have a Hebrew name, streets as they're signed
  function glLanguage() {
    const latin = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']];
    for (const l of gl.getStyle().layers) {

      gl.setLayoutProperty(l.id, 'text-field', HE ? (street ? ['coalesce', ['get', 'name:he'], ['get', 'name']] : ['get', 'name:he']) : latin);

  }
  function glLayers() {

    if (gl.hasImage('gstar')) gl.removeImage('gstar');
    gl.addImage('gstar', starImage(dark ? '#fff8e6' : '#c8952a', dark ? '#b8892a' : '#6b4a0f'), { pixelRatio: 2 });
    if (gl.hasImage('gdot')) gl.removeImage('gdot');
    gl.addImage('gdot', dotImage(dark ? '#fff8e6' : '#c8952a', dark ? '#b8892a' : '#6b4a0f'), { pixelRatio: 2 });
    for (const id of ['reached', 'areas', 'lines', 'dots', 'pops', 'names', 'flags', 'sel']) gl.addSource(id, { type: 'geojson', data: id === 'dots' ? dotsFC : EMPTY });
    const accent = dark ? '#93b8ec' : '#1d4f8f';
    gl.addLayer({ id: 'reached', type: 'fill', source: 'reached', paint: { 'fill-color': ['case', ['==', ['get', 'n'], 1], dark ? '#6aa2dc' : '#3f7cc4', dark ? '#3b6a96' : '#e9eef0'],
      'fill-opacity': ['case', ['==', ['get', 'n'], 1], dark ? 0.5 : 0.32, dark ? 0.3 : 0.7] } });
    gl.addLayer({ id: 'area-hit', type: 'fill', source: 'areas', paint: { 'fill-color': '#000', 'fill-opacity': 0 } });
    gl.addLayer({ id: 'area-sel', type: 'fill', source: 'areas', filter: ['==', ['get', 'sid'], ''], paint: { 'fill-color': accent, 'fill-opacity': dark ? 0.16 : 0.11 } });
    gl.addLayer({ id: 'lines', type: 'line', source: 'lines', layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': dark ? 'rgba(225,238,244,0.55)' : 'rgba(35,52,64,0.62)', 'line-width': ['interpolate', ['linear'], ['zoom'], 3, 1, 8, 1.7, 12, 2.6] } });
    gl.addLayer({ id: 'area-sel-line', type: 'line', source: 'areas', filter: ['==', ['get', 'sid'], ''], layout: { 'line-join': 'round' }, paint: { 'line-color': accent, 'line-width': 2.2 } });
    gl.addLayer({ id: 'dots', type: 'circle', source: 'dots', filter: ['<=', ['get', 'y'], Y],
      paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, 2.3, 3, 2.9, 6, 3.8, 10, 5.4, 14, 7.5, 17, 10], 'circle-color': dark ? '#f1cf78' : '#163e74',
        'circle-stroke-color': dark ? 'rgba(11,17,20,0.9)' : '#ffffff', 'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 3, 0.9, 12, 1.8] } });
    gl.addLayer({ id: 'pops', type: 'circle', source: 'pops', paint: { 'circle-radius': ['get', 'r'], 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': dark ? '#ffe7a3' : '#d29b2a', 'circle-stroke-width': ['get', 'w'], 'circle-stroke-opacity': ['get', 'a'] } });
    // (the shetachim's names, as on the history page: the biggest placed first; gone at street level)
    gl.addLayer({ id: 'names', type: 'symbol', source: 'names', maxzoom: 9, layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'],
      'text-size': ['interpolate', ['linear'], ['zoom'], 3, 11, 6, 14, 8, 16], 'text-max-width': 8, 'text-padding': 4, 'symbol-sort-key': ['-', 0, ['get', 'area']] },
      paint: { 'text-color': dark ? '#e6edf0' : '#1e2b32', 'text-halo-color': dark ? 'rgba(11,17,20,0.9)' : 'rgba(255,255,255,0.92)', 'text-halo-width': 1.6, 'text-opacity': 0.9 } });
    gl.addLayer({ id: 'flags', type: 'symbol', source: 'flags', layout: { 'icon-image': ['case', ['==', ['get', 'kind'], ''], 'gstar', 'gdot'], 'icon-allow-overlap': true, 'icon-ignore-placement': true, 'symbol-sort-key': ['get', 'big'],
      'icon-size': ['interpolate', ['linear'], ['zoom'], 3, ['case', ['==', ['get', 'big'], 1], 0.56, 0.4], 10, ['case', ['==', ['get', 'big'], 1], 0.85, 0.62]] } });
    gl.addLayer({ id: 'sel', type: 'circle', source: 'sel', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 3, 7.5, 14, 13], 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': dark ? '#e6edf0' : '#1e2b32', 'circle-stroke-width': 2 } });
    gl.addLayer({ id: 'hit', type: 'circle', source: 'dots', filter: ['<=', ['get', 'y'], Y], paint: { 'circle-radius': 12, 'circle-opacity': 0 } });

  }
  function glYear() {
    if (!glReady) return;

    gl.getSource('flags').setData(flagsFC());
    const c = config(Y), k = `${MODE}|${MODE === 'states' ? Y : c.id}`;
    if (k !== glKey) {
      glKey = k;
      gl.getSource('reached').setData(MODE === 'states' ? reachedFC() : EMPTY);
      gl.getSource('lines').setData(MODE === 'states' ? stateMesh() : shetachMesh(c));
      gl.getSource('areas').setData(MODE === 'states' ? EMPTY : areasFC(c));
    }
    const nk = MODE === 'states' ? '' : `${c.id}#${[...c.groups.keys()].map((sid) => nameOf(sid, Y)).join('|')}`;
    if (nk !== glNames) { glNames = nk; gl.getSource('names').setData(MODE === 'states' ? EMPTY : namesFC(c)); }
  }
  function glFrame(now) {
    if (!glReady) return;
    const fs = [], base = 2.6 + 0.3 * Math.max(0, gl.getZoom() - 3);
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i], t = (now - p.t0) / 1300;
      if (t >= 1) { pops.splice(i, 1); continue; }
      if (t < 0) continue;
      fs.push(feat({ type: 'Point', coordinates: [p.d.lon, p.d.lat] }, { r: base + 14 * d3.easeCubicOut(t), a: (1 - t) * 0.9, w: 1.8 * (1 - t) + 0.4 }));
    }
    gl.getSource('pops').setData({ type: 'FeatureCollection', features: fs });
  }
  // (a center picked under the card, or under the year: the map moves it into the open)
  function glReveal(d) {
    if (!glReady || VIEW !== 'streets') return;
    const p = gl.project([d.lon, d.lat]), c = $('#card').getBoundingClientRect(), h = document.querySelector('.plate').getBoundingClientRect();
    const under = (r) => p.x > r.left - 14 && p.x < r.right + 14 && p.y > r.top - 14 && p.y < r.bottom + 14;
    if (!under(c) && !under(h)) return;
    const phone = innerWidth < 700, top = h.bottom + 12, bottom = phone ? c.top - 12 : innerHeight - 110;
    const tx = phone ? innerWidth / 2 : (HE ? (c.left - 12) / 2 : (c.right + innerWidth) / 2), ty = (top + bottom) / 2;
    gl.panBy([p.x - tx, p.y - ty], { duration: 450 });
  }
  function glSel() {
    if (!glReady) return;
    let pt = null;
    if (selected) pt = [selected.lon, selected.lat];
    else if (pick && pick.flag) { const f = flagAt(pick.sid, Y); if (f) pt = [f.lon, f.lat]; }
    gl.getSource('sel').setData(pt ? { type: 'FeatureCollection', features: [feat({ type: 'Point', coordinates: pt })] } : EMPTY);
    const sid = pick && !pick.flag && MODE === 'shetachim' ? pick.sid : '';
    gl.setFilter('area-sel', ['==', ['get', 'sid'], sid]); gl.setFilter('area-sel-line', ['==', ['get', 'sid'], sid]);
  }
  function glTheme() {
    if (!gl) return; const d = isDark(); if (d === glDark) return;
    glDark = d; glReady = false; $('#gl').classList.toggle('gl-dark', d); gl.setStyle(d ? GL_STYLE.dark : GL_STYLE.light, { diff: false }); gl.once('style.load', glLayers);
  }
  // (Hebrew: the map's right-to-left text support, as on the main map, waited for before the map starts)

      attributionControl: false, keyboard: false, dragRotate: false, pitchWithRotate: false, touchPitch: false, maxZoom: 18, minZoom: 1.5, fadeDuration: 200,
      pixelRatio: Math.min(window.devicePixelRatio || 1, 2) });

      const flagNear = (r) => { let fl = null, fd = Infinity; for (const f of near('flags', r)) { const dd = dist(...f.geometry.coordinates); if (dd < fd) { fd = dd; fl = f; } } return fl; };

      closeCard();

    gl.on('mouseleave', 'hit', () => { gl.getCanvas().style.cursor = ''; });

  const viewBtns = [...document.querySelectorAll('#view button')];
  viewBtns[0].textContent = L('Streets', 'רחובות'); viewBtns[1].textContent = L('Political', 'מדינית');
  function setView(v) {
