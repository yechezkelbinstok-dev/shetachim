    return phone() ? { l: 16, t: 16, r: 16, b: bar + 12 } : { l: r.right + 16, t: 16, r: 64, b: 16 };
  }

  // ---------- geometry ----------
  // The topology's arcs as [lon, lat, lon, lat, …]. Long straight stretches get extra points, so they bend with
  // the projection like everything else.
  const arcLL = (() => {
    const [kx, ky] = topo.transform.scale, [dx, dy] = topo.transform.translate;
    return topo.arcs.map((arc) => {
      const out = [];
      let x = 0, y = 0, px = 0, py = 0;
      arc.forEach(([ax, ay], i) => {
        x += ax; y += ay;
        const lon = x * kx + dx, lat = y * ky + dy;
        if (i) {
          const n = Math.ceil(Math.max(Math.abs(lon - px), Math.abs(lat - py)) / 0.5);
          for (let j = 1; j < n; j++) out.push(px + ((lon - px) * j) / n, py + ((lat - py) * j) / n);
        }
        out.push(lon, lat);
        px = lon; py = lat;
      });
      return out;
    });
  })();
  // Polygons crossing the 180° line come split along it; that cut isn't a coast or a border, so it's never drawn.
  const onSeam = (i) => { const a = arcLL[i]; for (let j = 0; j < a.length; j += 2) if (Math.abs(a[j]) < 179.99) return false; return true; };
  const arcsOf = (g, out = new Set()) => { const walk = (a) => (Array.isArray(a) ? a.forEach(walk) : out.add(a < 0 ? ~a : a)); walk(g.arcs || []); return out; };

  // Visvalingam weights: each point's weight is the area (map pixels², zoom 1) of the triangle it makes with its
  // neighbours as the line is simplified; a zoom level draws only the points big enough to see at that zoom.
  function weights(xy) {
    const n = xy.length / 2, w = new Float32Array(n).fill(Infinity);
    if (n < 3) return w;
    const prev = new Int32Array(n), next = new Int32Array(n), val = new Float64Array(n), at = new Int32Array(n).fill(-1), heap = [];
    for (let i = 0; i < n; i++) { prev[i] = i - 1; next[i] = i + 1; }
    const tri = (i) => { const a = prev[i], b = next[i]; return Math.abs((xy[2 * a] - xy[2 * i]) * (xy[2 * b + 1] - xy[2 * i + 1]) - (xy[2 * b] - xy[2 * i]) * (xy[2 * a + 1] - xy[2 * i + 1])) / 2; };
    const swap = (i, j) => { const a = heap[i], b = heap[j]; heap[i] = b; heap[j] = a; at[b] = i; at[a] = j; };
    const up = (i) => { while (i > 0) { const p = (i - 1) >> 1; if (val[heap[p]] <= val[heap[i]]) break; swap(i, p); i = p; } };
    const down = (i) => { for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < heap.length && val[heap[l]] < val[heap[m]]) m = l; if (r < heap.length && val[heap[r]] < val[heap[m]]) m = r; if (m === i) break; swap(i, m); i = m; } };
    const set = (i, v) => { val[i] = v; up(at[i]); down(at[i]); };
    for (let i = 1; i < n - 1; i++) { val[i] = tri(i); at[i] = heap.length; heap.push(i); up(heap.length - 1); }
    let max = 0;
    while (heap.length) {
      const i = heap[0], last = heap.pop();
      if (heap.length) { heap[0] = last; at[last] = 0; down(0); }
      at[i] = -1;
      max = Math.max(max, val[i]);
      w[i] = max;
      const p = prev[i], q = next[i];
      next[p] = q; prev[q] = p;
      if (p > 0) set(p, tri(p));
      if (q < n - 1) set(q, tri(q));
    }
    return w;
  }

  // An area to fill or outline: its polygons as rings of arcs, each polygon with its box (map pixels, zoom 1) and a
  // Path2D per zoom level, made when first needed.
  function drawable(ma) {
    const polys = (ma.type === 'Polygon' ? [ma.arcs] : ma.type === 'MultiPolygon' ? ma.arcs : []).map((rings) => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const a of rings[0]) {
        const xy = V.xy[a < 0 ? ~a : a];
        for (let j = 0; j < xy.length; j += 2) { if (xy[j] < x0) x0 = xy[j]; if (xy[j] > x1) x1 = xy[j]; if (xy[j + 1] < y0) y0 = xy[j + 1]; if (xy[j + 1] > y1) y1 = xy[j + 1]; }
      }
      return { rings, box: [x0, y0, x1, y1], paths: [] };
    });
    return { polys };
  }
  // A polygon's rings as points (map pixels, zoom 1), for labels and hit tests.
  function ringsOf(poly) {
    return poly.rings.map((ring) => {
      const pts = [];
      ring.forEach((a, k) => {
        const rev = a < 0, xy = V.xy[rev ? ~a : a], n = xy.length / 2;
        for (let s = k ? 1 : 0; s < n; s++) { const j = rev ? n - 1 - s : s; pts.push([xy[2 * j], xy[2 * j + 1]]); }
      });
      return pts;
    });
  }
  const LEVELS = 8;
  const levelFor = (k) => clamp(Math.ceil(Math.log2(k) - 1e-9), 0, LEVELS - 1);
  const minWeight = (L) => 0.25 / 4 ** L; // screen pixels² a point's triangle must cover to be drawn (at 2^L)
  function traceArcs(path, arcs, L, close) {
    const t = minWeight(L);
    let first = true;
    for (const a of arcs) {
      const rev = a < 0, i = rev ? ~a : a, xy = V.xy[i], w = V.w[i], n = w.length;
      for (let s = first ? 0 : 1; s < n; s++) {
        const j = rev ? n - 1 - s : s;
        if (w[j] < t) continue;
        if (first) { path.moveTo(xy[2 * j], xy[2 * j + 1]); first = false; } else path.lineTo(xy[2 * j], xy[2 * j + 1]);
      }
    }
    if (close) path.closePath();
  }
  function polyPath(poly, L) {
    if (!poly.paths[L]) { const p = new Path2D(); for (const ring of poly.rings) traceArcs(p, ring, L, true); poly.paths[L] = p; }
    return poly.paths[L];
  }

  // Borders by kind, in cells of a grid over the map, so only the cells on screen are drawn.
  const GRID = 12;
  function meshCells(main, filter) {
    const mesh = topojson.meshArcs(topo, collection(main), filter);
    const [bx0, by0, bx1, by1] = V.extent, cw = (bx1 - bx0) / GRID || 1, ch = (by1 - by0) / GRID || 1;
    const cells = new Map();
    for (const line of mesh.arcs) {
      for (const a of line) {
        const i = a < 0 ? ~a : a;
        if (onSeam(i)) continue;
        const xy = V.xy[i];
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (let j = 0; j < xy.length; j += 2) { if (xy[j] < x0) x0 = xy[j]; if (xy[j] > x1) x1 = xy[j]; if (xy[j + 1] < y0) y0 = xy[j + 1]; if (xy[j + 1] > y1) y1 = xy[j + 1]; }
        const key = clamp(Math.floor(((x0 + x1) / 2 - bx0) / cw), 0, GRID - 1) * GRID + clamp(Math.floor(((y0 + y1) / 2 - by0) / ch), 0, GRID - 1);
        let c = cells.get(key);
        if (!c) cells.set(key, (c = { arcs: [], box: [Infinity, Infinity, -Infinity, -Infinity], paths: [] }));
        c.arcs.push(i);
        c.box = [Math.min(c.box[0], x0), Math.min(c.box[1], y0), Math.max(c.box[2], x1), Math.max(c.box[3], y1)];
      }
    }
    return [...cells.values()];
  }
  function cellPath(cell, L) {
    if (!cell.paths[L]) { const p = new Path2D(); for (const i of cell.arcs) traceArcs(p, [i], L, false); cell.paths[L] = p; }
    return cell.paths[L];
  }

  // opts.focus: {ll, k} to keep looking at the same place (switching maps); opts.keep: leave the physical map's camera alone.
  function layout(opts = {}) {
    W = svg.node().clientWidth;
    H = svg.node().clientHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    document.documentElement.style.setProperty('--sheet', `${$('#panel').getBoundingClientRect().height}px`);
    const view = VIEWS[state.view];
    const physical = state.base === 'physical';
    const shown = pieces.filter((g) => view.countries.includes(g.properties.country));
    // Alaska in its own box, or in its real place (the Alaska option); Hawaii is always boxed. The physical map has both in place.
    const boxed = view.insets.filter((st) => !(st === 'US-AK' && state.alaska === 'place'));
    const insetStates = physical ? [] : boxed;
    const main = shown.filter((g) => !insetStates.includes(g.properties.state));
    const framed = shown.filter((g) => !boxed.includes(g.properties.state)); // both maps frame the same area
    V = { view, physical, shown, main, index: {}, insetPieces: shown.filter((g) => insetStates.includes(g.properties.state)) };

    const p = insets();
    // On a phone the boxes get their own strip under the map (a desktop's continent leaves room beside the panel).
    const pFit = { ...p };
    if (phone() && V.insetPieces.length) pFit.b += Math.max(...V.insetPieces.map((g) => { const sp = INSETS[g.properties.state]; return clamp((W - p.l - p.r) * sp.share, 80, 260) * sp.aspect; })) + 10;
    // frame: a lon/lat box to fill the screen with instead of every island (Europe without the Azores and Canaries)
    const target = view.frame ? d3.geoGraticule().extent(view.frame).outline() : topojson.feature(topo, collection(framed));
    projection = (physical ? d3.geoMercator().rotate([-(view.lon || 0), 0]) : view.projection()).fitExtent([[pFit.l, pFit.t], [W - pFit.r, H - pFit.b]], target);
    geoPath = d3.geoPath(projection);
    if (physical) V.zFit = Math.log2((2 * Math.PI * projection.scale()) / 512); // MapLibre zoom of the framed view

    // Every arc the view draws, projected once (map pixels at zoom 1), with its points' weights.
    V.xy = []; V.w = [];
    let ex0 = Infinity, ey0 = Infinity, ex1 = -Infinity, ey1 = -Infinity;
    const viewArcs = new Set();
    for (const g of main) arcsOf(g, viewArcs);
    for (const i of viewArcs) {
      const ll = arcLL[i], xy = new Float32Array(ll.length);
      for (let j = 0; j < ll.length; j += 2) {
        const q = projection([ll[j], ll[j + 1]]);
        xy[j] = q[0]; xy[j + 1] = q[1];
        if (q[0] < ex0) ex0 = q[0]; if (q[0] > ex1) ex1 = q[0]; if (q[1] < ey0) ey0 = q[1]; if (q[1] > ey1) ey1 = q[1];
      }
      V.xy[i] = xy;
      if (!physical) V.w[i] = weights(xy);
    }
    V.extent = [ex0, ey0, ex1, ey1];

    // Shetachim, the blank parts of states, and states (for States borders): each merged, with its polygons.
    const area = (gs, extra) => { const ma = topojson.mergeArcs(topo, gs); const d = drawable(ma); return { ...extra, g: gs[0], ma, ...d, polysXY: d.polys.map(ringsOf) }; };
    V.regions = [...d3.group(main.filter(shetachOf), shetachOf)].map(([s, gs]) => {
      const r = area(gs, { s, color: shetachColor(s.id) });
      // labelState: the part of the shetach its name belongs on (Alberta, not the territories' narrow strip north of it)
      const core = s.labelState && gs.filter((g) => g.properties.state === s.labelState);
      if (core && core.length && core.length < gs.length) r.coreXY = area(core, {}).polysXY;
      // labelCentre: softer — the name aims at that state's part (Western Pennsylvania's Pennsylvania, not its West
      // Virginia) but may run a little past it
      const lean = s.labelCentre && gs.filter((g) => g.properties.state === s.labelCentre);
      if (lean && lean.length && lean.length < gs.length) { r.coreXY = area(lean, {}).polysXY; r.soft = true; }
      return r;
    });
    V.blanks = [...d3.group(main.filter((g) => !shetachOf(g)), (g) => g.properties.state)].map(([st, gs]) => area(gs, { st }));
    V.states = [...d3.group(main, (g) => g.properties.state)].map(([st, gs]) => area(gs, { st, p: gs[0].properties, color: stateColor(st) }));
    if (!physical) {
      const key = (g) => g.properties.shetach || '';
      V.mesh = {
        coast: meshCells(main, (a, b) => a === b),
        regular: meshCells(main, (a, b) => a.properties.state !== b.properties.state && a.properties.country === b.properties.country),
        country: meshCells(main, (a, b) => a.properties.country !== b.properties.country),
        shetach: meshCells(main, (a, b) => a !== b && key(a) !== key(b)),
      };
    }

    const mainIds = new Set(main.map((g) => g.properties.id));
    V.dots = dots.filter((d) => mainIds.has(d.piece));
    for (const d of V.dots) [d.x, d.y] = projection([d.lon, d.lat]);
    tree = d3.quadtree(V.dots, (d) => d.x, (d) => d.y);
    V.caps = capitals.filter((c) => mainIds.has(c.piece));
    V.cities = cities.filter((c) => mainIds.has(c.piece));
    for (const c of [...V.caps, ...V.cities]) [c.x, c.y] = projection([c.lon, c.lat]);
    const ui = getComputedStyle(document.documentElement).getPropertyValue('--font-ui');
    measure.font = `500 ${MARK_FONT}px ${ui}`;
    for (const c of V.cities) if (!c.widths) c.widths = c.texts.map((t) => measure.measureText(t).width);
    const [lon0, lat0] = projection.invert([W / 2, H / 2]);
    const a = projection([lon0, lat0]), b = projection([lon0, lat0 + 1]);
    V.pxPerKm = Math.hypot(b[0] - a[0], b[1] - a[1]) / 111.2; // at zoom 1

    for (const r of [...V.regions, ...V.states]) r.anchor = anchorFor(r.polysXY);
    drawInsets(p);

    const shownIds = new Set(shown.map((g) => g.properties.id));
    const viewDots = dots.filter((d) => shownIds.has(d.piece));
    $('#view-name').textContent = tr(view.name);
    const regular = tr(view.world ? 'Countries' : 'States');
    document.querySelectorAll('[data-name="borders"] [data-value="regular"], [data-name="lighter"] [data-value="regular"]').forEach((btn) => { btn.textContent = regular; });
    $('#st-shetachim').textContent = fmt(new Set(shown.map((g) => g.properties.shetach).filter(Boolean)).size);
    $('#st-centers').textContent = fmt(d3.sum(viewDots, (d) => d.centers.length));
    $('#st-dots').textContent = fmt(viewDots.length);

    const start = opts.focus ? transformFor(opts.focus) : d3.zoomIdentity;
    if (physical) {
      mapgl.resize();
      mapgl.setRenderWorldCopies(!!view.wrap);
      mapgl.setMinZoom(Math.max(-2, V.zFit - 1.5)); // MapLibre allows down to -2 (it still fills the screen height with the world)
      dataGL();
      if (!opts.keep) mapgl.jumpTo(cameraFor(start));
      syncCamera();
    } else {
      zoom.translateExtent([[-W * 0.5, -H * 0.5], [W * 1.5, H * 1.5]]);
      svg.call(zoom.transform, zoom.constrain()(start, [[0, 0], [W, H]], zoom.translateExtent()));
    }
    requestDraw();
  }

  // Where the middle of the screen is, and how far in from the framed view: survives switching maps.
  function focusNow() {
    return { ll: projection.invert(T.invert([W / 2, H / 2])), k: T.k };
  }
  function transformFor({ ll, k }) {
    const pt = ll && projection(ll);
    if (!pt || !pt.every(Number.isFinite)) return d3.zoomIdentity;
    if (!V.physical) k = clamp(k, 1, 60);
    return d3.zoomIdentity.translate(W / 2 - k * pt[0], H / 2 - k * pt[1]).scale(k);
  }

  // ---------- Alaska and Hawaii boxes ----------
  function drawInsets(p) {
    gInsets.selectAll('*').remove();
    insetBoxes = [];
    let x = p.l;
    for (const g of V.insetPieces) {
      const spec = INSETS[g.properties.state];
      const w = clamp((W - p.l - p.r) * spec.share, 80, 260), h = w * spec.aspect, y = H - p.b - h;
      const feature = topojson.feature(topo, g);
      const proj = spec.projection().fitExtent([[x + 6, y + 18], [x + w - 6, y + h - 6]], feature);
      const box = { piece: g, x, y, w, h, proj, dots: dots.filter((d) => d.piece === g.properties.id) };
      const s = shetachOf(g);
      const group = gInsets.append('g');
      group.append('rect').attr('class', 'inset-frame').attr('x', x).attr('y', y).attr('width', w).attr('height', h).attr('rx', 6);
      group.append('path').datum(feature).attr('class', 'inset-land')
        .style('--fill', s ? cssColor(shetachColor(s.id)) : 'none').style('--fill-u', cssColor(stateColor(g.properties.state))).attr('d', d3.geoPath(proj));
      box.caption = group.append('text').attr('class', 'inset-caption').attr('x', x + 8).attr('y', y + 13);
      group.selectAll('circle').data(box.dots).join('circle').attr('class', 'dot')
        .attr('cx', (d) => proj([d.lon, d.lat])[0]).attr('cy', (d) => proj([d.lon, d.lat])[1])
        .attr('r', (d) => 2.2 + 0.5 * Math.log2(d.centers.length));
      insetBoxes.push(box);
      x += w + 10;
    }
    insetOrigin = [p.l, H - p.b];
    gInsets.style('transform-origin', `${insetOrigin[0]}px ${insetOrigin[1]}px`);
  }

  // ---------- labels ----------
  // An area's biggest polygon's area, and a bbox over every polygon (even small ones), so placeLabels can tell when the
  // whole area doesn't fit on screen and works from what does.
  function anchorFor(polys) {
    const area = d3.max(polys, (rings) => Math.abs(d3.polygonArea(rings[0])));
    if (!(area > 0)) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const poly of polys) for (const [x, y] of poly[0]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { area, bbox: [x0, y0, x1, y1] };
  }

  // A shetach in pieces that other land keeps apart (Bosnia and the rest of the Lower Balkans, with Montenegro and
  // Serbia between) gets its name on each big piece, so each is labelled and both read as one shetach; pieces only
  // water keeps apart (islands, the two sides of a gulf) share one label, which may cross the water. A piece counts
  // as big from a tenth of the biggest; smaller ones go with the nearest big one. Labels keep the shetach's one size.
  function labelClusters(r, id, ix) {
    const polys = r.polysXY.map((rings) => ({ rings, area: Math.abs(d3.polygonArea(rings[0])), c: d3.polygonCentroid(rings[0]) }));
    const max = d3.max(polys, (q) => q.area);
    const big = polys.filter((q) => q.area >= max * 0.1);
    if (r.coreXY) return [{ polys: r.polysXY, a: r.anchor, core: r.coreXY, soft: r.soft }];
    if (big.length < 2) return [{ polys: r.polysXY, a: r.anchor }];
    const ownerAt = (x, y) => {
      for (const [other, xs] of crossings(ix, y)) for (let i = 0; i + 1 < xs.length; i += 2) if (x >= xs[i] && x <= xs[i + 1]) return other;
      return null;
    };
    // apart: where the straight line between their middles leaves the shetach, it's mostly over someone else's land
    const apart = (a, b) => {
      let land = 0, water = 0;
      for (let t = 1; t < 48; t++) {
        const o = ownerAt(a.c[0] + ((b.c[0] - a.c[0]) * t) / 48, a.c[1] + ((b.c[1] - a.c[1]) * t) / 48);
        if (o === null) water++; else if (o !== id) land++;
      }
      return land > water;
    };
    const root = big.map((_, i) => i), find = (i) => (root[i] === i ? i : (root[i] = find(root[i])));
    for (let i = 0; i < big.length; i++) for (let j = i + 1; j < big.length; j++) if (!apart(big[i], big[j])) root[find(j)] = find(i);
    const groups = new Map();
    for (const q of polys) {
      let bi = big.indexOf(q);
      if (bi < 0) bi = d3.minIndex(big, (b) => Math.hypot(b.c[0] - q.c[0], b.c[1] - q.c[1]));
      const g = find(bi);
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(q.rings);
    }
    if (groups.size < 2) return [{ polys: r.polysXY, a: r.anchor }];
    return [...groups.values()].map((ps) => ({ polys: ps, a: { ...anchorFor(ps), area: r.anchor.area } }));
  }

  // The edges of the labelled areas filed by height, so where a horizontal line crosses them is quick to find.
  function edgeIndex(areas) {
    let y0 = Infinity, y1 = -Infinity;
    for (const r of areas) for (const rings of r.polysXY) for (const pt of rings[0]) { y0 = Math.min(y0, pt[1]); y1 = Math.max(y1, pt[1]); }
    const n = Math.max(1, Math.ceil((y1 - y0) / 2)), step = (y1 - y0) / n || 1, bands = Array.from({ length: n }, () => []);
    areas.forEach((r, id) => {
      for (const rings of r.polysXY) for (const ring of rings) for (let i = 1; i < ring.length; i++) {
        const a = ring[i - 1], b = ring[i];
        if (a[1] === b[1]) continue;
        const lo = Math.max(0, Math.floor((Math.min(a[1], b[1]) - y0) / step)), hi = Math.min(n - 1, Math.floor((Math.max(a[1], b[1]) - y0) / step));
        for (let k = lo; k <= hi; k++) bands[k].push(id, a[0], a[1], b[0], b[1]);
      }
    });
    return { y0, step, n, bands };
  }
  function labelIndex() {
    const mode = state.borders === 'regular' ? 'regular' : 'shetach';
    return V.index[mode] || (V.index[mode] = edgeIndex(mode === 'regular' ? V.states : [...V.regions, ...V.blanks]));
  }

  // Where the line at map height y is inside each area: area → [in, out, in, out, …] (map x, in order).
  function crossings(ix, y) {
    const out = new Map(), k = Math.floor((y - ix.y0) / ix.step);
    if (!(k >= 0 && k < ix.n)) return out;
    const band = ix.bands[k];
    for (let i = 0; i < band.length; i += 5) {
      const ay = band[i + 2], by = band[i + 4];
      if ((ay > y) === (by > y)) continue;
      const id = band[i], x = band[i + 1] + ((y - ay) / (by - ay)) * (band[i + 3] - band[i + 1]);
      const xs = out.get(id);
      if (xs) xs.push(x); else out.set(id, [x]);
    }
    for (const xs of out.values()) xs.sort((a, b) => a - b);
    return out;
  }

  // What a shetach's label says in the current mode; the short forms are for where it has no room. A head shliach is
  // never shortened to his last name (the owner's rule): the full name, or, for someone with middle names, just the
  // first and last name ("Yosef Yitzchak Aharonov" → "Yosef Aharonov"); where neither fits, no name until zoomed in.
  // Leadership entries and families ("Hanholo of Chabad Lubavitch UK", "Pinson family") are never shortened.
  function shetachLabel(s) {
    if (state.labels === 'name') return { text: s.name, short: s.short, missing: false };
    const person = state.labels === 'last' ? s.lastName : s.headShliach;
    if (!person) return { text: s.name, short: s.short, missing: true };
    return { text: person, short: state.labels === 'full' ? firstAndLast(s) : null, missing: false };
  }
  function firstAndLast(s) {
    if (s.firstLast !== undefined) return s.firstLast;
    const words = (s.headShliach || '').trim().split(/\s+/);
    if (s.headTitle || words.length < 3 || /[;—]|\b(family|of)\b/i.test(s.headShliach)) return null;
    return `${words[0]} ${words[words.length - 1]}`;
  }

  // A name on two lines, split at the space or hyphen that makes the lines most even.
  function twoLines(text) {
    let best = null;
    for (let i = 1; i < text.length - 1; i++) {
      if (text[i] !== ' ' && text[i] !== '-') continue;
      const lines = [text.slice(0, text[i] === '-' ? i + 1 : i), text.slice(i + 1)];
      const worst = Math.max(lines[0].length, lines[1].length);
      if (!best || worst <= best.worst) best = { worst, lines };
    }
    return best && best.lines;
  }

  const MARK_FONT = 12;
  const LINE = 1.2; // line height of two-line labels, in font sizes
  const GLYPH = 0.95; // how tall a line of letters really is, in font sizes
  function buildLabels() {
    labels = [];
    if (state.labels !== 'off') {
      if (state.borders === 'regular') V.states.forEach((r, id) => { if (r.anchor) labels.push({ text: r.p.name, short: r.p.abbr, missing: false, a: r.anchor, id, r }); });
      else {
        const ix = labelIndex();
        V.regions.forEach((r, id) => {
          if (!r.anchor) return;
          for (const cl of r.clusters || (r.clusters = labelClusters(r, id, ix))) labels.push({ ...shetachLabel(r.s), a: cl.a, id, r, cl });
        });
      }
    }
    // Each label's forms, most wanted first: the name on one line, on two, then each short form in turn (The Carolinas
    // → Carolinas → Car.), with how wide and tall each is per pixel of font size.
    const family = getComputedStyle(document.documentElement).getPropertyValue('--font-map');
    for (const L of labels) {
      measure.font = `${L.missing ? 500 : 700} 100px ${family}`;
      const unit = (t) => (measure.measureText(t).width + 0.01 * 100 * t.length) / 100; // letter-spacing .01em
      // height: the letters themselves (capitals and descenders, about 0.95 em), plus a line's pitch for a second line
      const form = (lines, kind) => ({ lines, kind, wu: d3.max(lines, unit), hu: GLYPH + (lines.length - 1) * LINE });
      const two = twoLines(L.text);
      L.forms = [form([L.text], 'name'), ...(two ? [form(two, 'two')] : []),
        ...[].concat(L.short || []).filter((t) => t && t !== L.text).map((t) => form([t], 'short'))];
    }
    labels.sort((a, b) => b.a.area - a.a.area);
    for (const box of insetBoxes) {
      const g = box.piece, s = shetachOf(g);
      const L = state.labels === 'off' ? null : state.borders === 'regular' || !s ? { text: g.properties.name, missing: false } : shetachLabel(s);
      box.caption.text(L ? L.text : '').classed('lab-missing', !!(L && L.missing));
    }
  }

  // How names grow during a zoom, until they're placed (and sized) again when it ends.
  const fontScale = (k) => clamp(Math.pow(k, 0.4), 0.8, 2.6);
  const overlaps = (box, boxes) => boxes.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]);

  // Capital stars on screen now. They shrink when the whole map is small (a phone, zoomed out).
  const STAR_FULL = 0.19; // screen pixels per km at which stars are full size (a desktop's whole-map view)
  function starsNow() {
    if (!state.capitals) return [];
    const f = clamp((V.pxPerKm * T.k) / STAR_FULL, 0.55, 1), out = [];
    for (const c of V.caps) {
      const [sx, sy] = T.apply([c.x, c.y]);
      if (sx < -12 || sx > W + 12 || sy < -12 || sy > H + 12) continue;
      const r = (c.world ? 11 : 7) * f;
      out.push({ kind: 'cap', c, f, r, sx, sy, box: [sx - r, sy - r, sx + r, sy + r] });
    }
    return out;
  }

  // The panel and zoom buttons, in map-screen coordinates: nothing is placed under them.
  // An Alaska/Hawaii box as it is now on screen (it shrinks toward its corner when zoomed in).
  function insetRect(b) {
    const sc = T.k > 1.3 ? 0.6 : 1, [ox, oy] = insetOrigin;
    return [ox + (b.x - ox) * sc, oy + (b.y - oy) * sc, ox + (b.x + b.w - ox) * sc, oy + (b.y + b.h - oy) * sc];
  }
  function coveredRects() {
    const app = $('#app').getBoundingClientRect();
    const rects = [...document.querySelectorAll('#panel, #zoomctl')].map((el) => {
      const r = el.getBoundingClientRect();
      return [r.left - app.left, r.top - app.top, r.right - app.left, r.bottom - app.top];
    });
    if (!V.physical) for (const b of insetBoxes) rects.push(insetRect(b));
    return rects;
  }

  // How much of a w×h label centred at screen (cx, cy) lies on its own area me (0-1), checked along five rows through
  // the label; null if it comes within gap px of any other area. Water is fine: a label may cross a gulf or a strait
  // between two parts of its own shetach.
  const ROWS = [0, -0.42, 0.42, -0.21, 0.21]; // in label heights
  function ownShare(ix, me, cx, cy, w, h, gap = 2) {
    const k = T.k, x0 = cx - w / 2, x1 = cx + w / 2;
    let on = 0;
    for (const t of ROWS) {
      for (const [id, xs] of crossings(ix, (cy + t * h - T.y) / k)) {
        for (let i = 0; i + 1 < xs.length; i += 2) {
          const a = T.x + xs[i] * k, b = T.x + xs[i + 1] * k;
          if (id === me) on += Math.max(0, Math.min(x1, b) - Math.max(x0, a));
          else if (a < x1 + gap && b > x0 - gap) return null;
        }
      }
    }
    return on / (w * ROWS.length);
  }

  // A ring clipped to a box (Sutherland–Hodgman; the box is convex, the ring needn't be).
  function clipRing(ring, [bx0, by0, bx1, by1]) {
    const sides = [
      [(q) => q[0] >= bx0, (a, b) => [bx0, a[1] + ((bx0 - a[0]) * (b[1] - a[1])) / (b[0] - a[0])]],
      [(q) => q[0] <= bx1, (a, b) => [bx1, a[1] + ((bx1 - a[0]) * (b[1] - a[1])) / (b[0] - a[0])]],
      [(q) => q[1] >= by0, (a, b) => [a[0] + ((by0 - a[1]) * (b[0] - a[0])) / (b[1] - a[1]), by0]],
      [(q) => q[1] <= by1, (a, b) => [a[0] + ((by1 - a[1]) * (b[0] - a[0])) / (b[1] - a[1]), by1]],
    ];
    let pts = ring;
    for (const [inside, cut] of sides) {
      const out = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length], ai = inside(a), bi = inside(b);
        if (ai) out.push(a);
        if (ai !== bi) out.push(cut(a, b));
      }
      pts = out;
      if (pts.length < 3) return [];
    }
    return pts;
  }

  // The part of an area on screen: its land's area and centre of mass (in a gulf, for land wrapped around one), and the
  // convex hull around it all, which a label mustn't leave. Map pixels; tiny outlying islands don't stretch the hull.
  // An area's polygons with only the points that show at this zoom (no two within about half a screen pixel), made
  // once per zoom level: the outlines a label needs, at a fraction of the work.
  function polysAt(polys) {
    const L = levelFor(T.k), cache = polys.simple || (polys.simple = []);
    if (cache[L]) return cache[L];
    const tol = 0.5 / 2 ** L;
    return (cache[L] = polys.map((rings) => rings.map((ring) => {
      const out = [ring[0]];
      let [px, py] = ring[0];
      for (let i = 1; i < ring.length; i++) {
        const [x, y] = ring[i];
        if (Math.abs(x - px) + Math.abs(y - py) < tol && i < ring.length - 1) continue;
        out.push(ring[i]);
        px = x; py = y;
      }
      return out;
    })));
  }
  function visiblePart(allPolys, box) {
    const parts = [], polys = polysAt(allPolys);
    for (const rings of polys) {
      const outer = box ? clipRing(rings[0], box) : rings[0];
      if (outer.length < 3) continue;
      const holes = rings.slice(1).map((r) => (box ? clipRing(r, box) : r)).filter((r) => r.length >= 3);
      const area = Math.abs(d3.polygonArea(outer)) - d3.sum(holes, (h) => Math.abs(d3.polygonArea(h)));
      if (area > 0) parts.push({ rings: [outer, ...holes], area, c: d3.polygonCentroid(outer) });
    }
    if (!parts.length) return null;
    parts.sort((a, b) => b.area - a.area);
    const total = d3.sum(parts, (q) => q.area);
    const big = parts.filter((q) => q.area >= total * 0.01);
    const hull = d3.polygonHull(big.flatMap((q) => q.rings[0])) || parts[0].rings[0];
    const hullArea = Math.abs(d3.polygonArea(hull));
    // Islands strung across a sea (the Caribbean, Indonesia), with land on little of their hull and no one piece most of
    // it: the name goes in the middle of the whole spread, sized for it, rather than wherever the biggest island pulls
    // the land's centre. (Ecuador and the Galápagos aren't that: the mainland is nearly all of it.)
    const spread = hullArea > 0 && total / hullArea < 0.35 && parts[0].area < total * 0.6;
    return {
      area: spread ? Math.max(total, hullArea * 0.3) : total,
      centre: spread ? d3.polygonCentroid(hull)
        : [d3.sum(big, (q) => q.c[0] * q.area) / d3.sum(big, (q) => q.area), d3.sum(big, (q) => q.c[1] * q.area) / d3.sum(big, (q) => q.area)],
      hull,
    };
  }

  // ---------- label placement ----------
  // Every area's name sized and placed as a cartographer would: the full name wherever it fits at a readable size (on
  // two lines when that's clearly bigger), else its short forms in turn; as big as the area's size on screen calls for
  // and as fits, a little under the most that fits so it has room to breathe; and where it has the most room on every
  // side, near the middle of what's on screen of the area. Room is read off a grid laid over the area: each cell is
  // the area's own land, water inside the hull around its land (a name may cross a gulf or a strait), or blocked —
  // another area, outside the hull, off screen, under the panel, a capital's star or a name placed before it.
  // Biggest areas first.
  const LABEL_MIN = 9, SHORT_MIN = 8; // px: names never smaller; short forms a little smaller still
  const BREATHE = 0.88; // a name is set this much under the most that fits, so it isn't pressed against its edges
  const labelMax = () => (phone() ? 24 : 30);
  // the size an area's name calls for, from its land's size on screen: bigger areas, bigger names
  const capFor = (areaPx) => clamp(5 + Math.sqrt(areaPx) * 0.1, LABEL_MIN, labelMax());
  const padFor = (size) => Math.max(1, size * 0.12); // room kept clear around a name

  // A polygon's extent along the line at height y (screen px).
  function spanAt(poly, y) {
    let lo = Infinity, hi = -Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [x1, y1] = poly[j], [x2, y2] = poly[i];
      if ((y1 > y) === (y2 > y)) continue;
      const x = x1 + ((y - y1) / (y2 - y1)) * (x2 - x1);
      if (x < lo) lo = x;
      if (x > hi) hi = x;
    }
    return [lo, hi];
  }

  // The grid over an area's hull on screen: blocked and water cells, their running totals (so any rectangle's count
  // is four lookups), and each cell's distance in cells to the nearest blocked one.
  const EDGE = 4; // px kept clear of the screen's edge
  function labelGrid(id, hull, ix, obstacles) {
    const k = T.k;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of hull) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    x0 = Math.max(x0, EDGE); y0 = Math.max(y0, EDGE); x1 = Math.min(x1, W - EDGE); y1 = Math.min(y1, H - EDGE);
    if (x1 - x0 < 10 || y1 - y0 < 8) return null;
    const cs = Math.max(1, (x1 - x0) / 60, (y1 - y0) / 60);
    const nx = Math.ceil((x1 - x0) / cs), ny = Math.ceil((y1 - y0) / cs), n = nx * ny;
    const blocked = new Uint8Array(n), water = new Uint8Array(n);
    // cells whose middle is in [a, b] (own land), or that touch it at all (another area: the margin errs on the safe side)
    const centred = (a, b) => [Math.max(0, Math.ceil((a - x0) / cs - 0.5)), Math.min(nx - 1, Math.floor((b - x0) / cs - 0.5))];
    const touched = (a, b) => [Math.max(0, Math.floor((a - x0) / cs)), Math.min(nx - 1, Math.floor((b - x0) / cs))];
    for (let j = 0; j < ny; j++) {
      const y = y0 + (j + 0.5) * cs, row = j * nx, [hl, hr] = spanAt(hull, y);
      for (let i = 0; i < nx; i++) { const x = x0 + (i + 0.5) * cs; if (x >= hl && x <= hr) water[row + i] = 1; else blocked[row + i] = 1; }
      const cr = crossings(ix, (y - T.y) / k), own = cr.get(id);
      if (own) for (let q = 0; q + 1 < own.length; q += 2) {
        const [i0, i1] = centred(T.x + own[q] * k, T.x + own[q + 1] * k);
        for (let i = i0; i <= i1; i++) { blocked[row + i] = 0; water[row + i] = 0; }
      }
      for (const [other, xs] of cr) {
        if (other === id) continue;
        for (let q = 0; q + 1 < xs.length; q += 2) {
          const [i0, i1] = touched(T.x + xs[q] * k, T.x + xs[q + 1] * k);
          for (let i = i0; i <= i1; i++) { blocked[row + i] = 1; water[row + i] = 0; }
        }
      }
    }
    for (const b of obstacles) {
      if (b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1) continue;
      const [i0, i1] = touched(b[0], b[2]);
      const j0 = Math.max(0, Math.floor((b[1] - y0) / cs)), j1 = Math.min(ny - 1, Math.floor((b[3] - y0) / cs));
      for (let j = j0; j <= j1; j++) blocked.fill(1, j * nx + i0, j * nx + i1 + 1);
    }
    const sat = (a) => {
      const t = new Int32Array((nx + 1) * (ny + 1));
      for (let j = 0; j < ny; j++) { let run = 0; for (let i = 0; i < nx; i++) { run += a[j * nx + i]; t[(j + 1) * (nx + 1) + i + 1] = t[j * (nx + 1) + i + 1] + run; } }
      return t;
    };
    // chessboard distance to the nearest blocked cell (the grid's edge counts as blocked)
    const dt = new Int16Array(n);
    for (let c = 0; c < n; c++) dt[c] = blocked[c] ? 0 : 32000;
    const at = (i, j) => (i < 0 || j < 0 || i >= nx || j >= ny ? 0 : dt[j * nx + i]);
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const c = j * nx + i;
      if (dt[c]) dt[c] = Math.min(dt[c], at(i - 1, j) + 1, at(i - 1, j - 1) + 1, at(i, j - 1) + 1, at(i + 1, j - 1) + 1);
    }
    for (let j = ny - 1; j >= 0; j--) for (let i = nx - 1; i >= 0; i--) {
      const c = j * nx + i;
      if (dt[c]) dt[c] = Math.min(dt[c], at(i + 1, j) + 1, at(i + 1, j + 1) + 1, at(i, j + 1) + 1, at(i - 1, j + 1) + 1);
    }
    return { x0, y0, cs, nx, ny, blocked, dt, B: sat(blocked), WT: sat(water) };
  }

  // One label: which form, what size, where; null if nothing fits.
  function placeOne(L, part, ix, obstacles) {
    const k = T.k, hull = part.hull.map((pt) => T.apply(pt)), [ax, ay] = T.apply(part.centre);
    const g = labelGrid(L.id, hull, ix, obstacles);
    if (!g) return null;
    const { x0, y0, cs, nx, ny, blocked, dt, B, WT } = g;
    const cx = (c) => x0 + ((c % nx) + 0.5) * cs, cy = (c) => y0 + (Math.floor(c / nx) + 0.5) * cs;
    const cells = (b) => [Math.floor((b[0] - x0) / cs), Math.floor((b[1] - y0) / cs), Math.floor((b[2] - x0) / cs), Math.floor((b[3] - y0) / cs)];
    const sum = (t, [i0, j0, i1, j1]) => t[(j1 + 1) * (nx + 1) + i1 + 1] - t[j0 * (nx + 1) + i1 + 1] - t[(j1 + 1) * (nx + 1) + i0] + t[j0 * (nx + 1) + i0];
    const clear = (b) => { const r = cells(b); return r[0] >= 0 && r[1] >= 0 && r[2] < nx && r[3] < ny && sum(B, r) === 0; };
    const boxAt = (c, w, h, m) => [cx(c) - w / 2 - m, cy(c) - h / 2 - m, cx(c) + w / 2 + m, cy(c) + h / 2 + m];
    // the free cells, and how far each is from the middle of what's on screen (sideways counts a little less)
    const d2 = new Float32Array(nx * ny), order = [];
    for (let c = 0; c < nx * ny; c++) {
      if (blocked[c]) continue;
      const dx = cx(c) - ax, dy = (cy(c) - ay) * 1.3;
      d2[c] = dx * dx + dy * dy;
      order.push(c);
    }
    const need = (w, h) => Math.max(0, Math.floor(Math.min(w, h) / 2 / cs) - 1); // a centre any nearer the blocked can't hold it
    const fitsAt = (f, s) => {
      const w = f.wu * s, h = f.hu * s, m = padFor(s), dmin = need(w, h);
      for (const c of order) if (dt[c] >= dmin && clear(boxAt(c, w, h, m))) return true;
      return false;
    };
    // the biggest size from lo up to hi at which a form fits anywhere (0 if not even at lo)
    const biggest = (f, lo, hi) => {
      if (!fitsAt(f, lo)) return 0;
      if (fitsAt(f, hi)) return hi;
      let a = lo, b = hi;
      for (let t = 0; t < 6; t++) { const mid = (a + b) / 2; if (fitsAt(f, mid)) a = mid; else b = mid; }
      return a;
    };
    const cap = capFor(part.area * k * k), top = Math.max(LABEL_MIN, cap / BREATHE);
    // the forms to try, in order, each with the most it fits at: the name (on two lines when they're clearly bigger),
    // the other way of setting the name, then each short form
    const one = L.forms[0], two = L.forms.find((f) => f.kind === 'two');
    const s1 = biggest(one, LABEL_MIN, top), s2 = two ? biggest(two, LABEL_MIN, top) : 0;
    const tries = s1 && !(s2 > s1 * 1.15) ? [[one, s1], [two, s2]] : [[two, s2], [one, s1]]; // two lines only when clearly bigger
    const tried = tries.filter(([f, sz]) => f && sz).map(([f, sz]) => [f, sz, LABEL_MIN]);
    for (const f of L.forms.filter((x) => x.kind === 'short')) tried.push([f, null, SHORT_MIN]);
    // where it has the most room on every side (up to about a letter's height), near the middle, on land rather than water
    const spotAt = (form, s) => {
      const w = form.wu * s, h = form.hu * s, m = padFor(s), dmin = need(w, h), cands = [];
      for (const c of order) {
        if (dt[c] < dmin) continue;
        if (!clear(boxAt(c, w, h, m))) continue;
        let room = m;
        for (const e of [0.3, 0.6, 1, 1.4]) { if (clear(boxAt(c, w, h, m + e * s))) room = m + e * s; else break; }
        const r = cells(boxAt(c, w, h, 0)), wet = sum(WT, r) / ((r[2] - r[0] + 1) * (r[3] - r[1] + 1));
        cands.push({ c, score: Math.min(room, s * 1.4) - 0.3 * Math.sqrt(d2[c]) - wet * s * 0.8 });
      }
      cands.sort((a, b) => b.score - a.score);
      for (const { c } of cands.slice(0, 40)) {
        const x = cx(c), y = cy(c);
        if (ownShare(ix, L.id, x, y, w, h, m) === null) continue; // the grid's verdict, checked exactly against the borders
        return { form, size: s, x, y, box: [x - w / 2 - 3, y - h / 2 - 2, x + w / 2 + 3, y + h / 2 + 2] };
      }
      return null;
    };
    for (const [form, known, min] of tried) {
      const most = known || biggest(form, min, Math.max(min, top));
      if (!most) continue;
      for (const s of new Set([Math.max(min, Math.min(cap, most * BREATHE)), most])) {
        const spot = spotAt(form, s);
        if (spot) return spot;
      }
    }
    return null;
  }

  function placeLabels() {
    const k = T.k, stars = starsNow(), covered = coveredRects(), p = insets(), ix = labelIndex();
    const boxes = [], fixed = [...stars.map((st) => st.box), ...covered];
    const view = [(p.l - T.x) / k, (p.t - T.y) / k, (W - p.r - T.x) / k, (H - p.b - T.y) / k]; // map pixels
    const todo = [];
    for (const L of labels) {
      L.show = null;
      const [bx0, by0, bx1, by1] = L.a.bbox;
      if (bx1 < view[0] || bx0 > view[2] || by1 < view[1] || by0 > view[3]) continue;
      const whole = bx0 >= view[0] && bx1 <= view[2] && by0 >= view[1] && by1 <= view[3];
      const cl = L.cl || L.r, polys = L.cl ? L.cl.polys : L.r.polysXY;
      if (whole && !cl.whole) cl.whole = visiblePart(polys, null);
      const part = whole ? cl.whole : visiblePart(polys, view);
      if (part && L.cl && L.cl.core) {
        // the name goes on the shetach's main part while that's in view (more than a few hundred px² of it): centred on
        // it and kept within it (Alberta's name on Alberta itself, in every label mode, never up in the territories' strip)
        const core = visiblePart(L.cl.core, view);
        if (core && core.area * k * k > 500) { part.centre = core.centre; if (!L.cl.soft) part.hull = core.hull; part.area = Math.max(core.area, part.area * 0.5); }
      }
      if (part) todo.push({ L, part });
    }
    todo.sort((a, b) => b.part.area - a.part.area); // the biggest on screen choose first
    for (const { L, part } of todo) {
      const spot = placeOne(L, part, ix, [...fixed, ...boxes]);
      if (!spot) continue;
      Object.assign(L, { show: spot.form, px: spot.size, k0: k, mx: (spot.x - T.x) / k, my: (spot.y - T.y) / k });
      boxes.push(spot.box);
    }
    gLabels.selectAll('text').data(labels.filter((L) => L.show)).join('text')
      .attr('class', (L) => (L.missing ? 'lab lab-missing' : 'lab'))
      .each(function (L) {
        const n = L.show.lines.length;
        d3.select(this).selectAll('tspan').data(L.show.lines).join('tspan')
          .attr('x', 0).attr('dy', (t, i) => `${i ? LINE : (-(n - 1) / 2) * LINE}em`).text((t) => t);
      });
    placeMarks(boxes, stars, covered);
    moveLabels();
  }

  function placeMarks(boxes, stars, covered) {
    const taken = [...boxes, ...covered];
    // Right of the marker, else left, above, below; the whole label on screen and clear of everything placed so far.
    const spot = (sx, sy, gap, w) => {
      const h = MARK_FONT + 2;
      for (const [dx, dy, anchor] of [[gap, 0, 'start'], [-gap, 0, 'end'], [0, -gap - h / 2, 'middle'], [0, gap + h / 2, 'middle']]) {
        const x0 = anchor === 'start' ? sx + dx : anchor === 'end' ? sx + dx - w : sx - w / 2;
        const box = [x0 - 2, sy + dy - h / 2, x0 + w + 2, sy + dy + h / 2];
        if (box[0] >= 0 && box[2] <= W && box[1] >= 0 && box[3] <= H && !overlaps(box, taken)) return { dx, dy, anchor, box };
      }
      return null;
    };
    marks = [];
    taken.push(...stars.map((st) => st.box));
    if (state.cities) {
      const px = V.pxPerKm * T.k, least = CITY_DENSITY / (px * px);
      for (const c of V.cities) {
        if (c.weight < least) break;
        const [sx, sy] = T.apply([c.x, c.y]);
        if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
        const ring = [sx - 4, sy - 4, sx + 4, sy + 4];
        // A city right at a capital's star is marked by the star, with the city's name beside it.
        const star = stars.find((st) => !st.city && overlaps(ring, [st.box]));
        if (star) {
          const at = spot(star.sx, star.sy, star.r + 2, c.widths[0]);
          if (!at) continue;
          star.city = c;
          taken.push(at.box);
          marks.push({ kind: 'city', c, at, text: c.texts[0], anchor: star.c });
          continue;
        }
        if (overlaps(ring, taken)) continue;
        const at = spot(sx, sy, 6, c.widths[0]);
        if (!at) continue;
        taken.push(ring, at.box);
        marks.push({ kind: 'city', c, at, text: c.texts[0] });
      }
    }
    marks.push(...stars); // drawn last, on top
    gMarks.selectAll('g').remove();
    for (const m of marks) {
      const g = gMarks.append('g').attr('class', 'mk').datum(m);
      if (m.kind === 'cap') g.append('path').attr('class', 'mk-cap').attr('d', m.c.world ? WORLD_STAR : STAR).attr('transform', `scale(${m.f})`);
      else if (!m.anchor) g.append('circle').attr('class', 'mk-city').attr('r', 3);
      if (m.at) g.append('text').attr('class', 'mk-lab').attr('x', m.at.dx).attr('y', m.at.dy).attr('text-anchor', m.at.anchor).text(m.text);
    }
  }

  function moveLabels() {
    gLabels.selectAll('text').each(function (L) {
      const [sx, sy] = T.apply([L.mx, L.my]);
      const px = L.px * (fontScale(T.k) / fontScale(L.k0)); // during a zoom, until they're placed again
      this.setAttribute('transform', `translate(${sx},${sy})`);
      this.style.fontSize = `${px}px`;
      this.style.strokeWidth = `${Math.max(2, px * 0.2)}px`;
    });
    gMarks.selectAll('g').each(function (m) {
      const at = m.anchor || m.c;
      const [sx, sy] = T.apply([at.x, at.y]);
      this.setAttribute('transform', `translate(${sx},${sy})`);
    });
  }

  // ---------- drawing (political map) ----------
  const dotBase = (d) => 1.9 + 0.55 * Math.log2(d.centers.length);
  const dotRadius = (d, k) => dotBase(d) * Math.pow(k, 0.35); // screen pixels
  let pal = null, hover = null, drawQueued = 0;
  function readPalette() {
    const css = getComputedStyle($('#map'));
    const v = (name) => css.getPropertyValue(name).trim();
    pal = { c: d3.range(8).map((i) => v(`--c${i + 1}`)), plain: v('--plain'), ink: v('--map-ink'), dot: v('--map-dot'), accent: v('--map-accent') };
  }
  function requestDraw() { if (!drawQueued) drawQueued = requestAnimationFrame(draw); }
  function draw() {
    drawQueued = 0;
    if (!V || V.physical) return;
    if (!pal) readPalette();
    const k = T.k, L = levelFor(k);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR * k, 0, 0, DPR * k, DPR * T.x, DPR * T.y);
    const vx0 = -T.x / k, vy0 = -T.y / k, vx1 = (W - T.x) / k, vy1 = (H - T.y) / k;
    const seen = (b) => b[2] >= vx0 && b[0] <= vx1 && b[3] >= vy0 && b[1] <= vy1;

    // fills: shetachim (blank parts of states stay unfilled), or states with States borders
    ctx.globalAlpha = state.borders === 'both' && state.lighter === 'shetach' ? 0.55 : 1;
    for (const r of state.borders === 'regular' ? V.states : V.regions) {
      ctx.fillStyle = state.color === 'plain' ? pal.plain : pal.c[r.color];
      for (const poly of r.polys) if (seen(poly.box)) ctx.fill(polyPath(poly, L), 'evenodd');
    }
    // borders
    const both = state.borders === 'both', lightR = both && state.lighter === 'regular', lightS = both && state.lighter === 'shetach';
    ctx.strokeStyle = pal.ink;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const [kind, width, on, alpha, dash] of [
      ['coast', 1.1, true, 1],
      ['regular', 1, state.borders !== 'shetach', lightR ? 0.35 : 1, both ? [2, 3] : null],
      ['country', 1.8, state.borders !== 'shetach', lightR ? 0.35 : 1],
      ['shetach', 1.3, state.borders !== 'regular', lightS ? 0.3 : 1],
    ]) {
      if (!on) continue;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width / k;
      ctx.setLineDash(dash ? dash.map((d) => d / k) : []);
      for (const cell of V.mesh[kind]) if (seen(cell.box)) ctx.stroke(cellPath(cell, L));
    }
    ctx.setLineDash([]);
    // the outline of the area a card is about
    if (hover && hover.area) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = pal.accent;
      ctx.lineWidth = 2.5 / k;
      for (const poly of hover.area.polys) if (seen(poly.box)) ctx.stroke(polyPath(poly, L));
    }
    // dots, in screen pixels
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (state.dots) {
      const f = Math.pow(k, 0.35);
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = pal.dot;
      ctx.beginPath();
      for (const d of V.dots) {
        const x = T.x + d.x * k, y = T.y + d.y * k, r = dotBase(d) * f;
        if (x < -r || y < -r || x > W + r || y > H + r) continue;
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, 2 * Math.PI);
      }
      ctx.fill();
      if (hover && hover.dot) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = pal.accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(T.x + hover.dot.x * k, T.y + hover.dot.y * k, dotRadius(hover.dot, k) + 2.5, 0, 2 * Math.PI);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  // Which area a point (map pixels, zoom 1) is in — a state with States borders, else a shetach or the blank part
  // of a state — as one of its pieces (all a card needs).
  function pieceAtMap(x, y) {
    for (const r of state.borders === 'regular' ? V.states : [...V.regions, ...V.blanks]) {
      for (let i = 0; i < r.polys.length; i++) {
        const b = r.polys[i].box;
        if (x < b[0] || x > b[2] || y < b[1] || y > b[3]) continue;
        let inside = false;
        for (const ring of r.polysXY[i]) if (d3.polygonContains(ring, [x, y])) inside = !inside;
        if (inside) return r.g;
      }
    }
    return null;
  }

  // ---------- zoom (political map) ----------
  let frame = 0;
  const zoom = d3.zoom().scaleExtent([1, 60])
    .on('start', (e) => { if (e.sourceEvent && !pinned) hideCard(); })
    .on('zoom', (e) => {
      if (V && V.physical) return; // the physical map moves itself (syncCamera)
      T = e.transform;
      requestDraw();
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; moveLabels(); gInsets.classed('away', T.k > 1.3); });
    // (the boxes' size changes with the zoom, so the names around them are placed again when it ends)
    })
    .on('end', () => { if (!V.physical) placeLabels(); });
  svg.call(zoom);

  // Move either map to zoom transform t.
  function setView(t, ms) {
    if (V.physical) {
      const cam = cameraFor(t);
      if (ms && !still) mapgl.easeTo({ ...cam, duration: ms }); else mapgl.jumpTo(cam);
    } else {
      (ms && !still ? svg.transition().duration(ms) : svg).call(zoom.transform, t);
    }
  }
  function zoomToBounds([[x0, y0], [x1, y1]]) {
    const p = insets();
    const w = W - p.l - p.r, h = H - p.b - p.t;
    const k = clamp(0.9 / Math.max((x1 - x0) / w, (y1 - y0) / h), 1, 60);
    setView(d3.zoomIdentity.translate(p.l + w / 2 - (k * (x0 + x1)) / 2, p.t + h / 2 - (k * (y0 + y1)) / 2).scale(k), 750);
  }
  function zoomBy(factor) {
    if (V.physical) (factor > 1 ? mapgl.zoomIn : mapgl.zoomOut).call(mapgl, { duration: still ? 0 : 300 });
    else svg.transition().duration(still ? 0 : 300).call(zoom.scaleBy, factor);
  }
  $('#zin').addEventListener('click', () => zoomBy(1.7));
  $('#zout').addEventListener('click', () => zoomBy(1 / 1.7));
  $('#zreset').addEventListener('click', () => setView(d3.zoomIdentity, 600));

  // ---------- physical map (MapLibre GL + OpenFreeMap tiles, loaded the first time it's picked) ----------
  // A full map (land cover and relief, water, roads, places) with our borders, names, cities and dots on it.
  const GL_JS = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js';
  const GL_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
  const EMPTY = { type: 'FeatureCollection', features: [] };
  const FADE = '#eef0ec'; // over land outside the shown shetachim
  let mapgl = null, glStarting = null;

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('the map library did not load'));
      document.head.appendChild(s);
    });
  }
  const withTimeout = (promise, ms, what) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(what)), ms))]);

  // Resolves once the style has loaded; rejects if the library, WebGL or the tiles are unavailable.
  function startGL() {
    if (glStarting) return glStarting;
    glStarting = (async () => {
      if (!window.maplibregl) await withTimeout(loadScript(GL_JS), 20000, 'the map library took too long');
      const m = new maplibregl.Map({
        container: 'basemap', style: GL_STYLE, attributionControl: false, renderWorldCopies: false,
        dragRotate: false, pitchWithRotate: false, touchPitch: false, maxZoom: 18.5, fadeDuration: 150,
      });
      mapgl = m;
      m.addControl(new maplibregl.AttributionControl({ compact: true }), 'top-right');
      m.touchZoomRotate.disableRotation();
      m.keyboard.disableRotation();
      m.on('style.load', () => { addOverlay(); if (V && V.physical) { dataGL(); styleGL(); } });
      let styled = false;
      await withTimeout(new Promise((resolve, reject) => {
        m.once('style.load', () => { styled = true; resolve(); });
        m.on('error', (e) => { if (!styled) reject(e.error || new Error('map error')); });
      }), 20000, 'the map took too long');
      mapgl.on('move', syncCamera);
      mapgl.on('moveend', () => { if (V.physical) placeLabels(); });
      mapgl.on('movestart', () => { if (!pinned) hideCard(); });
      mapgl.on('mousemove', (e) => {
        if (!V.physical || pinned || e.originalEvent.buttons) return;
        const hit = pickAt(e.point.x, e.point.y, false);
        if (hit) showCard(hit, e.originalEvent, false); else hideCard();
      });
      mapgl.on('mouseout', () => { if (!pinned) hideCard(); });
      mapgl.on('click', (e) => {
        if (!V.physical) return;
        const hit = pickAt(e.point.x, e.point.y, e.originalEvent.pointerType === 'touch' || coarse());
        if (!hit) { hideCard(); return; }
        pinned = hit;
        showCard(hit, e.originalEvent, true);
      });
    })();
    glStarting.catch(() => {
      if (mapgl) mapgl.remove();
      mapgl = null;
      glStarting = null;
    });
    return glStarting;
  }

  const glReady = () => mapgl && mapgl.getSource('st-dots');

  // Our layers: borders over the streets but under the map's own labels; a fade over land outside the shown
  // shetachim (under the water, so seas stay blue) and a lighter one over everything outside; the dots and
  // the hover rings on top. Names, cities and capitals stay in the SVG.
  function addOverlay() {
    if (mapgl.getSource('st-dots')) return;
    const layers = mapgl.getStyle().layers;
    const lastRoad = layers.map((l) => l.type === 'line' && l['source-layer'] === 'transportation').lastIndexOf(true);
    const lineBefore = (layers.find((l, i) => i > lastRoad && l.type === 'symbol') || {}).id;
    const waterBefore = (layers.find((l) => ['water', 'waterway'].includes(l['source-layer'])) || {}).id;
    // Borders and the land to fade come as ready-made tiles (the build's web/tiles/): each zoom's tiles are already
    // simplified for it and only the ones on screen load, so a phone never handles the whole world at once.
    mapgl.addSource('st', { type: 'vector', tiles: [fresh(`${new URL('.', location.href).href}tiles/{z}/{x}/{y}.pbf`)], minzoom: 0, maxzoom: 6 });
    mapgl.addSource('st-hover-area', { type: 'geojson', data: EMPTY });
    for (const id of ['st-dots', 'st-hover-dot']) mapgl.addSource(id, { type: 'geojson', data: EMPTY });
    mapgl.addLayer({ id: 'st-fade-land', type: 'fill', source: 'st', 'source-layer': 'land', paint: { 'fill-color': FADE, 'fill-opacity': 0.72, 'fill-antialias': false } }, waterBefore);
    mapgl.addLayer({ id: 'st-line-casing', type: 'line', source: 'st', 'source-layer': 'lines', layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 4.5, 'line-opacity': 0.5 } }, lineBefore);
    for (const kind of ['coast', 'lake', 'regular', 'country', 'shetach']) {
      mapgl.addLayer({ id: `st-line-${kind}`, type: 'line', source: 'st', 'source-layer': 'lines', layout: { 'line-join': 'round', 'line-cap': 'round' } }, lineBefore);
    }
    mapgl.addLayer({ id: 'st-fade-top', type: 'fill', source: 'st', 'source-layer': 'land', paint: { 'fill-color': FADE, 'fill-opacity': 0.3, 'fill-antialias': false } });
    // Place names in English (Latin letters) rather than each country's own script.
    const latin = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']];
    for (const l of layers) {
      if (l.type === 'symbol' && l.layout && /"name/.test(JSON.stringify(l.layout['text-field'] || ''))) mapgl.setLayoutProperty(l.id, 'text-field', latin);
    }
    mapgl.addLayer({ id: 'st-hover-area', type: 'line', source: 'st-hover-area', paint: { 'line-width': 2.5 } });
    mapgl.addLayer({ id: 'st-dots', type: 'circle', source: 'st-dots' });
    mapgl.addLayer({ id: 'st-hover-dot', type: 'circle', source: 'st-hover-dot', paint: { 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-width': 2 } });

    // Richer natural colours: the Natural Earth relief (greens, desert tans, ice) stays strong out to the
    // state level and fades out under the streets, and woods and grass read as green further in.
    const set = (id, prop, value) => { if (mapgl.getLayer(id)) mapgl.setPaintProperty(id, prop, value); };
    if (mapgl.getLayer('natural_earth')) {
      mapgl.setLayerZoomRange('natural_earth', 0, 12);
      set('natural_earth', 'raster-opacity', ['interpolate', ['linear'], ['zoom'], 0, 0.95, 5, 0.9, 7, 0.75, 9, 0.5, 11, 0.25, 12, 0]);
      set('natural_earth', 'raster-saturation', 0.15);
    }
    set('landcover_wood', 'fill-color', 'hsl(100, 38%, 62%)');
    set('landcover_wood', 'fill-opacity', ['interpolate', ['linear'], ['zoom'], 6, 0.35, 10, 0.6]);
    set('landcover_grass', 'fill-opacity', 0.5);
    set('park', 'fill-color', '#c9e2b3');
  }

  const feature = (geometry, properties = {}) => ({ type: 'Feature', geometry, properties });

  // Which tiles' land and borders the view uses: land outside its countries is faded (c is '' for land that's never
  // shown); a border is drawn by kind when both sides are in the view, and as an outline where only one side is.
  function dataGL() {
    if (!glReady()) return;
    const set = (id, data) => mapgl.getSource(id).setData(data);
    const fc = (features) => ({ type: 'FeatureCollection', features });
    const list = ['literal', V.view.countries];
    const a = ['in', ['get', 'ca'], list], b = ['all', ['has', 'cb'], ['in', ['get', 'cb'], list]];
    // lake: an open edge that's the international boundary in the lakes inside one shetach (Essex County's water,
    // Michigan's on both sides), drawn with the country borders rather than as a maritime line.
    const lake = ['has', 'lk'];
    const filters = {
      coast: ['any', ['all', a, ['!', b], ['!', lake]], ['all', b, ['!', a]]],
      lake: ['all', a, lake],
      regular: ['all', a, b, ['==', ['get', 'ss'], 0], ['==', ['get', 'ca'], ['get', 'cb']]],
      country: ['all', a, b, ['!=', ['get', 'ca'], ['get', 'cb']]],
      shetach: ['all', a, b, ['==', ['get', 'sh'], 0]],
    };
    for (const [kind, f] of Object.entries(filters)) mapgl.setFilter(`st-line-${kind}`, f);
    mapgl.setFilter('st-line-casing', filters.shetach);
    const faded = ['!', ['in', ['get', 'c'], list]];
    mapgl.setFilter('st-fade-land', faded);
    mapgl.setFilter('st-fade-top', faded);
    set('st-dots', fc(V.dots.map((d) => feature({ type: 'Point', coordinates: [d.lon, d.lat] }, { r: dotBase(d) }))));
    set('st-hover-area', EMPTY);
    set('st-hover-dot', EMPTY);
  }

  // Paint and visibility for the current options; mirrors the CSS rules of the political map.
  function styleGL() {
    if (!glReady()) return;
    const css = getComputedStyle($('#map'));
    const v = (name) => css.getPropertyValue(name).trim();
    const paint = (id, prop, value) => mapgl.setPaintProperty(id, prop, value);
    const show = (id, on) => mapgl.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    const both = state.borders === 'both';
    const lightS = both && state.lighter === 'shetach', lightR = both && state.lighter === 'regular';
    const ink = v('--map-ink');
    const line = (kind, on, width, opacity) => {
      show(`st-line-${kind}`, on);
      paint(`st-line-${kind}`, 'line-color', ink);
      paint(`st-line-${kind}`, 'line-width', width);
      paint(`st-line-${kind}`, 'line-opacity', opacity);
    };
    line('coast', true, 0.8, 0.35);
    line('lake', state.borders !== 'shetach', 0.8, 0.35);
    line('regular', state.borders !== 'shetach', 1.2, lightR ? 0.35 : 0.8);
    line('country', state.borders !== 'shetach', 2, lightR ? 0.35 : 0.9);
    line('shetach', state.borders !== 'regular', 2, lightS ? 0.3 : 0.9);
    show('st-line-casing', state.borders !== 'regular' && !lightS);
    paint('st-line-regular', 'line-dasharray', both ? [2, 2] : [1, 0]);
    // Same sizes as the political map: grows with zoom like k^0.35, and stops growing at 60x the framed view.
    const r = (dz) => ['*', ['get', 'r'], 2 ** (0.35 * dz)];
    const radius = ['interpolate', ['exponential', 2 ** 0.35], ['zoom'], V.zFit - 2, r(-2), V.zFit + Math.log2(60), r(Math.log2(60))];
    show('st-dots', state.dots);
    paint('st-dots', 'circle-radius', radius);
    paint('st-dots', 'circle-color', v('--map-dot'));
    paint('st-dots', 'circle-opacity', 0.55);
    paint('st-hover-dot', 'circle-radius', radius);
    paint('st-hover-dot', 'circle-stroke-color', v('--map-accent'));
    paint('st-hover-area', 'line-color', v('--map-accent'));
    // The map's own borders and state and country names always give way to ours; its city names do
    // while our cities are on.
    for (const layer of mapgl.getStyle().layers) {
      if (layer['source-layer'] === 'boundary') show(layer.id, false);
      if (layer.type !== 'symbol' || layer['source-layer'] !== 'place') continue;
      show(layer.id, !(/country|state|continent/.test(layer.id) || state.cities));
    }
  }

  // T from the MapLibre camera (no rotation or tilt, so it's a plain scale and shift of the projection).
  function syncCamera() {
    if (!V || !V.physical || !mapgl) return;
    const c = mapgl.getCenter(), k = 2 ** (mapgl.getZoom() - V.zFit);
    const [cx, cy] = projection([c.lng, c.lat]);
    T = d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k);
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; moveLabels(); });
  }
  function cameraFor(t) {
    const [lng, lat] = projection.invert(t.invert([W / 2, H / 2]));
    return { center: [lng, lat], zoom: V.zFit + Math.log2(t.k) };
  }

  async function setBase(value) {
    const msg = $('#base-msg');
    if (value === state.base) { if (msg.className === 'note') msg.hidden = true; return; }
    if (value === 'physical') {
      msg.hidden = false;
      msg.className = 'note';
      msg.textContent = tr('Loading…');
      try {
        await startGL();
      } catch (err) {
        pressed('base', 'political');
        msg.className = 'error';
        msg.textContent = tr(/webgl/i.test(String(err && err.message)) ? "This browser can't show the physical map." : "The physical map couldn't load.");
        return;
      }
      // switched back while it loaded, or a second click already finished the switch
      if (state.base === 'physical' || !$('.seg[data-name="base"] [data-value="physical"]').matches('[aria-pressed="true"]')) { msg.hidden = true; return; }
    }
    msg.hidden = true;
    const focus = focusNow();
    hideCard();
    state.base = value;
    layout({ focus });
    apply();
  }

  // ---------- hover and tap ----------
  const card = $('#card');
  let pinned = null, lastPoint = { clientX: 0, clientY: 0 };

  // What's under a screen point: a capital star, a dot, a city, or an area.
  function pickAt(mx, my, touch, target) {
    const reach = touch ? 14 : 8;
    const box = !V.physical && insetBoxes.find((b) => { const [x0, y0, x1, y1] = insetRect(b); return mx >= x0 && mx <= x1 && my >= y0 && my <= y1; });
    if (box) {
      if (state.dots) {
        const near = d3.least(box.dots, (d) => { const [x, y] = box.proj([d.lon, d.lat]); return Math.hypot(x - mx, y - my); });
        if (near) { const [x, y] = box.proj([near.lon, near.lat]); if (Math.hypot(x - mx, y - my) <= reach) return { dot: near }; }
      }
      return target && target.classList.contains('inset-land') ? { piece: box.piece.properties } : null;
    }
    const where = (m) => T.apply(m.anchor ? [m.anchor.x, m.anchor.y] : [m.c.x, m.c.y]);
    const near = (list, extra = 0) => d3.least(list.filter((m) => { const [x, y] = where(m); return Math.hypot(x - mx, y - my) <= reach + extra; }),
      (m) => { const [x, y] = where(m); return Math.hypot(x - mx, y - my); });
    const cap = near(marks.filter((m) => m.kind === 'cap'), 3);
    if (cap) return { capital: cap.c };
    if (state.dots && tree) {
      const [x, y] = T.invert([mx, my]);
      const d = tree.find(x, y, reach / T.k);
      if (d) return { dot: d };
    }
    const city = near(marks.filter((m) => m.kind === 'city' && !m.anchor));
    if (city) return { city: city.c };
    const [x, y] = T.invert([mx, my]);
    const g = pieceAtMap(x, y);
    return g ? { piece: g.properties } : null;
  }
  function pick(event) {
    const [mx, my] = d3.pointer(event, svg.node());
    return pickAt(mx, my, event.pointerType === 'touch', event.target);
  }

  const count = (n) => (HE ? (n === 1 ? 'מוסד אחד' : `${fmt(n)} מוסדות`) : `${fmt(n)} ${n === 1 ? 'center' : 'centers'}`);
  const chabadLink = (c) => (c && c.slug ? `<a href="https://www.chabad.org/jewish-centers/${esc(c.pageId || c.id)}/${esc(c.slug)}" target="_blank" rel="noopener">${tr('Open on chabad.org')}</a>` : '');
  // withHead: false just names the shetach whose territory this is, without implying its head shliach
  // runs the place — used for 770, which sits in New York City's territory but isn't Tzach's to run.
  function shetachLine(pieceId, withHead = true) {
    const g = pieceById.get(pieceId);
    const s = g && shetachOf(g);
    if (s) return withHead ? `${esc(s.name)} · ${esc(s.headShliach)}` : esc(s.name);
    return g ? esc(g.properties.name) : '';
  }

  // A shetach's flagship center; 770 (world HQ) gets its own wording rather than "of New York City".
  const capKicker = (c) => (c.world ? tr('World Headquarters') : HE ? `המוסד המרכזי של ${esc(c.s.name)}` : `${esc(c.s.name)} flagship center`);

  // Who's listed at a center (chabad.org's own listing, when scripts/chabad-personnel-scrape.js has
  // been run): the first one still living is shown as the shliach; anyone else goes under "+more".
  const personName = (p) => `${[HE && /^rabbi$/i.test(p.title || '') ? 'הרב' : p.title, p.firstName, p.lastName].filter(Boolean).join(' ')}${p.isDeceased ? (HE ? ' ע״ה' : ' obm') : ''}`;
  const personLine = (p) => `${esc(personName(p))}${p.position ? ` <span class="meta">· ${esc(p.position)}</span>` : ''}`;
  function personnelHTML(list) {
    if (!list || !list.length) return '';
    const primary = list.find((p) => !p.isDeceased) || list[0];
    const others = list.filter((p) => p !== primary);
    const more = others.length
      ? `<details class="personnel"><summary>+${others.length} ${HE ? 'נוספים' : 'more'}</summary>${others.map((p) => `<div class="pother">${personLine(p)}</div>`).join('')}</details>` : '';
    return `<p class="person">${personLine(primary)}</p>${more}`;
  }

  function dotHTML(d) {
    const n = d.centers.length;
    const items = d.centers.map((c) => {
      const cap = capitalOfCenter.get(c.id);
      return `<li>
        <strong>${esc(c.name)}</strong>
        <span class="meta">${esc([c.type, c.city].filter(Boolean).join(' · '))}</span>
        ${personnelHTML(c.personnel)}
        ${cap ? `<span class="flag${cap.world ? ' flag-world' : ''}">${capKicker(cap)}</span>` : ''}
        ${chabadLink(c)}
      </li>`;
    }).join('');
    const head = n > 1 ? `<span class="kicker">${HE ? `${n} מוסדות בכתובת זו` : `${n} listings at this address`}</span><h2>${esc(d.centers[0].city || tr('Same address'))}</h2>` : '';
    return `${head}<ul>${items}</ul><div class="foot"><span class="meta">${shetachLine(d.piece)}</span></div>`;
  }

  function capitalHTML(c) {
    return `<span class="kicker${c.world ? ' kicker-world' : ''}">${capKicker(c)}</span><h2>${esc(c.name)}</h2>
      ${c.city ? `<p>${esc(c.city)}</p>` : ''}${personnelHTML(c.center && c.center.personnel)}${chabadLink(c.center)}
      <div class="foot"><span class="meta">${shetachLine(c.piece, !c.world)}</span></div>`;
  }

  function cityHTML(c) {
    const pop = c.pop ? `<p>${tr('Population')} ${fmt(c.pop)}</p>` : '';
    return `<span class="kicker">${tr('City')}</span><h2>${esc(c.name)}</h2>${pop}
      <div class="foot"><span class="meta">${count(c.centers)} · ${shetachLine(c.piece)}</span></div>`;
  }

  const areaKind = (p) => tr(p.country === 'CA' ? 'Province' : p.state.includes('-') ? 'State' : 'Country');
  function areaHTML(p) {
    const g = pieceById.get(p.id), s = shetachOf(g);
    const inMain = V.main.includes(g);
    const zoomBtn = inMain ? `<button type="button" class="zoomto" data-piece="${esc(p.id)}">${tr('Zoom in')}</button>` : '';
    if (state.borders === 'regular' || !s) {
      const inState = [...new Set(pieces.filter((x) => x.properties.state === p.state).map(shetachOf).filter(Boolean))];
      const part = state.borders === 'regular' && inState.length ? `<p>${esc(inState.map((x) => x.name).join(', '))}</p>` : '';
      return `<span class="kicker">${areaKind(p)}</span><h2>${esc(p.name)}</h2>${part}
        <div class="foot"><span class="meta">${count(centersInState(p.state))}</span>${zoomBtn}</div>`;
    }
    const capital = s.capital ? `<p>${tr('Capital:')} ${esc(s.capital.name)}${s.capital.city ? `, ${esc(s.capital.city)}` : ''}</p>` : '';
    return `<h2>${esc(s.name)}</h2>
      <p>${esc(s.headTitle || tr('Head shliach'))}: ${esc(s.headShliach)}</p>${capital}
      <div class="foot"><span class="meta">${count(centersInShetach(s))}</span>${zoomBtn}</div>`;
  }

  function showCard(hit, event, pin) {
    card.innerHTML = (hit.dot ? dotHTML(hit.dot) : hit.capital ? capitalHTML(hit.capital) : hit.city ? cityHTML(hit.city) : areaHTML(hit.piece)) +
      '<button type="button" class="close" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
    card.hidden = false;
    card.classList.toggle('pinned', pin);
    card.classList.toggle('world', !!(hit.capital && hit.capital.world));
    lastPoint = { clientX: event.clientX, clientY: event.clientY };
    if (!phone()) {
      const app = $('#app').getBoundingClientRect();
      const cw = card.offsetWidth, ch = card.offsetHeight;
      let x = event.clientX - app.left + 14, y = event.clientY - app.top + 14;
      if (x + cw > W - 8) x = event.clientX - app.left - cw - 14;
      if (y + ch > H - 8) y = Math.max(8, H - ch - 8);
      card.style.left = `${Math.max(8, x)}px`;
      card.style.top = `${y}px`;
    }
    highlight(hit);
  }
  function hideCard() {
    card.hidden = true;
    pinned = null;
    highlight(null);
  }

  // The area a card is about: its state, its shetach, or the blank part of its state.
  function areaOf(pieceId) {
    const g = pieceById.get(pieceId), s = shetachOf(g);
    if (state.borders === 'regular') return V.states.find((r) => r.st === g.properties.state);
    if (s) return V.regions.find((r) => r.s === s);
    return V.blanks.find((r) => r.st === g.properties.state);
  }
  const boxOf = (r) => r.polys.reduce(([a, b, c, d], { box }) => [Math.min(a, box[0]), Math.min(b, box[1]), Math.max(c, box[2]), Math.max(d, box[3])], [Infinity, Infinity, -Infinity, -Infinity]);
  function highlight(hit) {
    const dot = hit && (hit.dot || (hit.capital && dotOfCenter.get(hit.capital.centerId)));
    const onMain = (id) => V.main.some((g) => g.properties.id === id);
    const area = hit && hit.piece && onMain(hit.piece.id) ? areaOf(hit.piece.id) : null;
    if (V.physical) {
      if (!glReady()) return;
      mapgl.getSource('st-hover-dot').setData(dot && state.dots && onMain(dot.piece) ? feature({ type: 'Point', coordinates: [dot.lon, dot.lat] }, { r: dotBase(dot) }) : EMPTY);
      mapgl.getSource('st-hover-area').setData(area ? feature(topojson.feature(topo, area.ma).geometry) : EMPTY);
      return;
    }
    hover = dot && dot.x !== undefined && onMain(dot.piece) ? { dot } : area ? { area } : null;
    requestDraw();
  }

  svg.on('pointermove', (e) => {
    if (pinned || e.pointerType === 'touch' || e.buttons) return;
    const hit = pick(e);
    if (hit) showCard(hit, e, false);
    else hideCard();
  });
  svg.on('pointerleave', () => { if (!pinned) hideCard(); });
  svg.on('click', (e) => {
    if (e.defaultPrevented) return;
    const hit = pick(e);
    if (!hit) { hideCard(); return; }
    pinned = hit;
    showCard(hit, e, true);
  });
  card.addEventListener('click', (e) => {
    if (e.target.closest('.close')) { hideCard(); return; }
    const z = e.target.closest('.zoomto');
    if (z) {
      const area = areaOf(z.dataset.piece);
      hideCard();
      if (area) { const [x0, y0, x1, y1] = boxOf(area); zoomToBounds([[x0, y0], [x1, y1]]); }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCard(); });

  // ---------- options ----------
  function pressed(name, value) {
    document.querySelectorAll(`.seg[data-name="${name}"] button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
  }
  function apply() {
    svg.attr('class', `borders-${state.borders} lighter-${state.lighter}${state.color === 'plain' ? ' plain' : ''}${state.dots ? '' : ' no-dots'}`);
    $('#app').classList.toggle('physical', V.physical);
    $('#colors-ctl').hidden = V.physical;
    $('#alaska-ctl').hidden = V.physical || !V.view.insets.includes('US-AK');
    gInsets.attr('class', `l-insets${T.k > 1.3 ? ' away' : ''}`);
    $('#lighter-row').hidden = state.borders !== 'both';
    if (V.physical) styleGL();
    readPalette();
    requestDraw();
    buildLabels();
    placeLabels();
    if (pinned) showCard(pinned, lastPoint, true);
  }
  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const name = seg.dataset.name;
    pressed(name, b.dataset.value);
    if (name === 'base') { setBase(b.dataset.value); return; }
    state[name] = b.dataset.value;
    if (name === 'view' || name === 'alaska') { hideCard(); layout(); }
    apply();
  }));
  for (const [id, key] of [['#show-dots', 'dots'], ['#show-cities', 'cities'], ['#show-capitals', 'capitals']]) {
    $(id).addEventListener('change', (e) => { state[key] = e.target.checked; apply(); });
  }
  // Light or dark, whichever the device uses until one is picked here; the pick is remembered.
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const theme = () => document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
  const SUN = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5"/></svg>';
  const MOON = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.6 12.6A7 7 0 0 1 7.4 3.4a7 7 0 1 0 9.2 9.2z"/></svg>';
  function showThemeButton() {
    const dark = theme() === 'dark';
    $('#theme-toggle').innerHTML = dark ? SUN : MOON;
    $('#theme-toggle').setAttribute('aria-label', tr(dark ? 'Light mode' : 'Dark mode'));
  }
  $('#theme-toggle').addEventListener('click', () => {
    const next = theme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('shetachim-theme', next); } catch (e) { /* not remembered, still switched */ }
    showThemeButton();
    readPalette();
    requestDraw();
  });
  darkQuery.addEventListener('change', () => { showThemeButton(); readPalette(); requestDraw(); });
  showThemeButton();

  $('#more').addEventListener('toggle', () => { // the panel's height changed: the zoom buttons and the free map area follow
    document.documentElement.style.setProperty('--sheet', `${$('#panel').getBoundingClientRect().height}px`);
    placeLabels();
  });

  $('#panel-toggle').addEventListener('click', () => {
    const panel = $('#panel');
    const open = panel.classList.toggle('collapsed') === false;
    $('#panel-toggle').setAttribute('aria-expanded', String(open));
    $('#panel-toggle').textContent = tr(open ? 'Close' : 'Options');
    document.documentElement.style.setProperty('--sheet', `${panel.getBoundingClientRect().height}px`);
    placeLabels(); // names keep clear of the sheet
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { layout({ keep: V.physical }); apply(); }, 150); });

  await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise((r) => setTimeout(r, 1500))]);
  layout();
  apply();
  // The physical map is the default; the political map shows first and stays if the physical one can't load.
  setBase('physical');
})();
</script>
</body>
</html>
