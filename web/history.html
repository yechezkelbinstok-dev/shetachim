<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shetachim by Year</title>
<script>try { const q = new URLSearchParams(location.search).get('lang'); if (q) localStorage.setItem('shetachim-lang', q); if ((q || localStorage.getItem('shetachim-lang')) === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; document.title = 'השטחים לפי שנה'; } } catch (e) {}
try { const t = localStorage.getItem('shetachim-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Heebo:wght@400..800&display=swap">
<style>
:root {
  --bg: #eef1ee; --land: #d9ddd8; --ink: #1e2b32; --halo: #ffffff; --muted: #5a6870; --dot: #163e74;
  --panel: #fbfcfb; --panel-line: #d2d9dc; --accent: #1d4f8f; --accent-soft: #e3ebf5;
  --c1: #f0e1a2; --c2: #cce1b5; --c3: #efc7c1; --c4: #c5d9ee; --c5: #f3cfa9; --c6: #d8c8e5; --c7: #bcded6; --c8: #e1d8be;
  --tile: #eef1f3; --honor: #8a6a1e; --honor-line: #c39a3e; --honor-soft: #f6efdc;
  --font: "Inter", "Heebo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgb(20 35 45 / .08), 0 6px 20px rgb(20 35 45 / .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1316; --land: #273034; --ink: #e6edf0; --halo: #0d1316; --muted: #9baab0; --dot: #f1cf78;
    --panel: #152025; --panel-line: #2b3a41; --accent: #93b8ec; --accent-soft: #22344a;
    --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f; --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
    --tile: #1e2b31; --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1316; --land: #273034; --ink: #e6edf0; --halo: #0d1316; --muted: #9baab0; --dot: #f1cf78;
  --panel: #152025; --panel-line: #2b3a41; --accent: #93b8ec; --accent-soft: #22344a;
  --c1: #5a5026; --c2: #394e30; --c3: #5c3a36; --c4: #2e435f; --c5: #5c4228; --c6: #473957; --c7: #294c45; --c8: #494434;
  --tile: #1e2b31; --honor: #e0c278; --honor-line: #c9a24a; --honor-soft: #2b2a20;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; transform-origin: 0 0; }

.year { position: absolute; top: max(10px, env(safe-area-inset-top)); inset-inline-start: 14px; font: 800 44px/1 var(--font); letter-spacing: -.02em; color: var(--ink); text-shadow: 0 0 8px var(--bg), 0 0 3px var(--bg); pointer-events: none; font-variant-numeric: tabular-nums; }
.tools { position: absolute; z-index: 6; top: max(10px, env(safe-area-inset-top)); inset-inline-end: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.row { display: flex; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); font: 600 13px var(--font); height: 34px; min-width: 34px; padding: 0 10px; border-radius: 17px; box-shadow: var(--shadow); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; }
.chip svg { width: 17px; height: 17px; fill: currentColor; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 17px; box-shadow: var(--shadow); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font); height: 28px; padding: 0 11px; border-radius: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.menu { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px; font: 600 13px var(--font); color: var(--ink); cursor: pointer; }
.opt input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 36px; height: 21px; margin: 0; border-radius: 11px; background: var(--panel-line); cursor: pointer; transition: background .2s; }
.opt input::before { content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .25); transition: transform .2s; }
.opt input:checked { background: var(--accent); }
.opt input:checked::before { transform: translateX(15px); }
.bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); width: min(720px, calc(100% - 20px)); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px 10px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; direction: ltr; }
.bar button { appearance: none; border: 0; background: var(--accent-soft); color: var(--accent); width: 38px; height: 38px; border-radius: 19px; flex: none; cursor: pointer; display: grid; place-items: center; }
.bar button svg { width: 18px; height: 18px; fill: currentColor; }
.bar .step { background: transparent; width: 30px; }
#slider { flex: 1; min-width: 0; accent-color: var(--accent); height: 30px; }
.err { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

/* ---- the cards, as on the main map ---- */
#card { position: absolute; z-index: 5; inset-inline-start: 10px; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 66px); width: 300px; max-width: calc(100% - 20px); max-height: calc(100% - 200px); overflow: auto; overscroll-behavior: contain;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; box-sizing: border-box; font-size: 14px; line-height: 1.4; }
#card.world { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
/* (on a phone held upright the shetachim are at the bottom and the empty north at the top: the card goes there) */
#app.narrow #card { top: calc(max(10px, env(safe-area-inset-top)) + 96px); bottom: auto; width: min(420px, calc(100% - 20px)); max-width: none; max-height: 46%; }
#card .close { position: absolute; top: 6px; inset-inline-end: 6px; z-index: 2; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer; }
#card .close:hover { background: var(--accent-soft); }
#card h2 { margin: 0 0 4px; margin-inline-end: 22px; font: 700 16px/1.25 var(--font); text-wrap: balance; }
#card p, #card .meta { margin: 0; color: var(--muted); font-size: 13px; }
#card a { color: var(--accent); font-size: 13px; }
#card .kicker { display: block; margin-bottom: 2px; color: var(--muted); font: 600 10px var(--font); letter-spacing: .08em; text-transform: uppercase; }
#card .kicker-world { color: var(--accent); font-weight: 700; }
#card.world .kicker-world { font-size: 14px; letter-spacing: .06em; margin-bottom: 2px; }
:root[lang="he"] #card .kicker { letter-spacing: 0; }
#card h2.honor-h { font-size: 30px; line-height: 1.1; margin-bottom: 6px; }
#card .hc-head { margin: -10px -12px 12px; padding: 13px 14px 12px; border-bottom: 1px solid var(--panel-line); border-radius: 9px 9px 0 0; background: linear-gradient(180deg, var(--honor-soft), var(--panel) 92%); }
#card .hc-head .kicker { padding-inline-end: 22px; color: var(--honor); font-weight: 700; margin-bottom: 3px; }
#card .hc-head h2 { margin-bottom: 0; letter-spacing: -.01em; }
#card .rebbe { margin: 4px 0 2px; color: var(--ink); font: 700 18px/1.25 var(--font); }
#card .rebbe .role { white-space: nowrap; font-weight: 600; color: var(--muted); }
#card .rebbe.sm { font-size: 15.5px; }
#card .rebbe .hon { white-space: nowrap; }
:root:not([lang="he"]) #card .rebbe .hon { font-size: .88em; }
#card .rb-pic { flex: none; display: block; width: var(--w, 50px); aspect-ratio: 4 / 5; box-sizing: border-box; padding: 3px; border-radius: 2px;
  background: linear-gradient(135deg, #f7e8bb 0%, #c99e47 24%, #f2d998 46%, #9b7428 72%, #dcbb6e 100%);
  box-shadow: 0 2px 6px -1px rgba(60, 40, 8, .45), inset 0 0 0 1px rgba(255, 244, 210, .55); }
#card .rb-pic img { display: block; width: 100%; height: 100%; object-fit: cover; box-shadow: 0 0 0 1px rgba(70, 48, 10, .7); }
#card .rebbe-row { display: flex; flex-direction: row; align-items: center; gap: 12px; margin: 4px 0 2px; }
#card .rebbe-row .rebbe { margin: 0; }
#card .rebbe-row.under { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--panel-line); }
#card .rb-txt { min-width: 0; }
#card .rb-txt .meta { margin-top: 2px; }
#card .hc-city { margin-top: 10px; }
#card .foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--panel-line); }
#card .cc-head { --t: var(--tile); position: relative; display: flex; align-items: center; gap: 13px; margin: -10px -12px 0; padding: 14px; border-radius: 9px 9px 0 0;
  background: var(--tile); background: linear-gradient(150deg, color-mix(in srgb, var(--t) 52%, var(--panel)) 0%, color-mix(in srgb, var(--t) 18%, var(--panel)) 100%);
  border-bottom: 1px solid color-mix(in srgb, var(--t) 45%, var(--panel-line)); }
#card .cc-htext { flex: 1; min-width: 0; padding-inline-end: 22px; }
#card .cc-kick { margin: 0 0 4px; color: color-mix(in srgb, var(--ink) 58%, transparent); font: 700 10px/1.35 var(--font); letter-spacing: .09em; text-transform: uppercase; }
:root[lang="he"] #card .cc-kick { font-size: 11px; letter-spacing: 0; }
#card .cc-kick.flag { color: var(--accent); }
#card .cc-kick .ic { display: inline-block; width: 10px; height: 10px; margin-inline-end: 4px; vertical-align: -1px; }
#card h2.cc-title { margin: 0; color: var(--ink); font: 650 17.5px/1.22 var(--font); letter-spacing: -.01em; text-wrap: balance; }
#card h2.cc-title.big { font-size: 22px; line-height: 1.12; }
#card .cc-sub { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
#card .cc-subrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 3px; }
#card .cc-subrow .cc-sub { flex: 1 1 auto; min-width: 0; margin: 0; }
#card .cc-chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; margin: 0; margin-inline-start: auto; padding: 0 10px;
  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--panel-line)); border-radius: 999px; background: color-mix(in srgb, var(--panel) 82%, transparent);
  color: var(--accent); font: 600 12px/1 var(--font); text-decoration: none; white-space: nowrap; cursor: pointer; }
#card .cc-chip:hover { background: var(--accent-soft); }
#card .cc-chip .ic { flex: none; width: 12px; height: 12px; }
#card .cc-head .cc-chip.cc-icon { position: absolute; top: 6px; inset-inline-end: 34px; justify-content: center; width: 26px; height: 26px; margin: 0; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--accent); }
#card .cc-head .cc-chip.cc-icon:hover { background: var(--accent-soft); }
#card .cc-head .cc-chip.cc-icon .ic { width: 14px; height: 14px; }
#card .cc-head:has(.cc-icon) .cc-htext > :first-child { padding-inline-end: 34px; }
#card .cc-body { padding: 13px 2px 0; }
#card .cc-body > :first-child { margin-top: 0; }
#card .cc-people + .cc-people { margin-top: 10px; }
#card .cc-person { display: flex; align-items: center; gap: 11px; }
#card .cc-person.has-ph { gap: 13px; }
#card .cc-av { --t: var(--tile); flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: color-mix(in srgb, var(--t) 50%, var(--panel)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--t) 70%, var(--panel-line)); color: color-mix(in srgb, var(--ink) 85%, var(--t)); font: 650 12.5px/1 var(--font); letter-spacing: .03em; }
#card .cc-av.big { width: 44px; height: 44px; font-size: 14.5px; }
#card .cc-ph { flex: none; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--panel);
  box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px color-mix(in srgb, var(--t, var(--tile)) 75%, var(--ink) 25%), 0 2px 6px rgba(0,0,0,.18); }
#card .cc-person.big .cc-ph { width: 66px; height: 66px; }
#card .cc-ptext { min-width: 0; }
#card .cc-ptext .lbl { display: block; margin-bottom: 1px; color: var(--muted); font: 700 10px/1.4 var(--font); letter-spacing: .08em; text-transform: uppercase; }
:root[lang="he"] #card .cc-ptext .lbl { font-size: 11px; letter-spacing: 0; }
#card .cc-ptext b { display: block; color: var(--ink); font: 600 14.5px/1.25 var(--font); }
#card .cc-person.big .cc-ptext b { font-size: 16px; }
#card .cc-ptext .pos { display: block; margin-top: 1px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#card .cc-flagrow { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; color: var(--ink); font-size: 13px; line-height: 1.4; }
#card .cc-flagrow .ic { flex: none; width: 14px; height: 14px; margin-top: 2px; color: var(--accent); }
#card .cc-flagrow .lbl { color: var(--muted); }
/* a vaad, as on the main map: where it leads (Florida, New Jersey) its faces in a honeycomb, "Leadership", its name, and
   its members (a row each, with his photo); the head shliach on a line under it */
#card .cc-vaad { display: flex; align-items: center; gap: 15px; margin-bottom: 4px; }
#card .cc-hive { position: relative; flex: none; }
#card .cc-hive img { position: absolute; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--panel);
  box-shadow: 0 0 0 2px var(--panel), 0 1px 4px rgba(0,0,0,.22); }
#card .cc-hive img.hd { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px color-mix(in srgb, var(--t) 75%, var(--ink) 25%), 0 1px 4px rgba(0,0,0,.22); }
#card .cc-vtext { min-width: 0; }
#card .cc-vtext > .lbl { display: block; margin-bottom: 1px; color: var(--muted); font: 700 10px/1.4 var(--font); letter-spacing: .08em; text-transform: uppercase; }
:root[lang="he"] #card .cc-vtext > .lbl { font-size: 11px; letter-spacing: 0; }
#card .cc-vtext > b { display: block; color: var(--ink); font: 600 16px/1.25 var(--font); }
#card .cc-vtext > .pos { display: block; margin-top: 1px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
#card details.vaad { margin-top: 4px; color: var(--muted); font-size: 13px; }
#card details.vaad > summary { cursor: pointer; color: var(--accent); font-size: 13px; }
#card details.vaad > summary::marker { color: var(--accent); }
#card .cc-vaad:has(details.vaad[open]) { align-items: flex-start; }
#card .cc-vaad:has(details.vaad[open]) .cc-hive { display: none; }
#card .cc-vaad:has(details.vaad[open]) .cc-vtext { flex: 1; }
#card details.vaad ul { display: grid; gap: 8px; margin: 10px 0 2px; padding: 0; list-style: none; }
#card details.vaad li.vm { display: flex; flex-direction: row; align-items: center; gap: 10px; color: var(--ink); animation: vm-in .2s ease-out both; }
#card details.vaad .vm-ph { flex: none; width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--tile);
  box-shadow: 0 0 0 2px var(--panel), 0 1px 3px rgba(0,0,0,.2); }
#card details.vaad .vm-av { display: grid; place-items: center; color: var(--ink); font: 600 12px/1 var(--font); background: color-mix(in srgb, var(--t) 40%, var(--panel)); }
#card details.vaad li.hd .vm-ph { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px color-mix(in srgb, var(--t) 75%, var(--ink) 25%), 0 1px 3px rgba(0,0,0,.2); }
#card details.vaad .vm-t { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
#card details.vaad .vm-n { display: flex; flex-wrap: wrap; align-items: center; gap: 0 7px; }
#card details.vaad .vm-n b { color: var(--ink); font-size: 14px; font-weight: 600; }
#card details.vaad .vm-role { padding: 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--t) 42%, var(--panel)); color: var(--ink); font-size: 11px; font-weight: 600; line-height: 18px; }
#card details.vaad .vm-town { color: var(--muted); font-size: 12.5px; }
#card details.vaad li.vm.alt { margin-top: 2px; padding-top: 10px; border-top: 1px dashed var(--panel-line); }
#card details.vaad li.alt .vm-ph { width: 26px; height: 26px; margin-inline: 3px; }
#card details.vaad li.alt .vm-n b { color: var(--muted); font-size: 13px; font-weight: 500; }
#card details.vaad li.alt .vm-town { font-size: 12px; }
@keyframes vm-in { from { opacity: 0; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { #card details.vaad li.vm { animation: none; } }
#card .cc-headrow .pi { flex: none; width: 16px; height: 16px; margin: 1px -1px 0; color: var(--muted); }
#card .cc-headrow .pos { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#card .cc-vline { margin-top: 11px; }
#card .cc-grp { margin: 0 0 8px; }
#card .cc-grp .lbl { color: var(--muted); font: 700 10px/1.4 var(--font); letter-spacing: .08em; text-transform: uppercase; }
:root[lang="he"] #card .cc-grp .lbl { font-size: 11px; letter-spacing: 0; }
#card .cc-grp .pos { color: var(--muted); font-size: 12.5px; }
#card .cc-grp ~ .cc-people + .cc-people { margin-top: 7px; }
#card .cc-vline .lbl { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="stage" role="img"><canvas id="map"></canvas><canvas id="over"></canvas></div>
  <div class="year" id="year"></div>
  <div class="tools">
    <div class="row">
      <button class="chip" id="gear" type="button" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.81 8.47a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
      <button class="chip" id="theme" type="button" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path id="themeIcon" d=""/></svg></button>
      <button class="chip" id="lang" type="button"></button>
      <a class="chip" id="home" href="./" aria-label="Map"><svg viewBox="0 0 24 24"><path d="M15 5.1 9 3 3 5v16l6-2.1 6 2.1 6-2V3l-6 2.1zM10 5.4l4 1.4v11.8l-4-1.4V5.4zM5 6.4l3-1v11.8l-3 1V6.4zm14 11.2-3 1V6.8l3-1v11.8z"/></svg></a>
    </div>
    <div class="seg" id="mode"><button type="button" data-m="shetachim"></button><button type="button" data-m="heads"></button></div>
    <div class="menu" id="menu" hidden><label class="opt"><span id="hyLbl"></span><input type="checkbox" id="hy" role="switch"></label><label class="opt"><span id="ttlLbl" lang="he" dir="rtl"></span><input type="checkbox" id="ttl" role="switch"></label><label class="opt"><span id="fullLbl"></span><input type="checkbox" id="full" role="switch"></label></div>
  </div>
  <div id="card" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const HE = document.documentElement.lang === 'he';
  const L = (en, hb) => (HE ? hb : en);
  const get = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); });
  let topo, sfile, hist, photos, he = null, centers = {};
  try {
    [topo, sfile, hist, photos, he, centers] = await Promise.all([get('data/history-geo.json'), get('data/shetachim.json'), get('../data/shetach-history.json'),
      get('../data/head-photos.json').catch(() => ({ photos: [] })), HE ? get('data/he.json').catch(() => null) : null, get('data/history-centers.json').catch(() => ({}))]);
  } catch (err) {
    const e = $('#err'); e.hidden = false; e.textContent = HE ? 'הנתונים לא נטענו' : "The data didn't load"; return;
  }
  (function decodeArcs(t) {
    if (!t.transform) return;
    const { scale: [kx, ky], translate: [dx, dy] } = t.transform;
    for (const arc of t.arcs) { let x = 0, y = 0; for (const p of arc) { x += p[0]; y += p[1]; p[0] = x * kx + dx; p[1] = y * ky + dy; } }

  })(topo);
  // a long straight edge (a border along a parallel) gets points along it, so the projection bends it as it should
  topo.arcs = topo.arcs.map((arc) => {
    let out = null;

      const [x0, y0] = arc[k - 1], [x1, y1] = arc[k];

    }
    return out || arc;
  });

  // ---------- the data ----------
  const SH = new Map(sfile.shetachim.map((s) => [s.id, s]));
  const pieces = topo.objects.areas.geometries, outside = topo.objects.outside.geometries;
  const isHI = (g) => g.properties.state === 'US-HI';
  // Hebrew years (a setting, on by default in Hebrew): each date counts in the Hebrew year it fell in, and the timeline
  // goes by Hebrew years. A year's slot is its Hebrew year less 3760 (5746's is 1986: most of 1986 was 5746); a date
  // with only a year is taken to be in that Hebrew year, one with a month mid-month. (The browser's own Hebrew calendar;
  // without one, Rosh Hashanah taken as Sept 20.)
  let HY = (() => { try { const v = localStorage.getItem(`shetachim-history-hy-${HE ? 'he' : 'en'}`); return v == null ? HE : v === '1'; } catch (e) { return HE; } })();
  const hebYear = (() => {
    try {
      const f = new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric', timeZone: 'UTC' }), of = (d) => +f.formatToParts(d).find((x) => x.type === 'year').value;
      if (of(new Date(Date.UTC(1986, 0, 1))) !== 5746 || of(new Date(Date.UTC(1975, 8, 20))) !== 5736) throw new Error('no Hebrew calendar');

  })();
  const yr = (s) => {
    const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(String(s)); if (!m) return NaN;
    if (!HY || !m[2]) return +m[1];
    return hebYear(new Date(Date.UTC(+m[1], +m[2] - 1, m[3] ? +m[3] : 15))) - 3760;
  };
  function startOf(p) {
    if (!p) return null;
    if (p.from) return { y: yr(p.from) };
    const b = p.fromBound || {};
    if (b.by) return { y: yr(b.by) };
    if (b.after) return { y: yr(b.after) };
    return null;
  }
  const areaKeys = Object.keys(hist.areas);
  // a piece with no history of its own (New Brunswick, Prince Edward Island) takes that of its shetach's piece that has one;
  // 'sliver': the bit of New York that the borders give to Southern Ontario's piece (left out of names)
  const P = pieces.map((g) => {
    const id = g.properties.id, sid = g.properties.shetach;
    if (g.properties.north) return { g, north: true, sliver: false, periods: [] };
    const key = hist.areas[id] ? id : areaKeys.find((k) => k.split(':')[1] === sid);
    const list = key ? hist.areas[key] : [];
    return { g, sliver: !!key && key !== id && key.slice(0, 2) !== id.slice(0, 2), periods: list.map((p) => ({ sid: p.shetach || null, src: p, st: startOf(p) })).filter((q) => q.st) };
  });
  let FULL = (() => { try { const q = new URLSearchParams(location.search).get('full'); if (q === '1' || q === '0') return q === '1'; return localStorage.getItem('shetachim-history-full') === '1'; } catch (e) { return false; } })();
  // a province's north goes with its biggest piece (Ontario's with Southern Ontario's, Quebec's with Quebec's)
  const mainOfState = new Map();
  pieces.forEach((g, i) => {
    if (P[i].north || P[i].sliver || g.properties.country !== 'CA') return;
    const a = d3.geoArea(topojson.feature(topo, g)), m = mainOfState.get(g.properties.state);
    if (!m || a > m.a) mainOfState.set(g.properties.state, { i, a });
  });
  // (a shetach is shown only in years it has a head the history gives: owner, Nov 9, "How can you have a shetach with no
  // head shliach?")
  const ownSid = (i, Y) => { let s = null; for (const q of P[i].periods) if (q.st.y <= Y) s = q.sid; return s && headAt(s, Y) ? s : null; };
  const sidAt = (i, Y, full = FULL) => { if (!P[i].north) return ownSid(i, Y); const m = mainOfState.get(pieces[i].properties.state); return full && m ? ownSid(m.i, Y) : null; };
  const sidStart = new Map();
  // the heads and flagships are the history's own, and only those: nothing of today's is put back in time where the
  // history has nothing (owner, Nov 9)
  const headsOf = (sid) => hist.heads[sid] || [];
  function headAt(sid, Y) {
    const hs = headsOf(sid); let k = -1;
    hs.forEach((x, j) => { const st = startOf(x); const y = st ? st.y : (j === 0 ? -Infinity : null); if (y != null && y <= Y) k = j; });
    if (k < 0) return null;
    const next = hs[k + 1] && startOf(hs[k + 1]);
    const st = startOf(hs[k]);

  }
  // the flagship that year: where the head's own center was (hist.flagships)
  function flagAt(sid, Y) {
    const list = (hist.flagships || {})[sid] || [];
    let f = null; for (const x of list) { const st = startOf(x); if (st && st.y <= Y) f = x; }
    return f;
  }
  // the flagship that year and its years at that place
  function flagSpan(sid, Y) {
    const list = (hist.flagships || {})[sid];
    if (!list) return { from: null, to: null };
    let k = -1; list.forEach((x, j) => { const st = startOf(x); if (st && st.y <= Y) k = j; });
    const nx = list[k + 1] && startOf(list[k + 1]);
    return { from: startOf(list[k]).y, to: nx ? nx.y : null };
  }
  // the vaad that year (hist.vaads: Florida's, New Jersey's) and its years; each lasts until the next
  const vaadsOf = (sid) => (hist.vaads || {})[sid] || [];
  function vaadAt(sid, Y) {
    const vs = vaadsOf(sid); let k = -1;
    vs.forEach((v, j) => { const st = startOf(v); if (st && st.y <= Y) k = j; });
    if (k < 0) return null;
    const nx = vs[k + 1] && startOf(vs[k + 1]);
    return { v: vs[k], n: k, from: startOf(vs[k]).y, to: nx ? nx.y : null };
  }
  // the timeline (by the ordinary years, or by Hebrew years): when each piece's periods start, each shetach's start, the
  // years where anything changes
  let NOW, MIN, MAX, CHANGES;
  function setTimeline(hy) {
    HY = hy;
    for (const a of P) for (const q of a.periods) q.st = startOf(q.src);
    sidStart.clear();
    for (const a of P) for (const q of a.periods) if (q.sid && (!sidStart.has(q.sid) || q.st.y < sidStart.get(q.sid))) sidStart.set(q.sid, q.st.y);
    const years = new Set();
    for (const a of P) for (const q of a.periods) years.add(q.st.y);
    for (const sid of sidStart.keys()) for (const x of headsOf(sid)) { const st = startOf(x); if (st) years.add(st.y); }
    for (const fs of Object.values(hist.flagships || {})) for (const x of fs) { const st = startOf(x); if (st) years.add(st.y); }
    for (const vs of Object.values(hist.vaads || {})) for (const x of vs) { const st = startOf(x); if (st) years.add(st.y); }
    const today = new Date();

    MIN = Math.min(...years); MAX = Math.max(NOW, ...[...years].filter((y) => y <= NOW));

  }

  // a year as shown: 1986; with Hebrew years 5746, and in Hebrew תשמ״ו
  function gem(n) {
    const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'], tens = ['', 'י', 'כ', 'ל', 'מ', 'נ', 'ס', 'ע', 'פ', 'צ'], hund = ['', 'ק', 'ר', 'ש', 'ת'];

    return s.length > 1 ? `${s.slice(0, -1)}״${s.slice(-1)}` : `${s}׳`;
  }
  const yearText = (y) => (y == null ? '' : !HY ? String(y) : HE ? gem((y + 3760) % 1000) : String(y + 3760));

  // ---------- each year's shetachim: which piece is whose ----------
  const CFG = new Map(), CFGY = new Map();
  setTimeline(HY);
  function config(Y) {
    const yk = `${Y}|${FULL ? 1 : 0}`;
    let c = CFGY.get(yk); if (c) return c;
    const s = pieces.map((_, i) => sidAt(i, Y));
    const key = s.join('|');
    c = CFG.get(key);
    if (!c) {
      const groups = new Map();
      s.forEach((sid, i) => { if (sid) (groups.get(sid) || groups.set(sid, []).get(sid)).push(i); });
      for (const [sid, idx] of groups) { idx.key = idx.join(','); idx.sid = sid; }
      c = { key, s, groups }; CFG.set(key, c);
    }
    CFGY.set(yk, c);
    return c;
  }

  // ---------- names: what the shetach covered that year ----------
  const PART = { 'US-NJ:south-jersey': ['South Jersey', 'דרום ניו ג׳רזי'], 'US-OH:southeast-ohio': ['Southeast Ohio', 'דרום־מזרח אוהיו'],
    'US-PA:pittsburgh': ['Pittsburgh', 'פיטסבורג'], 'CA-QC:montreal': ['Montreal', 'מונטריאול'], 'US-MA:worcester': ['Worcester', 'ווסטר'] };
  const partNames = sfile.partNames || {};
  const stateName = (st, i) => {
    if (st === 'US-DC') return HE ? 'וושינגטון הבירה' : 'DC';
    if (HE && he && he.areas && he.areas[st]) return he.areas[st];
    return pieces[i].properties.name;
  };
  const piecesOfState = new Map();
  pieces.forEach((g, i) => { if (!P[i].sliver && !P[i].north) (piecesOfState.get(g.properties.state) || piecesOfState.set(g.properties.state, []).get(g.properties.state)).push(i); });
  const todayOf = new Map();
  pieces.forEach((g, i) => { if (!P[i].sliver) (todayOf.get(g.properties.shetach) || todayOf.set(g.properties.shetach, new Set()).get(g.properties.shetach)).add(i); });
  const todayName = (sid) => { const t = HE && he && he.shetachim && he.shetachim[sid]; return (t && t.name) || (SH.get(sid) || {}).name || sid; };
  const join = (list) => { if (list.length < 2) return list[0]; const last = list[list.length - 1]; return HE ? `${list.slice(0, -1).join(', ')} ${last.startsWith('ו') ? 'ו־' : 'ו'}${last}` : `${list.slice(0, -1).join(', ')} & ${last}`; };
  // a name a shetach had in its years (hist.names: Alevsky's 'Cleveland' until the shetach grew, owner, Nov 9)
  const namedAt = (sid, Y) => { let n = null; for (const x of (hist.names || {})[sid] || []) { const st = startOf(x); if (st && st.y <= Y) n = x; } return n && n.name ? L(n.name, n.nameHe || n.name) : null; };
  function nameOf(sid, Y) {
    const named = namedAt(sid, Y); if (named) return named;
    const c = config(Y);
    const idx = (c.groups.get(sid) || []).filter((i) => !P[i].sliver && !P[i].north);
    if (!idx.length) return todayName(sid);
    const ids = new Set(idx.map((i) => pieces[i].properties.id));
    const states = new Map(); for (const i of idx) (states.get(pieces[i].properties.state) || states.set(pieces[i].properties.state, []).get(pieces[i].properties.state)).push(i);
    const whole = (st) => (piecesOfState.get(st) || []).every((i) => c.s[i] === sid);
    if (sid === 'washington' && states.size > 1) return L('Pacific Northwest', 'צפון מערב האוקיינוס השקט');
    if (sid === 'virginia' && states.has('US-WV')) return L('The Virginias', 'וירג׳יניה ומערב וירג׳יניה');
    if (sid === 'southern-ohio' && states.size === 1 && ids.has('US-OH:central-ohio')) return L('Southern & Central Ohio', 'דרום ומרכז אוהיו');
    if (sid === 'southern-ohio' && states.size > 1) return join(['US-OH', 'US-IN', 'US-KY'].filter((st) => states.has(st)).map((st) => stateName(st, states.get(st)[0])));
    const today = todayOf.get(sid) || new Set();
    if (today.size === idx.length && idx.every((i) => today.has(i))) return todayName(sid);
    // all it had was one state (Minnesota for the Upper Midwest, California for the West Coast) or one part with a name
    if (states.size === 1) {
      const [st, list] = [...states][0];
      if (whole(st)) return stateName(st, list[0]);
      if (list.length === 1) { const id = pieces[list[0]].properties.id, pn = PART[id] || (partNames[st] && partNames[st][pieces[list[0]].properties.shetach]); if (pn) return HE ? pn[1] : pn[0]; }

    return todayName(sid);
  }

  // ---------- heads ----------
  const NAME_FORMS = [['avrohom', 'avraham', 'avremel', 'avremi'], ['yisroel', 'yisrael'], ['sheya', 'shea'], ['mendel', 'mendy', 'menachem'], ['yaakov', 'yakov', 'jacob', 'yankel'],
    ['boruch', 'baruch'], ['sholom', 'shalom'], ['yosef', 'joseph', 'yossi', 'yossel'], ['yitzchok', 'yitzchak'], ['moshe', 'moishe'], ['bentzion', 'benjy'], ['zushe', 'zusha']];
  const form = (w) => { const n = String(w || '').toLowerCase().normalize('NFD').replace(/[^a-z]/g, ''); const f = NAME_FORMS.find((g) => g.includes(n)); return f ? f[0] : n; };
  const tokens = (name) => String(name || '').replace(/[()]/g, ' ').split(/\s+/).filter(Boolean);
  const sameMan = (a, b) => {
    const x = tokens(a), y = tokens(b); if (!x.length || !y.length) return false;
    if (form(x[x.length - 1]) !== form(y[y.length - 1])) return false;
    const gx = new Set(x.slice(0, -1).map(form)); return y.slice(0, -1).some((w) => gx.has(form(w)));
  };
  const WORLD_HQ = '117678'; // 770
  const PHOTO = new Map(); for (const p of photos.photos || []) (PHOTO.get(p.id) || PHOTO.set(p.id, []).get(p.id)).push(p);
  const photoOf = (sid, h) => { const p = (PHOTO.get(sid) || []).find((r) => sameMan(r.head, h.x.head)); return p ? p.file : ''; };
  const CAP = new Map(); for (const s of sfile.shetachim) for (const c of (s.capitals || (s.capital ? [s.capital] : []))) if (c && c.centerId) CAP.set(String(c.centerId), c);
  const heWords = (name) => { const w = tokens(name), last = w.pop(); if (!he) return name;
    return [...w.map((x) => (he.first && he.first[x]) || x), (he.last && he.last[last]) || last].join(' '); };
  // a group with no one over them (Pittsburgh's first kevutzah of three bochurim: owner, Nov 9, "three bochurim, no
  // hanholo"; "Name it ... kevutzah"): its role is its name, its members' names under it

  const headName = (sid, h) => {

    if (h.x.he) return h.x.he;

    return h.last && t && t.headShliach && sameMan(h.x.head, (SH.get(sid) || {}).headShliach) ? t.headShliach : heWords(h.x.head);
  };
  // a head's surname (Heads, where the whole name has no room): in Hebrew as the dictionary has it (שם טוב, not טוב)
  const surnameOf = (sid, h) => { if (h.x.group) return roleOf(h); const w = tokens(h.x.head), last = w[w.length - 1] || '';
    if (!HE) return last;
    const d = he && he.last && he.last[last]; if (d) return d;

  const initialsOf = (name) => { const w = tokens(name).filter((x) => !/^(family|משפחת)$/i.test(x)); return w.length ? (w[0][0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase() : ''; };

  // ---------- colours: one per shetach (or per head, in Heads) for the whole timeline; neighbours never share one ----------
  const NB = topojson.neighbors(pieces);
  function colouring(keyAt) {
    const adj = new Map(); const touch = (k) => adj.get(k) || adj.set(k, new Set()).get(k);
    // (over both timelines, so the colours stay put when the Hebrew years are switched on or off)
    const was = HY;
    for (const hy of [false, true]) {
      setTimeline(hy);
      for (const Y of CHANGES) {
        const s = pieces.map((_, i) => keyAt(i, Y));
        NB.forEach((list, i) => { if (!s[i]) return; touch(s[i]); for (const j of list) if (s[j] && s[j] !== s[i]) { touch(s[i]).add(s[j]); touch(s[j]).add(s[i]); } });
      }
    }
    setTimeline(was);
    // neighbours never alike; neighbours' neighbours not alike either where the colours allow (Greater New York and
    // Pennsylvania across New Jersey)
    const color = new Map(), used = new Array(8).fill(0);
    [...adj.keys()].sort((a, b) => adj.get(b).size - adj.get(a).size || (a < b ? -1 : 1)).forEach((k) => {
      const taken = new Set([...adj.get(k)].map((n) => color.get(n)));
      const near = new Set(); for (const n of adj.get(k)) for (const m of adj.get(n)) if (m !== k) near.add(color.get(m));
      let best = -1; const score = (c) => (near.has(c) ? 1000 : 0) + used[c];
      for (let c = 0; c < 8; c++) if (!taken.has(c) && (best < 0 || score(c) < score(best))) best = c;
      if (best < 0) best = 0; color.set(k, best); used[best]++;
    });
    return color;
  }
  const headKey = (sid, Y) => { if (!sid) return null; const h = headAt(sid, Y); return h ? `${sid}|${h.x.head}` : sid; };
  const COL_S = colouring((i, Y) => sidAt(i, Y, true));
  const COL_H = colouring((i, Y) => headKey(sidAt(i, Y, true), Y));
  let MODE = (() => { try { const q = new URLSearchParams(location.search).get('mode'); if (q === 'heads' || q === 'shetachim') return q; return localStorage.getItem('shetachim-history-mode') === 'heads' ? 'heads' : 'shetachim'; } catch (e) { return 'shetachim'; } })();
  const colourIdx = (sid, Y) => { if (!sid) return null; const c = (MODE === 'heads' ? COL_H : COL_S).get(MODE === 'heads' ? headKey(sid, Y) : sid); return c == null ? null : c; };
  // (for the cards, which take the theme's own colours)
  const colourOf = (sid, Y) => { const c = colourIdx(sid, Y); return c == null ? 'var(--land)' : `var(--c${c + 1})`; };
  let COL = {};
  function palette() {
    const cs = getComputedStyle(document.documentElement), v = (n) => cs.getPropertyValue(n).trim();

  }
  const paintOf = (sid, Y) => { const c = colourIdx(sid, Y); return c == null ? COL.land : COL.c[c]; };

  // ---------- the drawing: on canvases, every line projected once, at four levels of detail ----------
  // (the map on one; the stars, the names and the outlines over it on another, redrawn on their own: a flash or a pick
  // redraws only those. While the map is being moved the map's canvas is slid and scaled as it is, by the browser, and
  // drawn again a few times a second and when the move ends; the names and stars are drawn afresh every frame)
  const stage = $('#stage'), base = $('#map'), over = $('#over');
  const bctx = base.getContext('2d'), octx = over.getContext('2d');
  stage.setAttribute('aria-label', L('Map of the shetachim by year', 'מפת השטחים לפי שנה'));

  // the head shliach under a vaad that leads: one line, his mark a fedora over a bearded face (the main map's)
  const HEAD_ICON = '<svg class="pi" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 6.2C4.9 5.3 11.1 5.3 14.2 6.2M4.9 5.6C4.8 3.6 5.4 2 6.6 1.9C7.3 1.8 7.6 2.4 8 2.4S8.7 1.8 9.4 1.9C10.6 2 11.2 3.6 11.1 5.6M4.9 7.4C4.9 10.6 6 13.1 7.3 14C7.7 14.3 8.3 14.3 8.7 14C10 13.1 11.1 10.6 11.1 7.4M6.6 10C7.5 10.6 8.5 10.6 9.4 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const headRow = (sid, h) => `<div class="cc-flagrow cc-headrow">${HEAD_ICON}<span><span class="lbl">${esc(roleOf(h))}:</span> ${esc(headName(sid, h))} <span class="pos">· ${esc(yearsOf(h.from, h.to))}</span></span></div>`;
  // the head and the vaad that year: a vaad that leads above him (vaadFirst), any other under him
  function leadHTML(sid, h, t, big, Y) {
    const vz = vaadAt(sid, Y);
    if (vz && vz.v.vaadFirst) return `${vaadBlock(vz, t)}${headRow(sid, h)}`;
    if (!vz) return headBlock(sid, h, t, big, Y);
    const list = vz.v.membersKnown === false ? [] : vz.v.members || [];
    const line = `<span class="lbl">${L('Leadership', 'הנהלה')}:</span> ${vaadName(vz.v)} <span class="pos">· ${esc(vaadWhen(vz))}</span>`;
    return `${headBlock(sid, h, t, big, Y)}<div class="cc-vline">${list.length ? membersHTML(list, line, t) : `<div class="cc-flagrow cc-headrow" style="margin-top:0"><span>${line}</span></div>`}</div>`;
  }
  // a shetach: its colour, its name that year big; its head (and vaad) that year; its flagship
  function shetachCard(sid, Y) {
    const t = colourOf(sid, Y), h = headAt(sid, Y), f = flagAt(sid, Y);
    const body = `${h ? leadHTML(sid, h, t, true, Y) : ''}${f ?`<div class="cc-flagrow">${f.kind ? icon('dot') : icon('star')}<span><span class="lbl">${f.kind ? kindOf(f) : L('Flagship', 'מוסד מרכזי')}:</span> ${esc([flagName(sid, f), flagCity(sid, f)].filter(Boolean).join(', '))}</span></div>` : ''}`;
    return `${ccHead({ t, title: esc(nameOf(sid, Y)), big: true })}${body ? `<div class="cc-body">${body}</div>` : ''}`;
  }
  function selectSid(sid) { selected = { sid }; showCard(); }
  function selectFlag(sid) { selected = { sid, flag: true }; showCard(); }
  function closeCard() { if (!selected && card.hidden) return; selected = null; card.hidden = true; card.dataset.html = ''; redraw('over'); }
  function showCard() {
    const Y = cur.Y, sid = selected.sid;
    if (!config(Y).groups.has(sid)) return closeCard();
    const h = headAt(sid, Y), f = selected.flag ? flagAt(sid, Y) : null;
    if (selected.flag && !f) return closeCard();
    // (770, and Crown Heights with it, whose heads are the Rebbeim)
    const world = selected.flag ? String(f.centerId) === WORLD_HQ : !!(h && h.x.portrait);
    const html = world ? worldCard(sid, Y) : selected.flag ? flagCard(sid, Y) : shetachCard(sid, Y);
    if (card.dataset.html !== html) { card.innerHTML = html + CLOSE; card.dataset.html = html; }
    card.classList.toggle('world', world);
    card.hidden = false;
    redraw('over');
  }
  card.addEventListener('click', (e) => { if (e.target.closest('.close')) closeCard(); });

  // ---------- moving round the map ----------
  let moved = false;
  d3.select(stage).call(d3.zoom().scaleExtent([1, 40])
    .on('start', () => { gestureLevel = levelFor(T.k); moved = slowOver = false; ema = 16; shownAt = performance.now(); })
    .on('zoom', (ev) => { T = ev.transform; moving = moved = true; redraw(); })
    .on('end', () => { gestureLevel = null; moving = false; if (moved) redraw(); }))
    .on('dblclick.zoom', null);
  stage.addEventListener('click', (ev) => {
    const r = stage.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
    const st = starAt(x, y); if (st) return selectFlag(st.sid);
    const sid = sidAtPoint(x, y); if (sid) selectSid(sid); else closeCard();
  });
  let hov = null, hovRaf = 0;
  stage.addEventListener('pointermove', (ev) => {
    if (ev.pointerType !== 'mouse' || ev.buttons) return;
    const r = stage.getBoundingClientRect(); hov = [ev.clientX - r.left, ev.clientY - r.top];
    if (!hovRaf) hovRaf = requestAnimationFrame(() => { hovRaf = 0; stage.style.cursor = starAt(...hov) || sidAtPoint(...hov) ? 'pointer' : ''; });
  });

  // ---------- controls ----------
  const urlState = {}; let urlT = 0;
  // (the address kept up to date, at most a few times a second: browsers refuse a flood of these)
  function urlSet(o) { Object.assign(urlState, o); clearTimeout(urlT); urlT = setTimeout(() => { try { const q = new URLSearchParams(location.search); for (const [k, v] of Object.entries(urlState)) q.set(k, v); history.replaceState(null, '', `${location.pathname}?${q}`); } catch (e) {} }, 300); }
  const slider = $('#slider'); slider.min = MIN; slider.max = MAX;
  slider.addEventListener('input', () => { stop(); render(+slider.value); });
  let timer = null;
  const playIcon = $('#playIcon');
  function stop() { if (timer) { clearInterval(timer); timer = null; playIcon.setAttribute('d', 'M7 5v14l12-7z'); $('#play').setAttribute('aria-label', 'Play'); } }
  function play() {
    if (timer) return stop();
    if (cur.Y >= MAX) render(MIN, false);
    playIcon.setAttribute('d', 'M6 5h4v14H6zM14 5h4v14h-4z'); $('#play').setAttribute('aria-label', 'Pause');
    timer = setInterval(() => { if (cur.Y >= MAX) return stop(); render(cur.Y + 1); }, 650);
  }
  $('#play').onclick = play;
  $('#prev').onclick = () => { stop(); const y = [...CHANGES].reverse().find((v) => v < cur.Y); if (y != null) render(y, false); };
  $('#next').onclick = () => { stop(); const y = CHANGES.find((v) => v > cur.Y); if (y != null) render(y, false); };
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { stop(); render(cur.Y + (e.key === 'ArrowRight' ? 1 : -1)); e.preventDefault(); }
    if (e.key === ' ') { play(); e.preventDefault(); }
    if (e.key === 'Escape') closeCard();
  });
  // Shetachim / Heads
  const modeBtns = [...document.querySelectorAll('#mode button')];
  modeBtns[0].textContent = L('Shetachim', 'שטחים');
  modeBtns[1].textContent = L('Heads', 'שלוחים');
  const setMode = (m) => {
    MODE = m; modeBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
    try { localStorage.setItem('shetachim-history-mode', m); } catch (e) {}
    urlSet({ mode: m });
  };
  modeBtns.forEach((b) => { b.onclick = () => { if (MODE === b.dataset.m) return; setMode(b.dataset.m); render(cur.Y, false); }; });
  setMode(MODE);
  // the Canadian provinces whole, or (as on the main map) only their shetachim's parts
  const fullBtn = $('#full');
  $('#fullLbl').textContent = L('Full provinces', 'מחוזות מלאים');
  const setFull = (v) => {
    FULL = v; fullBtn.checked = v;
    try { localStorage.setItem('shetachim-history-full', v ? '1' : '0'); } catch (e) {}
    urlSet({ full: v ? '1' : '0' });
  };
  fullBtn.onchange = () => { setFull(fullBtn.checked); render(cur.Y, false); warm(); };
  setFull(FULL);
  // Hebrew years, and the Rebbeim's full titles: each kept for the language it was set in (both on by default in Hebrew)
  const keep = (k, v) => { try { localStorage.setItem(`shetachim-history-${k}-${HE ? 'he' : 'en'}`, v ? '1' : '0'); } catch (e) {} };
  const hyBtn = $('#hy'), ttlBtn = $('#ttl');
  $('#hyLbl').textContent = L('Hebrew years', 'שנים עבריות');
  $('#ttlLbl').textContent = HONOR;
  hyBtn.checked = HY; ttlBtn.checked = TITLES;
  hyBtn.onchange = () => { keep('hy', hyBtn.checked); setTimeline(hyBtn.checked); slider.min = MIN; slider.max = MAX; render(cur.Y, false); warm(); };
  ttlBtn.onchange = () => { TITLES = ttlBtn.checked; keep('titles', TITLES); if (selected) showCard(); };
  // settings: a menu behind the gear
  const gear = $('#gear'), menu = $('#menu');
  gear.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; gear.setAttribute('aria-expanded', String(!menu.hidden)); };
  document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target) && e.target !== gear) { menu.hidden = true; gear.setAttribute('aria-expanded', 'false'); } });
  // light / dark
  const SUN = 'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1.2 3h-2.4L12 2zm0 20-1.2-3h2.4L12 22zM2 12l3-1.2v2.4L2 12zm20 0-3 1.2v-2.4l3 1.2zM4.9 4.9l3 1.3-1.7 1.7-1.3-3zm14.2 14.2-3-1.3 1.7-1.7 1.3 3zM4.9 19.1l1.3-3 1.7 1.7-3 1.3zM19.1 4.9l-1.3 3-1.7-1.7 3-1.3z';
  const MOON = 'M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a8.5 8.5 0 1 0 11 11z';
  const dark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  const themeIcon = () => $('#themeIcon').setAttribute('d', dark() ? SUN : MOON);
  const retheme = () => { themeIcon(); palette(); tweens.clear(); if (cur.Y != null) render(cur.Y, false); };
  $('#theme').onclick = () => { const t = dark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('shetachim-theme', t); } catch (e) {} retheme(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  const langBtn = $('#lang');
  langBtn.textContent = HE ? 'EN' : 'עב';
  langBtn.onclick = () => { try { localStorage.setItem('shetachim-lang', HE ? 'en' : 'he'); } catch (e) {} const q = new URLSearchParams(location.search); q.set('lang', HE ? 'en' : 'he'); location.search = q.toString(); };
  $('#home').href = HE ? './?lang=he' : './';
  function initialYear() { const q = +new URLSearchParams(location.search).get('y'); return q >= MIN && q <= MAX ? q : MAX; }
  // the other years' label spots and shapes worked out ahead while the page is idle (a little at a time, and not while
  // the map is being moved), so play runs smoothly
  let warmGen = 0;
  function warm() {
    const gen = ++warmGen, ys = [...CHANGES].reverse();
    const idle = window.requestIdleCallback ? (f) => requestIdleCallback(f, { timeout: 1000 }) : (f) => setTimeout(() => f(null), 50);
    let queue = [];
    const step = (dl) => {
      if (gen !== warmGen) return;
      if (gestureLevel != null || timer) return idle(step);
      const end = performance.now() + Math.min(10, dl && dl.timeRemaining ? Math.max(2, dl.timeRemaining()) : 8);
      while (performance.now() < end) {
        if (!queue.length) { const y = ys.shift(); if (y == null) return; queue = [...config(y).groups.values()]; continue; }
        const idx = queue.shift(); spotOf(idx); groupPath(idx, 0);
      }
      idle(step);
    };
    idle(step);
  }
  let rt = null; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
  palette(); themeIcon();
  layout();
  // the names drawn in the page's own fonts once they are in
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`600 12px Inter`), HE ? document.fonts.load('600 12px Heebo', 'אבג') : null]).then(() => { WID.clear(); redraw('all'); }, () => {});
  window.__history = { nameOf: (sid, Y) => nameOf(sid, Y), groups: (Y) => [...config(Y).groups.keys()], headAt: (sid, Y) => { const h = headAt(sid, Y); return h && h.x.head; },
    stats: () => ({ ms: +lastMs.toFixed(2), k: T.k, level: levelNow(T.k), points: PA.map((A) => A.reduce((n, r) => n + r.length / 2, 0)) }),
    screen: (lon, lat) => T.apply(proj([lon, lat])), spot: (sid, Y) => { const idx = config(Y).groups.get(sid); return idx ? spotOf(idx) : null; } };
})();
</script>
</body>
</html>
